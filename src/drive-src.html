<html lang="en">
<head>

<style>
:root { --bg:#e9eee6; --panel:#f7f9f4; --ink:#15211a; --muted:#5a6b5f; --line:#cfd8cc; --field:#1d6a3b; --gold:#b07a0c; --good:#1d7a43; --bad:#b3372a;
  --display:'Graduate',Georgia,serif; --body:'Barlow',system-ui,sans-serif; --cond:'Barlow Condensed','Arial Narrow',sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0d1611; --panel:#15211a; --ink:#e5ebe2; --muted:#93a596; --line:#263a2d; --gold:#e2b444; --good:#57c27e; --bad:#e76a5a; } }
:root[data-theme="dark"] { --bg:#0d1611; --panel:#15211a; --ink:#e5ebe2; --muted:#93a596; --line:#263a2d; --gold:#e2b444; --good:#57c27e; --bad:#e76a5a; }
* { box-sizing: border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--body); -webkit-text-size-adjust:100%; overscroll-behavior:none; }
body { position:fixed; inset:0; overflow:hidden; background:#17482b; }
#stage { position:absolute; inset:0; }
/* a slim scoreboard over the top of the field */
#bar { position:absolute; z-index:3; top:0; left:50%; transform:translateX(-50%); width:min(560px, calc(100% - 24px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px)));
  height:32px; background:rgba(10,22,15,.86); color:#fff; padding:0 10px; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px;
  font-family:var(--cond); letter-spacing:.04em; border-radius:0 0 12px 12px; margin-top:env(safe-area-inset-top,0px); }
#bar .tm { font-family:var(--display); font-size:14px; display:flex; align-items:center; gap:8px; }
#bar .tm.r { justify-content:flex-end; }
#bar .sc { font-family:var(--display); font-size:19px; min-width:26px; text-align:center; }
#bar .mid { text-align:center; font-size:13px; text-transform:uppercase; opacity:.95; line-height:1; white-space:nowrap; }
#bar .mid b { font-size:13px; margin-right:6px; }
#rot { display:none; position:fixed; inset:0; z-index:20; background:#0d1611; color:#e5ebe2; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px; font-family:var(--cond); font-size:20px; letter-spacing:.04em; }
#rot .ph { width:46px; height:80px; border:3px solid #e2b444; border-radius:9px; animation:turn 2.2s ease-in-out infinite; }
@keyframes turn { 0%,25% { transform:rotate(0) } 55%,100% { transform:rotate(-90deg) } }

body.portrait #rot { display:flex; }
canvas { display:block; width:100%; height:100%; touch-action:none; -webkit-user-select:none; user-select:none; }
#hud { position:absolute; left:0; right:0; top:42px; z-index:2; display:flex; justify-content:center; pointer-events:none; }
#msg { background:rgba(10,20,14,.82); color:#fff; font-family:var(--cond); font-size:20px; letter-spacing:.05em; text-transform:uppercase; padding:6px 14px; border-radius:8px; opacity:0; transition:opacity .2s; }
#msg.on { opacity:1; }

#btns { position:absolute; right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(36px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; }

.big.alt { background:#f2f4ef; color:#15211a; }
.kbar { position:relative; height:34px; border-radius:10px; background:#24302a; margin:10px 0 12px; overflow:hidden; }
.kwin { position:absolute; top:0; bottom:0; background:rgba(226,180,68,.35); border-left:3px solid #e2b444; border-right:3px solid #e2b444; }
.kmark { position:absolute; top:5px; width:14px; height:24px; border-radius:50%; background:#7a3f17; border:2px solid #fff; left:calc(50% - 7px); }
.big:active { transform:translateY(1px); }
#sheet { position:absolute; z-index:4; left:max(8px, env(safe-area-inset-left,0px)); right:max(8px, env(safe-area-inset-right,0px)); bottom:0; background:var(--panel); border:1px solid var(--line); border-bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); max-height:calc(100% - 40px); overflow:auto; border-radius:16px 16px 0 0; box-shadow:0 -6px 20px rgba(0,0,0,.25); }
#sheet h3 { margin:0 0 4px; font-family:var(--cond); font-size:15px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }

.plays { display:grid; grid-template-columns:repeat(6,1fr); gap:6px; }

.mini { font-family:var(--cond); font-weight:600; font-size:13px; letter-spacing:.05em; text-transform:uppercase; border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
.play small { display:block; font-weight:500; color:var(--muted); font-size:12px; }
.row { display:flex; gap:8px; flex-wrap:wrap; }
.row .big { flex:1; }
select { font:inherit; padding:9px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); width:100%; }

.box { font-size:14px; line-height:1.5; }

.note { font-size:12px; color:var(--muted); }

<script>
(function () {
'use strict';
const G = window.GG;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const W = 53.33; // field width, yards

/* ---------- loading the league ---------- */
async function loadSaved() {
  const unpack = async v => {
    if (!v) return null;
    if (v.gz === 1) {
      let buf = v.data;
      if (typeof buf === 'string') { const b = atob(buf), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); buf = u.buffer; }
      const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      return JSON.parse(txt);
    }
    return v;
  };
  try {
    const db = await new Promise((res, rej) => { const rq = indexedDB.open('gridiron-gm', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    const v = await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get('league'); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); });
    const L = await unpack(v); if (L && L.teams) return L;
  } catch (e) { /* no IndexedDB here */ }
  try { const s = localStorage.getItem('gg-league'); if (s) { const L = await unpack(JSON.parse(s)); if (L && L.teams) return L; } } catch (e) { /* none */ }
  return null;
}
let L = null, demo = false;
function teamData(tid) {
  const t = L.teams[tid], d = G.depth(L, tid), F = G.startersFor(L, tid), r = G.ratings(L, tid);
  const mk = p => p ? { id: p.id, name: p.name, last: p.name.split(' ').slice(-1)[0], num: p.num || '', ovr: G.eff(p), pos: p.pos, grp: p.grp } : { name: 'Backup', last: 'Backup', num: '', ovr: 45, pos: '', grp: '' };
  const pick = (g, n) => { const out = []; for (let i = 0; i < n; i++) out.push(mk(d[g][i])); return out; };
  const os = G.SCHEME[t.coach.os], ds = G.SCHEME[t.coach.ds];
  return { id: tid, abbr: t.abbr, city: t.city, name: t.name, F, off: r.off, def: r.def, os, ds, fam: (os && os.fam) || t.coach.off || 'bal', dfam: (ds && ds.fam) || t.coach.def || 'bal',
    QB: pick('QB', 1)[0], RB: pick('RB', Math.max(1, F.RB)), WR: pick('WR', Math.max(2, F.WR)), TE: pick('TE', Math.max(1, F.TE)), OL: pick('OL', 5),
    DL: pick('DL', F.DL), LB: pick('LB', F.LB), DB: pick('DB', F.DB), K: mk(d.K[0]), avg: g => { const a = pick(g, F[g] || 1); return a.reduce((s, x) => s + x.ovr, 0) / a.length; } };
}

/* ---------- speed and skill from ratings ---------- */
const BASE = { QB: 7.6, RB: 8.9, WR: 9.1, TE: 8.1, OL: 6.0, DL: 7.2, LB: 8.1, DB: 8.9 };
const spd = (role, ovr) => BASE[role] * (0.84 + (ovr - 50) / 170);

/* ---------- playbook ---------- */
// Routes are waypoints relative to the player's start: [dx (toward the middle +), dy downfield].
const ROUTES = {
  slant: [[0, 2], [5, 6], [11, 9]], go: [[0, 40]], curl: [[0, 12], [-0.5, 10.5]], out: [[0, 9], [-9, 9]], post: [[0, 12], [7, 28]], corner: [[0, 12], [-7, 26]],
  dig: [[0, 11], [14, 11]], seam: [[0, 30]], flat: [[-7, 1.5], [-10, 2.5]], wheel: [[-6, 1], [-8, 6], [-8, 30]], drag: [[2, 3], [16, 4]], hitch: [[0, 6], [0, 5]], block: null, check: [[-4, 3], [-5, 5]]
};
const PLAYS = [
  { id: 'quick', name: 'Quick slants', sub: 'Beat the blitz', run: false, wr: ['slant', 'slant', 'hitch', 'slant', 'hitch'], te: ['flat', 'drag'], rb: ['check', 'block'], drop: 3 },
  { id: 'curl', name: 'Curl / flat', sub: 'Underneath', run: false, wr: ['curl', 'curl', 'drag', 'out', 'hitch'], te: ['seam', 'flat'], rb: ['flat', 'block'], drop: 5 },
  { id: 'verts', name: 'Four verticals', sub: 'Stretch them deep', run: false, wr: ['go', 'go', 'seam', 'go', 'post'], te: ['seam', 'block'], rb: ['check', 'block'], drop: 7 },
  { id: 'deep', name: 'Play-action shot', sub: 'Post and corner', run: false, pa: true, wr: ['post', 'corner', 'dig', 'go', 'out'], te: ['drag', 'block'], rb: ['block', 'block'], drop: 7 },
  { id: 'inside', name: 'Inside run', sub: 'Between the tackles', run: 'in' },
  { id: 'outside', name: 'Outside run', sub: 'Toss to the edge', run: 'out' }
];
function playOrder(fam) {
  const p = PLAYS.slice();
  if (fam === 'run') return [p[4], p[5], p[1], p[3], p[0], p[2]];
  if (fam === 'pass') return [p[0], p[1], p[2], p[3], p[4], p[5]];
  return [p[1], p[4], p[0], p[3], p[5], p[2]];
}

/* ---------- game state ---------- */
let me = null, op = null, GS = null;
function newGame(myId, opId, n) {
  me = teamData(myId); op = teamData(opId); KH = kit(me, false); KA = kit(op, true);
  GS = { ko: true, n, poss: 0, my: 0, them: 0, y: 25, down: 1, togo: 10, mode: 'call', log: [], stats: {}, oppLog: [], year: L.year, over: false, twoPt: L.year >= 1994 };
  $('#tA').innerHTML = `<span>${esc(me.abbr)}</span><span class="sc" id="s1">0</span>`; $('#tB').innerHTML = `<span class="sc" id="s2">0</span><span>${esc(op.abbr)}</span>`;
  callPlay();
}
const st = (p, k, v) => { if (!p || !p.id) return; const s = GS.stats[p.id] || (GS.stats[p.id] = { p, pa: 0, pc: 0, py: 0, ptd: 0, pi: 0, ra: 0, ry: 0, rtd: 0, rc: 0, rcy: 0, rctd: 0 }); s[k] += v; };
function scoreBar() {
  $('#s1').textContent = GS.my; $('#s2').textContent = GS.them;
  const q = Math.min(4, Math.floor(GS.poss / (GS.n / 4)) + 1);
  const spot = GS.y < 50 ? `OWN ${Math.round(GS.y)}` : GS.y > 50 ? `OPP ${Math.round(100 - GS.y)}` : 'MIDFIELD';
  const dd = GS.goal2 ? '2-pt try' : `${['1st', '2nd', '3rd', '4th'][GS.down - 1]} & ${GS.y + GS.togo >= 100 ? 'Goal' : Math.round(GS.togo)}`;
  if (!GS.over && P && P.play && P.play.kr && !P.done) { $('#mid').innerHTML = `<b>${P.play.kr === 'ko' ? 'Kickoff' : 'Punt'} return</b>Q${q} · drive ${GS.poss + 1}/${GS.n}`; return; }
  $('#mid').innerHTML = GS.over ? '<b>Final</b>' : `<b>${dd}</b>Q${q} · ${spot} · drive ${GS.poss + 1}/${GS.n}`;
}

/* ---------- canvas ---------- */
const cv = $('#cv'), cx = cv.getContext('2d');
// Landscape, side-on view: the offense drives left to right. World y = yards downfield, world x = across
// the field (0 = far sideline at the top). The across axis is squashed a little for a three-quarter look.
const SQ = 0.78;
let CROWD = null, DPR = 1, CW = 0, CH = 0, S = 12, camY = 0, camT = 0, camX = 0, camXT = 0;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1); CROWD = null; const r = cv.getBoundingClientRect(); CW = r.width; CH = r.height;
  cv.width = Math.round(CW * DPR); cv.height = Math.round(CH * DPR); cx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = clamp(CH / ((W + 5) * SQ), CW / 62, CW / 44);
  document.body.classList.toggle('portrait', CH > CW * 1.05);
}
window.addEventListener('resize', resize);
const SX = y => (y - camY) * S, SY = x => (x - camX) * S * SQ;
const toWorld = (px, py) => ({ x: py / (S * SQ) + camX, y: px / S + camY });
const viewLen = () => CW / S, viewAcross = () => CH / (S * SQ);
// the top edge of the view (in yards across); the scoreboard covers the top 34px
function aimCamX(x, sh) {
  const top = 34 / (S * SQ), va = (CH - (sh || 0)) / (S * SQ) - top;
  return (va >= W + 3 ? (W - va) / 2 : clamp(x - va / 2, -3, W + 3 - va)) - top;
}
// keep the line of scrimmage about a third of the way up the part of the field you can see
function sheetH() { const s = $('#sheet'); return s && s.style.display !== 'none' && s.innerHTML ? s.getBoundingClientRect().height : 0; }

/* ---------- play setup ---------- */
let P = null; // the live play
function makeUnit(role, who, x, y, side) { return { role, who, x, y, vx: 0, vy: 0, side, sp: spd(role, who.ovr), route: null, ri: 0, sx: x, sy: y, block: 0, stun: 0, trail: [] }; }
function setupPlay(play) {
  const los = GS.y, F = me.F, off = [], def = [], mid = W / 2;
  [-6.2, -3.1, 0, 3.1, 6.2].forEach((dx, i) => off.push(makeUnit('OL', me.OL[i], mid + dx, los - 0.7, 'o')));
  const gun = me.fam === 'pass' || F.WR >= 3;
  const qb = makeUnit('QB', me.QB, mid, los - (gun ? 5 : 1.6), 'o'); off.push(qb);
  const rbs = [];
  if (F.RB >= 2) { rbs.push(makeUnit('RB', me.RB[0], mid, los - 7.5)); rbs.push(makeUnit('RB', me.RB[1], mid, los - 4.6)); }
  else if (F.RB === 1) rbs.push(makeUnit('RB', me.RB[0], gun ? mid + 2.6 : mid, gun ? los - 5 : los - 7));
  rbs.forEach(u => { u.side = 'o'; off.push(u); });
  const tes = []; for (let i = 0; i < F.TE; i++) { const u = makeUnit('TE', me.TE[i], mid + (i ? -9.4 : 9.4), los - 0.9, 'o'); tes.push(u); off.push(u); }
  const wx = { 1: [7], 2: [6, W - 6], 3: [6, W - 6, 14], 4: [6, 14, W - 14, W - 6], 5: [5, 12, 19.5, W - 12, W - 5] }[clamp(F.WR, 1, 5)] || [6, W - 6];
  const wrs = wx.map((x, i) => { const slot = (x > 10 && x < W - 10); const u = makeUnit('WR', me.WR[i] || me.WR[0], x, los - (slot ? 1.2 : 0.6), 'o'); off.push(u); return u; });
  // defense
  const DF = op.F, dl = [], lb = [], db = [];
  const dlx = { 2: [-2.2, 2.2], 3: [-4.2, 0, 4.2], 4: [-6.4, -1.8, 1.8, 6.4] }[DF.DL] || [-6.4, -1.8, 1.8, 6.4];
  dlx.forEach((dx, i) => { const u = makeUnit('DL', op.DL[i] || op.DL[0], mid + dx, los + 1.3, 'd'); dl.push(u); def.push(u); });
  const nl = DF.LB, lbx = nl === 1 ? [0] : nl === 2 ? [-3.5, 3.5] : nl === 3 ? [-6, 0, 6] : [-8.5, -3, 3, 8.5];
  lbx.forEach((dx, i) => { const u = makeUnit('LB', op.LB[i] || op.LB[0], mid + dx, los + 5, 'd'); lb.push(u); def.push(u); });
  // defensive backs: corners on the outside receivers, nickel/dime on slots, the rest deep
  const elig = wrs.concat(tes, rbs).filter(Boolean);
  const outs = wrs.slice().sort((a, b) => Math.abs(b.x - mid) - Math.abs(a.x - mid));
  for (let i = 0; i < DF.DB; i++) {
    const who = op.DB[i] || op.DB[0];
    let u;
    const nMan = Math.min(outs.length, DF.DB - (DF.DB >= 4 ? 2 : 1));
    if (i < nMan) { const m = outs[i]; u = makeUnit('DB', who, m.x + (m.x < mid ? 0.8 : -0.8), los + 6, 'd'); u.man = m; }
    else { u = makeUnit('DB', who, mid + (db.filter(x => x.deep).length ? 9 : -9), los + 13, 'd'); u.deep = true; }
    db.push(u); def.push(u);
  }
  // linebackers take the tight ends and backs; one may blitz in a pressure scheme
  const left = elig.filter(e => !db.some(d => d.man === e));
  const blitz = !play.run && op.dfam === 'blitz' && Math.random() < 0.55 ? lb[0] : null;
  lb.forEach(u => { if (u === blitz) { u.rush = true; return; } const m = left.shift(); if (m) u.man = m; else u.zone = true; });
  dl.forEach(u => u.rush = true);
  P = { play, t: 0, off, def, qb, rbs, tes, wrs, dl, lb, db, elig, ball: { x: mid, y: los, z: 0, st: 'snap' }, carrier: null, thrown: null, aim: null, done: false, los, result: null, blitz: !!blitz, locks: [] };
  // routes
  if (!play.run) {
    const assign = (u, name) => { if (!name || name === 'block') { u.blocker = true; return; } const R = ROUTES[name]; const dir = u.x < mid ? 1 : -1; u.route = R.map(([dx, dy]) => [u.x + dx * dir, u.y + dy]); u.rname = name; };
    wrs.forEach((u, i) => assign(u, play.wr[i % play.wr.length]));
    tes.forEach((u, i) => assign(u, play.te[i] || 'block'));
    rbs.forEach((u, i) => assign(u, play.rb[i] || 'block'));
    const pressure = rushers().length;
    const ol = me.avg('OL'), dlv = op.avg('DL');
    P.pocket = clamp(2.9 + (ol - dlv) * 0.05 - (pressure - 4) * 0.4 + rnd(-0.4, 0.5), 1.5, 5.5);
    dl.concat(lb).filter(u => u.rush).forEach((u, i) => u.shed = P.pocket * rnd(0.82, 1.08) - (u.role === 'LB' ? 0.5 : 0) + i * 0.05);
  } else {
    P.runner = rbs[0] || qb;
    P.dir = play.run === 'out' ? (Math.random() < 0.5 ? -1 : 1) : 0;
    off.forEach(u => { if (u !== P.runner && u !== qb) u.blocker = true; });
  }
  pairLine();
  camXT = aimCamX(mid); camX = camXT;
}

    <div class="row" style="margin-top:12px"><button class="big" data-act="start">Kick off</button></div>

    <div class="row"><a class="big alt" href="./" style="text-align:center;text-decoration:none">Back to Gridiron GM</a></div></div></div>`);
}
(async function boot() {
  resize(); requestAnimationFrame(frame);
  L = await loadSaved();
  if (!L) { demo = true; L = G.newLeague({}, 'nor', { startYear: 1970 }); }
  setup();
})();
// test hooks
window.__drive = { get P() { return P; }, get GS() { return GS; }, throwBall: (x, y) => throwBall(x, y), juke, scramble,
  // testing: run one play instantly with a scripted player; returns the result
  testReturn(kind, ai) {
    const keep = window.setTimeout; window.setTimeout = () => 0;
    startReturn(kind, 15); let n = 0; while (!P.done && n++ < 2000) { const a = ai ? ai(P) : null; AUTO = a && a.go || null; step(1 / 60); }
    window.setTimeout = keep; AUTO = null; const r = P.result || {}; return { kind: r.kind, y: r.y, land: P.land, t: P.t, gy: GS.y };
  },
  kick: { meter: () => KICK, now: () => kickNow() },
  test(playId, ai, y) {
    GS.y = y || 25; GS.down = 1; GS.togo = 10; GS.goal2 = false;
    const keep = window.setTimeout; window.setTimeout = () => 0;
    setupPlay(PLAYS.find(x => x.id === playId));
    let n = 0; while (!P.done && n++ < 1500) { const a = ai(P); if (a && a.throw && P.ball.st === 'held') throwBall(a.throw[0], a.throw[1]); AUTO = a && a.go || null; if (a && a.juke) juke(); step(1 / 60); }
    window.setTimeout = keep; AUTO = null;
    const r = P.result || {}; return { kind: r.kind, y: r.y, caught: !!P.caught, t: P.t, gain: r.kind === 'inc' || r.kind === 'int' ? 0 : (r.kind === 'td' ? 100 : r.y) - P.los, pocket: P.pocket };
  } };
})();
