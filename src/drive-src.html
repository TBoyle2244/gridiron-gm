<script>
(function () {
'use strict';
const G = window.GG;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const W = 53.33; // field width, yards

/* ---------- loading the league ---------- */
async function loadSaved() {
  const unpack = async v => {
    if (!v) return null;
    if (v.gz === 1) {
      let buf = v.data;
      if (typeof buf === 'string') { const b = atob(buf), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); buf = u.buffer; }
      const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      return JSON.parse(txt);

    return v;
  };
  try {
    const db = await new Promise((res, rej) => { const rq = indexedDB.open('gridiron-gm', 1); rq.onupgradeneeded = () => rq.result.createObjectStore('kv'); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
    const v = await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get('league'); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); });
    const L = await unpack(v); if (L && L.teams) return L;
  } catch (e) { /* no IndexedDB here */ }
  try { const s = localStorage.getItem('gg-league'); if (s) { const L = await unpack(JSON.parse(s)); if (L && L.teams) return L; } } catch (e) { /* none */ }
  return null;
}
let L = null, demo = false;
function teamData(tid) {
  const t = L.teams[tid], d = G.depth(L, tid), F = G.startersFor(L, tid), r = G.ratings(L, tid);
  const mk = p => { if (!p) return { name: 'Backup', last: 'Backup', num: '', ovr: 45, pos: '', grp: '', at: {} }; const o = G.eff(p), at = {}; (G.attrs ? G.attrs(p, o) : []).forEach(a => at[a.k] = a.v); G.ensureAttrs && G.ensureAttrs(p); return { hin: p.hin, id: p.id, name: p.name, last: p.name.split(' ').slice(-1)[0], num: p.num || '', ovr: o, pos: p.pos, grp: p.grp, at }; };
  const pick = (g, n) => { const out = []; for (let i = 0; i < n; i++) out.push(mk(d[g][i])); return out; };
  const os = G.SCHEME[t.coach.os], ds = G.SCHEME[t.coach.ds];
  return { id: tid, abbr: t.abbr, city: t.city, name: t.name, F, off: r.off, def: r.def, os, ds, fam: (os && os.fam) || t.coach.off || 'bal', dfam: (ds && ds.fam) || t.coach.def || 'bal',
    QB: pick('QB', 1)[0], RB: pick('RB', Math.max(1, F.RB)), WR: pick('WR', Math.max(2, F.WR)), TE: pick('TE', Math.max(1, F.TE)), OL: pick('OL', 5),
    DL: pick('DL', F.DL), LB: pick('LB', F.LB), DB: pick('DB', F.DB), K: mk(d.K[0]), avg: g => { const a = pick(g, F[g] || 1); return a.reduce((s, x) => s + x.ovr, 0) / a.length; } };
}

/* ---------- speed and skill from ratings ---------- */
const BASE = { QB: 7.6, RB: 8.9, WR: 9.1, TE: 8.1, OL: 6.0, DL: 7.2, LB: 8.1, DB: 8.9 };
const spd = (role, ovr) => BASE[role] * (0.84 + (ovr - 50) / 170);
// one of a player's position ratings (falls back to his overall): rt(who, 'spd')
const rt = (who, k) => (who && who.at && who.at[k] != null) ? who.at[k] : (who ? who.ovr : 50);
const SPEED_KEY = { QB: 'mob', RB: 'spd', WR: 'spd', TE: 'spd', OL: 'ftw', DL: 'qck', LB: 'spd', DB: 'spd' };
const speedOf = who => rt(who, SPEED_KEY[who.grp] || 'spd');
// how hard he is to bring down: backs use elusiveness and power, receivers size, everyone else overall
const breakOf = who => who.grp === 'RB' ? Math.max(rt(who, 'elu'), rt(who, 'pow')) * 0.6 + who.ovr * 0.4 : who.grp === 'WR' || who.grp === 'TE' ? (rt(who, who.grp === 'WR' ? 'phy' : 'blk') + who.ovr) / 2 : who.ovr;
const blockOf = (who, run) => who.grp === 'OL' ? rt(who, run ? 'rbk' : 'pbk') : who.grp === 'TE' ? rt(who, 'blk') : who.ovr;
const shedOf = (who, run) => who.grp === 'DL' ? rt(who, run ? 'rdf' : 'prs') : who.grp === 'LB' ? rt(who, run ? 'tkl' : 'prs') : who.ovr;

/* ---------- playbook ---------- */
// Routes are waypoints relative to the player's start: [dx (toward the middle +), dy downfield].
const ROUTES = {
  slant: [[0, 2], [5, 6], [11, 9]], go: [[0, 40]], curl: [[0, 12], [-0.5, 10.5]], out: [[0, 9], [-9, 9]], post: [[0, 12], [7, 28]], corner: [[0, 12], [-7, 26]],
  dig: [[0, 11], [14, 11]], seam: [[0, 30]], flat: [[-7, 1.5], [-10, 2.5]], wheel: [[-6, 1], [-8, 6], [-8, 30]], drag: [[2, 3], [16, 4]], hitch: [[0, 6], [0, 5]], block: null, check: [[-4, 3], [-5, 5]],
  cross: [[0, 5], [8, 9], [20, 12]], comeback: [[0, 16], [-2.5, 13.5]], deepout: [[0, 15], [-9, 15]], bubble: [[-2, -1.5], [-4, -1], [-4, 6]], stick: [[0, 6], [-1.5, 5]]

// The playbook. t = how much each play leans on what a scheme likes (run, deep, quick, qbRun, misd = misdirection).
// rp = the running back's path on a run; rpo = a pass play where the QB can hand off on that path instead.
const PLAYS = [
  { id: 'quick', name: 'Quick slants', sub: 'Beat the blitz', run: false, t: { quick: 1 }, wr: ['slant', 'slant', 'hitch', 'slant', 'hitch'], te: ['flat', 'drag'], rb: ['check', 'block'], drop: 3 },
  { id: 'curl', name: 'Curl / flat', sub: 'Underneath', run: false, t: { quick: 0.8 }, wr: ['curl', 'curl', 'drag', 'out', 'hitch'], te: ['seam', 'flat'], rb: ['flat', 'block'], drop: 5 },
  { id: 'mesh', name: 'Mesh', sub: 'Drags cross underneath', run: false, t: { quick: 0.9 }, wr: ['drag', 'drag', 'hitch', 'corner', 'hitch'], te: ['seam', 'flat'], rb: ['check', 'block'], drop: 3 },
  { id: 'smash', name: 'Smash', sub: 'Hitch under a corner', run: false, t: { quick: 0.5, deep: 0.5 }, wr: ['hitch', 'hitch', 'corner', 'corner', 'out'], te: ['corner', 'flat'], rb: ['flat', 'block'], drop: 5 },
  { id: 'flood', name: 'Flood', sub: 'Three levels to one side', run: false, t: { deep: 0.6, quick: 0.2 }, wr: ['go', 'deepout', 'flat', 'out', 'go'], te: ['deepout', 'block'], rb: ['flat', 'block'], drop: 5 },
  { id: 'ycross', name: 'Y-Cross', sub: 'Dig and post', run: false, t: { deep: 0.6, quick: 0.2 }, wr: ['post', 'dig', 'cross', 'go', 'dig'], te: ['cross', 'block'], rb: ['check', 'block'], drop: 7 },
  { id: 'comeback', name: 'Comebacks', sub: 'Outside the numbers', run: false, t: { deep: 0.4, quick: 0.3 }, wr: ['comeback', 'comeback', 'curl', 'comeback', 'hitch'], te: ['flat', 'block'], rb: ['check', 'block'], drop: 7 },
  { id: 'verts', name: 'Four verticals', sub: 'Stretch them deep', run: false, t: { deep: 1 }, wr: ['go', 'go', 'seam', 'go', 'post'], te: ['seam', 'block'], rb: ['check', 'block'], drop: 7 },
  { id: 'deep', name: 'Play-action shot', sub: 'Post and corner', run: false, pa: true, t: { deep: 0.9, misd: 0.6 }, wr: ['post', 'corner', 'dig', 'go', 'out'], te: ['drag', 'block'], rb: ['block', 'block'], drop: 7 },
  { id: 'inside', name: 'Inside zone', sub: 'Find the crease', run: 'in', rp: 'zone', t: { run: 1 } },
  { id: 'power', name: 'Power', sub: 'Off the guard', run: 'in', rp: 'power', t: { run: 1 } },
  { id: 'outside', name: 'Toss sweep', sub: 'Get to the edge', run: 'out', rp: 'toss', t: { run: 0.8 } },
  { id: 'stretch', name: 'Stretch', sub: 'Wide zone, then cut', run: 'out', rp: 'stretch', t: { run: 0.6, misd: 0.4 } },
  { id: 'counter', name: 'Counter', sub: 'Step one way, run the other', run: 'in', rp: 'counter', t: { misd: 1, run: 0.4 } },
  { id: 'draw', name: 'Draw', sub: 'Look pass, hand off late', run: 'in', rp: 'draw', t: { misd: 0.7, run: 0.3, quick: 0.2 } },
  { id: 'keep', name: 'Read option', sub: 'QB keeps it outside', run: 'out', rp: 'keep', t: { qbRun: 1.3 }, min: 2008 },
  { id: 'rpobub', name: 'RPO bubble', sub: 'Hand off or throw the bubble', run: false, rpo: 'zone', t: { quick: 0.6, misd: 0.5, qbRun: 0.4 }, min: 2008, wr: ['bubble', 'slant', 'hitch', 'bubble', 'hitch'], te: ['flat', 'block'], rb: ['block', 'block'], drop: 1 },
  { id: 'rpoglance', name: 'RPO glance', sub: 'Hand off or hit the post', run: false, rpo: 'zone', t: { deep: 0.4, misd: 0.5, qbRun: 0.4 }, min: 2008, wr: ['post', 'hitch', 'slant', 'post', 'hitch'], te: ['seam', 'block'], rb: ['block', 'block'], drop: 1 },
  { id: 'rpostick', name: 'RPO stick', sub: 'Hand off or throw the stick', run: false, rpo: 'power', t: { quick: 0.5, run: 0.4, misd: 0.3 }, min: 2005, wr: ['hitch', 'stick', 'stick', 'out', 'slant'], te: ['stick', 'block'], rb: ['block', 'block'], drop: 1 }
];
const isRun = p => !!p.run || !!p.rpo, isDeep = p => (p.t.deep || 0) >= 0.6;
// three plays for this down: what your coach's scheme likes, nudged by down, distance and field position
function pickOptions() {
  const A = Object.assign({ run: 0.5, deep: 0.5, quick: 0.5, qbRun: 0, misd: 0.3 }, (me.os && me.os.a) || {});
  const sid = me.os && me.os.id, long = GS.togo >= 7 && GS.down >= 2, short = GS.togo <= 2, goal = GS.y >= 88 || GS.goal2;
  const pool = PLAYS.filter(p => !p.min || GS.year >= p.min || sid === 'rpo' || sid === 'readopt')
    .filter(p => !(p.rp === 'keep' && A.qbRun < 0.25) && !(p.rpo && A.qbRun < 0.15 && A.misd < 0.4) && !(p.run && !p.rp));
  const w = p => { let v = 0.05; for (const k in p.t) v += p.t[k] * (A[k] || 0); if (!p.run && !p.rpo) v *= long ? 2.2 : short ? 0.6 : 1; if (p.run) v *= long ? 0.3 : short ? 2.2 : 1; if (goal && isDeep(p)) v *= 0.25; return v * (0.75 + Math.random() * 0.5); };
  const left = pool.map(p => ({ p, w: w(p) })), out = [];
  while (out.length < 3 && left.length) { let r = Math.random() * left.reduce((a, b) => a + b.w, 0), i = 0; while (i < left.length - 1 && (r -= left[i].w) > 0) i++; out.push(left.splice(i, 1)[0].p); }
  const swap = f => { const best = left.filter(o => f(o.p)).sort((a, b) => b.w - a.w)[0]; if (best) out[2] = best.p; };
  if (!out.some(isRun) && !(long && GS.down >= 3)) swap(isRun);
  else if (!out.some(p => !p.run) && GS.togo >= 4) swap(p => !p.run);
  return out.map(p => ({ p, s: Math.random() < 0.5 ? -1 : 1 }));
}
// the path a ball carrier follows after the snap (until you take over by sliding)
function runPath(rp, u, s, mid, los) {
  switch (rp) {
    case 'power': return [[mid + s * 3.4, los - 1], [mid + s * 3.4, los + 4]];
    case 'toss': return [[mid + s * 9, los - 3], [mid + s * 12.5, los], [mid + s * 12.5, los + 5]];
    case 'stretch': return [[mid + s * 6.5, los - 1.8], [mid + s * 8, los + 0.5], [mid + s * 8, los + 5]];
    case 'counter': return [[u.x - s * 1.8, u.y + 0.4], [mid + s * 3.2, los - 1.2], [mid + s * 3.2, los + 4]];
    case 'draw': return [[mid + s * 0.8, los - 1], [mid + s * 0.8, los + 4]];
    case 'keep': return [[mid + s * 5, los - 2.5], [mid + s * 8, los + 0.5], [mid + s * 8, los + 5]];
    default: return [[mid + s * 1.6, los - 1.2], [mid + s * 1.6, los + 4]];
  }
}
function followPath(u, sp, dt) { const [tx, ty] = u.rpath[u.rpi]; steer(u, tx, ty, sp, dt, 20); if (Math.hypot(tx - u.x, ty - u.y) < 1) u.rpi++; }

/* ---------- game state ---------- */
let me = null, op = null, GS = null;
