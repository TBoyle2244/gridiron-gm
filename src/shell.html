<title>Gridiron GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column front-office app; sticky team banner on top, fixed tab bar at the bottom, cards in between. */
:root {
  --bg: #e9eee6; --panel: #f7f9f4; --ink: #15211a; --muted: #5a6b5f; --line: #cfd8cc;
  --field: #1d6a3b; --field-ink: #f4f7f1; --gold: #b07a0c; --gold-soft: #f3e3b8;
  --good: #1d7a43; --warn: #a3650a; --bad: #b3372a;
  --display: 'Graduate', 'Rockwell', 'Georgia', serif;
  --body: 'Barlow', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;
  --good: #57c27e; --warn: #e2a64a; --bad: #e76a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;
  --good: #57c27e; --warn: #e2a64a; --bad: #e76a5a; color-scheme: dark }
html, body { background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }
/* App shell: only #main scrolls. Fixed bars break on iPhone/iPad after the keyboard closes, so nothing here is position: fixed. */
body { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; display: none; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--field); }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#top { position: relative; flex: none; padding-top: env(safe-area-inset-top, 0px); z-index: 5; color: var(--field-ink);
  background: var(--field) repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.08) 39px 41px); }
.top-inner { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.crest { font-family: var(--display); font-size: 15px; min-width: 52px; height: 40px; display: grid; place-items: center; padding: 0 6px;
  border: 2px solid var(--field-ink); border-radius: 6px; letter-spacing: .04em; }
.top-team { font-family: var(--display); font-size: 17px; line-height: 1.15; text-wrap: balance; }
.top-sub { font-family: var(--cond); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }

#main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  display: flex; flex-direction: column; gap: 12px; padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 760px) / 2)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 760px) / 2)); }
#main > * { flex-shrink: 0; }

#tabs { position: relative; flex: none; z-index: 6; display: flex; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1; min-width: 0; padding: 12px 2px 10px; background: none; border: 0; border-top: 3px solid transparent;
  font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab { position: relative; }
.dc { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
.dc.out { opacity: .55; }
.dc-n { width: 18px; text-align: right; font-family: var(--cond); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.dc .pl-name { flex: 1; min-width: 0; }
.btn.ar { padding: 4px 9px; min-width: 36px; }
.fld .seg { margin-top: 2px; }
.tscroll { overflow-x: auto; margin: 0 -4px; }
.tbl.stat { white-space: nowrap; font-size: 14px; }
.tbl.stat td, .tbl.stat th { padding: 6px 7px; }
.tbl .l { text-align: left; }
.th { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--field); font-weight: 600; text-align: left; }
.award { display: inline-block; font-family: var(--cond); font-weight: 600; font-size: 13px; padding: 3px 8px; border-radius: 999px; background: var(--gold-soft); border: 1px solid var(--gold); }
.awards { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.aw-year + .aw-year { margin-top: 12px; }
.aw { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.aw-k { flex-basis: 100%; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.aw.mine .aw-p { color: var(--gold); }
@media (max-width: 430px) { .tab { font-size: 11.5px; letter-spacing: .02em; } }
.card h3.sub { margin-top: 14px; font-size: 14px; }
.bar-t.cap { display: block; height: 12px; margin: 6px 0; }
.tlist.protect { max-height: 300px; }
.gl { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; font: inherit; font-family: var(--cond); font-size: 17px; color: inherit; }
button.gl { cursor: pointer; }
.glbox { margin-left: auto; font-size: 13px; color: var(--muted); }
.fired { border-color: var(--bad); }
.box .trade h3.sub { margin-top: 10px; }
.faround { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--bg); }
.bid { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.bidctl { display: flex; flex-wrap: wrap; gap: 6px; }
.pl.wide .pl-btns { flex-basis: 100%; flex-wrap: wrap; padding-left: 48px; }
.pl-btns .btn { white-space: nowrap; }
.found { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.tlist.search { max-height: 260px; margin: 6px 0; }
.delta { font-family: var(--cond); font-weight: 700; font-size: 15px; min-width: 34px; text-align: right; }
.rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
.ring { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.ringnum { font-family: var(--display); font-size: 26px; color: var(--gold); min-width: 40px; text-align: center; }
.navchips { margin-bottom: 2px; }
.draftoffer { margin-top: 10px; padding: 10px 12px; border: 2px solid var(--gold); border-radius: 8px; background: var(--gold-soft); }
.fld.tpos { margin-top: 6px; }
.fld.tpos select { padding: 7px 8px; font-size: 15px; }
.ctbar { margin: 8px 0 4px; }
.ctbar > .lbl { display: block; margin-bottom: 2px; }
.sortrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.sortrow .seg { flex: 1; margin: 0; }
.dc { flex-wrap: wrap; }
.badge { position: absolute; top: 3px; right: 4px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 11px; line-height: 16px; }
.offers { border-color: var(--gold); border-width: 2px; }
.offer + .offer { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.olist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.olist li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.olist .pos { width: auto; padding: 2px 4px; font-size: 11px; }
.olist .rt { min-width: 28px; font-size: 13px; padding: 1px 3px; }
.tab.on { color: var(--ink); border-top-color: var(--gold); }
.tab:disabled { opacity: .35; cursor: default; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h3 { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.hero { border-color: var(--field); border-width: 2px; }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; margin: 2px 0 6px; text-wrap: balance; }
.eyebrow { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.small { font-size: 13px; color: var(--muted); }
.warn { color: var(--warn); }
.good { color: var(--good); } .bad { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.count { font-family: var(--cond); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

.btn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--field); border-color: var(--field); color: var(--field-ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.filebtn { display: inline-flex; align-items: center; position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; font-weight: 500; }

.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; margin: 10px 0 4px; }
.mu-abbr { font-family: var(--display); font-size: 30px; line-height: 1; }
.mu-rec { font-family: var(--cond); font-size: 15px; color: var(--muted); margin: 4px 0; font-variant-numeric: tabular-nums; }
.mu-vs { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.rt { display: inline-block; min-width: 34px; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 15px; padding: 2px 5px; border-radius: 5px; font-variant-numeric: tabular-nums; border: 1.5px solid currentColor; }
.g-elite { color: var(--gold); } .g-good { color: var(--good); } .g-avg { color: var(--ink); } .g-low { color: var(--muted); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 6px 0; scrollbar-width: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; min-width: 0; border: 0; background: var(--bg); padding: 9px 4px; font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .03em; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on { background: var(--field); color: var(--field-ink); }

.list { display: flex; flex-direction: column; }
.pl { border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 0; }
.pl-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.pos { flex: none; width: 38px; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 13px; padding: 3px 0; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.pos.st { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.pl-name { flex: 1; min-width: 0; font-weight: 600; }
.pl-sub { font-weight: 400; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.pl-r { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.lbl { font-family: var(--cond); font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
.pl-btns { display: flex; gap: 6px; }
.pl-btns:empty { display: none; }
.pl-act { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 48px; }
.inj { margin-left: 6px; font-family: var(--cond); font-size: 12px; font-weight: 700; color: var(--bad); }

.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 6px; border-bottom: 1.5px solid var(--line); }
.tbl td { padding: 6px; text-align: right; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child, .tbl .l { text-align: left; }
.tbl tr.me td { background: var(--gold-soft); font-weight: 600; }

.gl { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-family: var(--cond); font-size: 17px; font-variant-numeric: tabular-nums; }
.gl .win { font-weight: 700; }
.gl .at { color: var(--muted); font-size: 13px; }
.gl.mine { color: var(--field); }
.gl .ot { font-size: 12px; color: var(--warn); font-weight: 700; }
.pr + .pr { margin-top: 10px; }

.news { list-style: none; margin: 0; padding: 0; }
.news li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.nw { font-family: var(--cond); font-weight: 700; font-size: 12px; color: var(--gold); margin-right: 8px; letter-spacing: .05em; }

.fld { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--muted); font-weight: 500; }
.fld select, .fld input, .fld textarea { color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; font-size: 16px; }
.fld textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
.tog { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.tog input { width: 22px; height: 22px; accent-color: var(--field); }
input[type=range] { width: 100%; accent-color: var(--field); }

.bar { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; padding: 4px 0; }
.bar-l { font-family: var(--cond); font-weight: 600; font-size: 14px; }
.bar-t { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar-f { display: block; height: 100%; background: currentColor; }
.bar-v { font-family: var(--cond); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

.trade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.trade > div { min-width: 0; }
.tlist { display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; margin-top: 6px; }
.tp { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 6px; text-align: left; min-width: 0; }
.tp.on { border-color: var(--field); background: var(--gold-soft); }
.tp .pos { width: 30px; font-size: 11px; }
.tp .pos.pk { width: 34px; font-size: 10px; background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
.seg.mini { margin-top: 6px; }
.seg.mini button { padding: 6px 2px; font-size: 13px; }
.chosen { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.trade.summary { border-top: 1px solid var(--line); padding-top: 8px; }
.tp-n { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-a { font-size: 12px; color: var(--muted); }
.tp .rt { min-width: 28px; font-size: 13px; padding: 1px 3px; }

.grid26 { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
.cell { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border: 1.5px dashed var(--line); border-radius: 7px; font-family: var(--cond); font-weight: 700; font-size: 15px; color: var(--muted); }
.cell small { font-weight: 500; font-size: 11px; }
.cell.ok { border-style: solid; border-color: var(--field); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.scheme.on{border-color:var(--accent,#c9a227);box-shadow:inset 3px 0 0 var(--accent,#c9a227)}.fit{font-weight:700;font-variant-numeric:tabular-nums;min-width:2.6em;display:inline-block;text-align:center}
.top-inner{position:relative}.helpbtn{margin-left:auto;align-self:center;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:transparent;color:#fff;font:700 18px/1 inherit;cursor:pointer;flex:none}.helpbtn.on{background:rgba(255,255,255,.18)}
details.help summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}details.help summary::-webkit-details-marker{display:none}details.help summary h3{margin:0}details.help summary::after{content:'+';font-size:22px;opacity:.6}details.help[open] summary::after{content:'−'}
.helpbody{margin-top:10px;line-height:1.5}.helpbody li{margin:6px 0}.helpbody a{color:var(--accent,#c9a227);text-decoration:underline;cursor:pointer}
.fitrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line,rgba(0,0,0,.08))}.fitg{font-weight:800;min-width:2.4em;text-align:center;font-size:18px}.fitbig{font-weight:800;font-size:22px}
.pl.mine{box-shadow:inset 3px 0 0 var(--accent,#c9a227)}.row.trk .fld{flex:1;min-width:140px}
.mktbar{display:flex;flex-wrap:wrap;gap:8px}.mktbar .fld{flex:1;min-width:120px;margin:0}
.whybox{flex-basis:100%;margin-bottom:6px;line-height:1.5}
button.crest{cursor:pointer;font:inherit;color:inherit;background:transparent}
.pgnav{margin:0 0 8px}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stats4>div{display:flex;flex-direction:column;align-items:flex-start;padding:8px;border:1px solid var(--line,rgba(0,0,0,.1));border-radius:10px}.stats4 b{font-size:18px}
@media (max-width:520px){.stats4{grid-template-columns:repeat(2,1fr)}}
.leadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.leadblk ol{margin:4px 0 0;padding-left:18px}
.finder{margin-top:14px;padding:12px;border:1px solid var(--accent,#c9a227);border-radius:10px}.finder .btn{margin-top:6px}
.savewarn{border:2px solid #b3261e;background:color-mix(in srgb,#b3261e 8%,var(--card,#fff))}.savewarn .eyebrow{color:#b3261e}

/* player career */
.modeseg { margin: 0 0 12px; }
.modeseg button { flex: 1; font-family: var(--cond); font-weight: 600; letter-spacing: .04em; padding: 10px 6px; }
.qopts { display: grid; gap: 8px; }
.qopt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: inherit; cursor: pointer; }
.qopt.on { border-color: var(--field); background: color-mix(in srgb, var(--field) 14%, var(--panel)); font-weight: 600; }
.calert { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; border-left: 4px solid var(--field); background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.calert.good { border-left-color: var(--good); } .calert.warn, .calert.inj { border-left-color: var(--warn); } .calert.bad { border-left-color: var(--bad); }
.calert .x { border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 0 2px; }
.tbar { height: 8px; border-radius: 6px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.tbar i { display: block; height: 100%; background: var(--gold); border-radius: 6px; }
.dcgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px 16px; }
.dcgrp.mine { grid-column: 1 / -1; }
.dcrow { display: grid; grid-template-columns: 22px 1fr auto auto 32px; gap: 8px; align-items: center; padding: 5px 6px; border-top: 1px solid var(--line); font-size: 14px; }
.dcrow.st { background: color-mix(in srgb, var(--field) 12%, transparent); }
.dcrow.me { outline: 2px solid var(--gold); outline-offset: -2px; border-radius: 6px; }
