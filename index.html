<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>Gridiron GM</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column front-office app; sticky team banner on top, fixed tab bar at the bottom, cards in between. */
:root {
  --bg: #e9eee6; --panel: #f7f9f4; --ink: #15211a; --muted: #5a6b5f; --line: #cfd8cc;
  --field: #1d6a3b; --field-ink: #f4f7f1; --gold: #b07a0c; --gold-soft: #f3e3b8;
  --good: #1d7a43; --warn: #a3650a; --bad: #b3372a;
  --display: 'Graduate', 'Rockwell', 'Georgia', serif;
  --body: 'Barlow', -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --cond: 'Barlow Condensed', 'Arial Narrow', -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;
  --good: #57c27e; --warn: #e2a64a; --bad: #e76a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;
  --good: #57c27e; --warn: #e2a64a; --bad: #e76a5a; color-scheme: dark }
html, body { background: var(--bg); color: var(--ink); height: 100%; overflow: hidden; }
/* App shell: only #main scrolls. Fixed bars break on iPhone/iPad after the keyboard closes, so nothing here is position: fixed. */
body { position: fixed; inset: 0; display: flex; flex-direction: column; height: 100vh; height: 100dvh; margin: 0; }
body { font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; display: none; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--field); }
* { box-sizing: border-box; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

#top { position: relative; flex: none; padding-top: env(safe-area-inset-top, 0px); z-index: 5; color: var(--field-ink);
  background: var(--field) repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,255,255,.08) 39px 41px); }
.top-inner { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.crest { font-family: var(--display); font-size: 15px; min-width: 52px; height: 40px; display: grid; place-items: center; padding: 0 6px;
  border: 2px solid var(--field-ink); border-radius: 6px; letter-spacing: .04em; }
.top-team { font-family: var(--display); font-size: 17px; line-height: 1.15; text-wrap: balance; }
.top-sub { font-family: var(--cond); font-size: 14px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }

#main { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  display: flex; flex-direction: column; gap: 12px; padding-block: 14px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px), calc((100% - 760px) / 2)); padding-right: max(16px, env(safe-area-inset-right, 0px), calc((100% - 760px) / 2)); }
#main > * { flex-shrink: 0; }

#tabs { position: relative; flex: none; z-index: 6; display: flex; background: var(--panel); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { flex: 1; min-width: 0; padding: 12px 2px 10px; background: none; border: 0; border-top: 3px solid transparent;
  font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab { position: relative; }
.dc { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); }
.dc.out { opacity: .55; }
.dc-n { width: 18px; text-align: right; font-family: var(--cond); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.dc .pl-name { flex: 1; min-width: 0; }
.btn.ar { padding: 4px 9px; min-width: 36px; }
.fld .seg { margin-top: 2px; }
.tscroll { overflow-x: auto; margin: 0 -4px; }
.tbl.stat { white-space: nowrap; font-size: 14px; }
.tbl.stat td, .tbl.stat th { padding: 6px 7px; }
.tbl .l { text-align: left; }
.th { background: none; border: 0; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; }
.lnk { background: none; border: 0; padding: 0; font: inherit; color: var(--field); font-weight: 600; text-align: left; }
.award { display: inline-block; font-family: var(--cond); font-weight: 600; font-size: 13px; padding: 3px 8px; border-radius: 999px; background: var(--gold-soft); border: 1px solid var(--gold); }
.awards { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.aw-year + .aw-year { margin-top: 12px; }
.aw { display: flex; flex-wrap: wrap; gap: 2px 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.aw-k { flex-basis: 100%; font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.aw.mine .aw-p { color: var(--gold); }
@media (max-width: 430px) { .tab { font-size: 11.5px; letter-spacing: .02em; } }
.card h3.sub { margin-top: 14px; font-size: 14px; }
.bar-t.cap { display: block; height: 12px; margin: 6px 0; }
.tlist.protect { max-height: 300px; }
.gl { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; font: inherit; font-family: var(--cond); font-size: 17px; color: inherit; }
button.gl { cursor: pointer; }
.glbox { margin-left: auto; font-size: 13px; color: var(--muted); }
.fired { border-color: var(--bad); }
.box .trade h3.sub { margin-top: 10px; }
.faround { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: var(--bg); }
.bid { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.bidctl { display: flex; flex-wrap: wrap; gap: 6px; }
.pl.wide .pl-btns { flex-basis: 100%; flex-wrap: wrap; padding-left: 48px; }
.pl-btns .btn { white-space: nowrap; }
.found { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.tlist.search { max-height: 260px; margin: 6px 0; }
.delta { font-family: var(--cond); font-weight: 700; font-size: 15px; min-width: 34px; text-align: right; }
.rings { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 8px 0; }
.ring { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; }
.ringnum { font-family: var(--display); font-size: 26px; color: var(--gold); min-width: 40px; text-align: center; }
.navchips { margin-bottom: 2px; }
.draftoffer { margin-top: 10px; padding: 10px 12px; border: 2px solid var(--gold); border-radius: 8px; background: var(--gold-soft); }
.fld.tpos { margin-top: 6px; }
.fld.tpos select { padding: 7px 8px; font-size: 15px; }
.ctbar { margin: 8px 0 4px; }
.ctbar > .lbl { display: block; margin-bottom: 2px; }
.sortrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.sortrow .seg { flex: 1; margin: 0; }
.dc { flex-wrap: wrap; }
.badge { position: absolute; top: 3px; right: 4px; min-width: 16px; padding: 0 4px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 11px; line-height: 16px; }
.offers { border-color: var(--gold); border-width: 2px; }
.offer + .offer { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.olist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.olist li { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.olist .pos { width: auto; padding: 2px 4px; font-size: 11px; }
.olist .rt { min-width: 28px; font-size: 13px; padding: 1px 3px; }
.tab.on { color: var(--ink); border-top-color: var(--gold); }
.tab:disabled { opacity: .35; cursor: default; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.card h3 { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 8px; }
.card p { margin: 6px 0; }
.hero { border-color: var(--field); border-width: 2px; }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.2; margin: 2px 0 6px; text-wrap: balance; }
.eyebrow { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.small { font-size: 13px; color: var(--muted); }
.warn { color: var(--warn); }
.good { color: var(--good); } .bad { color: var(--bad); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.split { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.count { font-family: var(--cond); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }

.btn { border: 1.5px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 14px; font-weight: 600; min-height: 44px; }
.btn.primary { background: var(--field); border-color: var(--field); color: var(--field-ink); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.armed { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.sm { padding: 6px 12px; min-height: 36px; font-size: 14px; }
.btn:disabled { opacity: .45; cursor: default; }
.filebtn { display: inline-flex; align-items: center; position: relative; overflow: hidden; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.toast { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 8px; padding: 10px 14px; font-weight: 500; }

.matchup { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; text-align: center; gap: 8px; margin: 10px 0 4px; }
.mu-abbr { font-family: var(--display); font-size: 30px; line-height: 1; }
.mu-rec { font-family: var(--cond); font-size: 15px; color: var(--muted); margin: 4px 0; font-variant-numeric: tabular-nums; }
.mu-vs { font-family: var(--cond); font-weight: 700; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.rt { display: inline-block; min-width: 34px; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 15px; padding: 2px 5px; border-radius: 5px; font-variant-numeric: tabular-nums; border: 1.5px solid currentColor; }
.g-elite { color: var(--gold); } .g-good { color: var(--good); } .g-avg { color: var(--ink); } .g-low { color: var(--muted); }

.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin: 6px 0; scrollbar-width: none; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .04em; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg { display: flex; border: 1.5px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; min-width: 0; border: 0; background: var(--bg); padding: 9px 4px; font-family: var(--cond); font-weight: 600; font-size: 14px; letter-spacing: .03em; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button.on { background: var(--field); color: var(--field-ink); }

.list { display: flex; flex-direction: column; }
.pl { border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 0; }
.pl-r.cons { opacity: .7; }
.scnote { width: 100%; padding-left: 52px; margin-top: -4px; }
.pl-ord { display: flex; flex-direction: column; gap: 3px; }
.pl-ord .btn.ar { min-width: 34px; padding: 1px 6px; font-size: 12px; line-height: 1.3; }
.pl > .dc-n + .pl-main .pos { min-width: 0; }
.pl > .dc-n { flex: 0 0 18px; }
.pl-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; }
.pos { flex: none; width: 38px; text-align: center; font-family: var(--cond); font-weight: 700; font-size: 13px; padding: 3px 0; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); }
.pos.st { background: var(--field); color: var(--field-ink); border-color: var(--field); }
.pl-name { flex: 1; min-width: 0; font-weight: 600; }
.pl-sub { font-weight: 400; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.pl-r { flex: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.lbl { font-family: var(--cond); font-size: 10.5px; letter-spacing: .08em; color: var(--muted); }
.pl-btns { display: flex; gap: 6px; }
.pl-btns:empty { display: none; }
.pl-act { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-left: 48px; }
.inj { margin-left: 6px; font-family: var(--cond); font-size: 12px; font-weight: 700; color: var(--bad); }

.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th { font-family: var(--cond); font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 4px 6px; border-bottom: 1.5px solid var(--line); }
.tbl td { padding: 6px; text-align: right; border-bottom: 1px solid var(--line); }
.tbl th:first-child, .tbl td:first-child, .tbl .l { text-align: left; }
.tbl tr.me td { background: var(--gold-soft); font-weight: 600; }

.gl { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-family: var(--cond); font-size: 17px; font-variant-numeric: tabular-nums; }
.gl .win { font-weight: 700; }
.gl .at { color: var(--muted); font-size: 13px; }
.gl.mine { color: var(--field); }
.gl .ot { font-size: 12px; color: var(--warn); font-weight: 700; }
.pr + .pr { margin-top: 10px; }

.news { list-style: none; margin: 0; padding: 0; }
.news li { padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.nw { font-family: var(--cond); font-weight: 700; font-size: 12px; color: var(--gold); margin-right: 8px; letter-spacing: .05em; }

.fld { display: flex; flex-direction: column; gap: 4px; margin-top: 10px; font-size: 13px; color: var(--muted); font-weight: 500; }
.fld select, .fld input, .fld textarea { color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 8px; padding: 10px; font-size: 16px; }
.fld textarea { font-family: ui-monospace, Menlo, monospace; font-size: 13px; resize: vertical; }
.tog { display: flex; gap: 10px; align-items: center; font-weight: 600; }
.tog input { width: 22px; height: 22px; accent-color: var(--field); }
input[type=range] { width: 100%; accent-color: var(--field); }

.bar { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; padding: 4px 0; }
.bar-l { font-family: var(--cond); font-weight: 600; font-size: 14px; }
.bar-t { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.bar-f { display: block; height: 100%; background: currentColor; }
.bar-v { font-family: var(--cond); font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

.trade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.trade > div { min-width: 0; }
.tlist { display: flex; flex-direction: column; gap: 4px; max-height: 340px; overflow-y: auto; margin-top: 6px; }
.tp { display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--bg); border-radius: 7px; padding: 5px 6px; text-align: left; min-width: 0; }
.tp.on { border-color: var(--field); background: var(--gold-soft); }
.tp .pos { width: 30px; font-size: 11px; }
.tp .pos.pk { width: 34px; font-size: 10px; background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
.seg.mini { margin-top: 6px; }
.seg.mini button { padding: 6px 2px; font-size: 13px; }
.chosen { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.trade.summary { border-top: 1px solid var(--line); padding-top: 8px; }
.tp-n { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-a { font-size: 12px; color: var(--muted); }
.tp .rt { min-width: 28px; font-size: 13px; padding: 1px 3px; }

.grid26 { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 6px; }
.cell { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; border: 1.5px dashed var(--line); border-radius: 7px; font-family: var(--cond); font-weight: 700; font-size: 15px; color: var(--muted); }
.cell small { font-weight: 500; font-size: 11px; }
.cell.ok { border-style: solid; border-color: var(--field); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
.scheme.on{border-color:var(--accent,#c9a227);box-shadow:inset 3px 0 0 var(--accent,#c9a227)}.fit{font-weight:700;font-variant-numeric:tabular-nums;min-width:2.6em;display:inline-block;text-align:center}
.top-inner{position:relative}.helpbtn{margin-left:auto;align-self:center;width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:transparent;color:#fff;font:700 18px/1 inherit;cursor:pointer;flex:none}.helpbtn.on{background:rgba(255,255,255,.18)}
details.help summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}details.help summary::-webkit-details-marker{display:none}details.help summary h3{margin:0}details.help summary::after{content:'+';font-size:22px;opacity:.6}details.help[open] summary::after{content:'−'}
.helpbody{margin-top:10px;line-height:1.5}.helpbody li{margin:6px 0}.helpbody a{color:var(--accent,#c9a227);text-decoration:underline;cursor:pointer}
.fitrow{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line,rgba(0,0,0,.08))}.fitg{font-weight:800;min-width:2.4em;text-align:center;font-size:18px}.fitbig{font-weight:800;font-size:22px}
.pl.mine{box-shadow:inset 3px 0 0 var(--accent,#c9a227)}.row.trk .fld{flex:1;min-width:140px}
.mktbar{display:flex;flex-wrap:wrap;gap:8px}.mktbar .fld{flex:1;min-width:120px;margin:0}
.whybox{flex-basis:100%;margin-bottom:6px;line-height:1.5}
button.crest{cursor:pointer;font:inherit;color:inherit;background:transparent}
.pgnav{margin:0 0 8px}.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.stats4>div{display:flex;flex-direction:column;align-items:flex-start;padding:8px;border:1px solid var(--line,rgba(0,0,0,.1));border-radius:10px}.stats4 b{font-size:18px}
@media (max-width:520px){.stats4{grid-template-columns:repeat(2,1fr)}}
.leadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.leadblk ol{margin:4px 0 0;padding-left:18px}
.finder{margin-top:14px;padding:12px;border:1px solid var(--accent,#c9a227);border-radius:10px}.finder .btn{margin-top:6px}
.savewarn{border:2px solid #b3261e;background:color-mix(in srgb,#b3261e 8%,var(--card,#fff))}.savewarn .eyebrow{color:#b3261e}

/* player career */
.modeseg { margin: 0 0 12px; }
.modeseg button { flex: 1; font-family: var(--cond); font-weight: 600; letter-spacing: .04em; padding: 10px 6px; }
.qopts { display: grid; gap: 8px; }
.qopt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 10px; padding: 11px 12px; font: inherit; cursor: pointer; }
.qopt.on { border-color: var(--field); background: color-mix(in srgb, var(--field) 14%, var(--panel)); font-weight: 600; }
.calert { display: flex; align-items: flex-start; gap: 10px; justify-content: space-between; border-left: 4px solid var(--field); background: var(--panel); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.calert.good { border-left-color: var(--good); } .calert.warn, .calert.inj { border-left-color: var(--warn); } .calert.bad { border-left-color: var(--bad); }

<script>
/* Gridiron GM — simulation engine (no DOM). Works in browser and Node. */
(function (root) {
'use strict';

/* ---------- random helpers ---------- */
const R = {

  norm: () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },

const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };

/* ---------- league history data ---------- */
// [pfr franchise code, abbr, city, nickname, conference, division]
const TEAMS_1970 = [
  ['clt','BAL','Baltimore','Colts','AFC','East'], ['nwe','BOS','Boston','Patriots','AFC','East'],

  2016: [{ t: 'rename', pfr: 'ram', city: 'Los Angeles', abbr: 'LAR' }],
  2017: [{ t: 'rename', pfr: 'sdg', city: 'Los Angeles', abbr: 'LAC' }],
  2020: [{ t: 'rename', pfr: 'rai', city: 'Las Vegas', abbr: 'LV' }, { t: 'rename', pfr: 'was', name: 'Football Team' }],

};

function rules(y) {
  return {
    games: y === 1982 ? 9 : (y === 1987 ? 15 : (y < 1978 ? 14 : (y < 2021 ? 16 : 17))),
    playoffPerConf: y === 1982 ? 8 : (y < 1978 ? 4 : (y < 1990 ? 5 : (y < 2020 ? 6 : 7))),
    strike: y === 1982 || y === 1987,
    draftRounds: y <= 1976 ? 17 : (y <= 1992 ? 12 : (y === 1993 ? 8 : 7)),
    rosterMax: y <= 1973 ? 40 : (y === 1974 ? 47 : (y <= 1977 ? 43 : (y <= 1992 ? 45 : 53))),
    regOT: y >= 1974,

}

/* ---------- positions ---------- */
const GRPS = ['QB','RB','WR','TE','OL','DL','LB','DB','K','P'];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1, OL: 5, DL: 4, LB: 3, DB: 4, K: 1, P: 1 };
// Who is on the field: QB, five linemen, a kicker and punter, plus the skill and defensive

function formation(c) {
  const F = Object.assign({}, STARTERS), o = c && SCHEME[c.os], d = c && SCHEME[c.ds];

}

const MIX40 = { QB: 3, RB: 4, WR: 4, TE: 2, OL: 8, DL: 6, LB: 5, DB: 6, K: 1, P: 1 };
const POSMAP = {
  QB: 'QB', RB: 'RB', HB: 'RB', FB: 'RB', TB: 'RB',
  WR: 'WR', FL: 'WR', SE: 'WR', SR: 'WR', E: 'WR',
  TE: 'TE',
  T: 'OL', G: 'OL', C: 'OL', OT: 'OL', OG: 'OL', OL: 'OL', LT: 'OL', RT: 'OL', LG: 'OL', RG: 'OL', LS: 'OL',
  DE: 'DL', DT: 'DL', DL: 'DL', NT: 'DL', LDE: 'DL', RDE: 'DL', LDT: 'DL', RDT: 'DL', LE: 'DL', RE: 'DL', MG: 'DL',
  LB: 'LB', MLB: 'LB', OLB: 'LB', ILB: 'LB', LLB: 'LB', RLB: 'LB', LILB: 'LB', RILB: 'LB', LOLB: 'LB', ROLB: 'LB',
  CB: 'DB', S: 'DB', FS: 'DB', SS: 'DB', DB: 'DB', LCB: 'DB', RCB: 'DB', RS: 'DB', LS2: 'DB',
  K: 'K', PK: 'K', P: 'P'
};
const DISPLAY_POS = { OL: ['T','G','C'], DL: ['DE','DT'], DB: ['CB','S'] };

function grpOf(pos, wt) {
  const first = String(pos || '').toUpperCase().split(/[-\/,]/)[0].replace(/[^A-Z]/g, '');
  if (POSMAP[first]) return POSMAP[first];
  const w = num(wt);
  if (w >= 245) return Math.random() < 0.5 ? 'OL' : 'DL';
  if (w >= 215) return 'LB';
  if (w > 0) return 'DB';
  return R.pick(['OL','DL','LB','DB']);
}

/* ---------- generated players ---------- */
const FIRST = ['Bill','Bob','Jim','Tom','John','Mike','Dave','Dan','Joe','Ron','Larry','Gary','Steve','Ken','Rich','Don','Jerry','Terry','Ray','Fred','Walt','Carl','Earl','Lee','Roy','Gene','Chuck','Mel','Ed','Hal','Willie','Leroy','Curtis','Otis','Reggie','Ted','Phil','Rod','Wayne','Doug','Paul','Mark','Greg','Tim','Chris','Pat','Glenn','Ernie','Vince','Al'];
const LAST = ['Johnson','Williams','Brown','Jones','Miller','Davis','Wilson','Anderson','Taylor','Thomas','Moore','Martin','Jackson','White','Harris','Clark','Lewis','Walker','Hall','Allen','Young','King','Wright','Hill','Scott','Green','Baker','Nelson','Carter','Mitchell','Roberts','Turner','Phillips','Campbell','Parker','Evans','Edwards','Collins','Stewart','Morris','Murphy','Cook','Rogers','Reed','Bailey','Bell','Cooper','Howard','Ward','Cox','Brooks','Gray','Hughes','Price','Sanders','Bennett','Wood','Barnes','Ross','Henderson','Coleman','Jenkins','Perry','Powell','Long','Patterson','Foster','Butler','Simmons','Bryant'];
const COLLEGES = ['Alabama','USC','Ohio State','Notre Dame','Texas','Michigan','Grambling','Nebraska','Oklahoma','Penn State','LSU','Purdue','Tennessee','Jackson State','Arizona State','UCLA','Florida A&M','Houston','Stanford','Iowa','Missouri','Southern','Kansas','Ole Miss','Syracuse'];

function genName() { return R.pick(FIRST) + ' ' + R.pick(LAST); }

function mkPlayer(L, o) {
  const p = Object.assign({ id: L.nextId++, name: genName(), pos: '', grp: 'LB', age: 24, ovr: 50, pot: 55, team: -1, inj: 0, yrs: 0, college: '', real: false, hist: {} }, o);
  if (!p.pos) p.pos = DISPLAY_POS[p.grp] ? R.pick(DISPLAY_POS[p.grp]) : p.grp;
  L.players[p.id] = p;
  return p;
}

function genPlayer(L, grp, team, mean, ageRange) {
  const age = R.int(ageRange[0], ageRange[1]);
  const ovr = clamp(Math.round(mean + R.norm() * 7), 35, 85);
  const pot = clamp(ovr + (age < 26 ? R.int(0, 12) : R.int(0, 3)), ovr, 95);
  return mkPlayer(L, { grp, team, age, ovr, pot, yrs: Math.max(0, age - 22), college: R.pick(COLLEGES), real: false });
}

/* ---------- position ratings ----------
   Every player has 2-4 ratings for his position that average out to his overall. Real players'
   strengths come from real data (rosters.json "a": height, weight, Combine results and career
   stats from nflverse and Pro-Football-Reference); everyone else gets a profile from his size.
   p.at holds each rating's offset from overall; age moves speed down and know-how up. */
const ATTR_KEYS = {
  QB: ['arm', 'acc', 'pkt', 'mob'], RB: ['spd', 'pow', 'elu', 'hnd'], WR: ['spd', 'hnd', 'rte', 'phy'], TE: ['blk', 'hnd', 'spd', 'rte'],
  OL: ['pbk', 'rbk', 'str', 'ftw'], DL: ['prs', 'rdf', 'str', 'qck'], LB: ['tkl', 'cov', 'prs', 'spd'], DB: ['cov', 'spd', 'bsk', 'tkl'],
  K: ['kpw', 'kac'], P: ['kpw', 'kac']
};
const ATTR_NAME = { arm: 'Arm strength', acc: 'Accuracy', pkt: 'Pocket presence', mob: 'Mobility', spd: 'Speed', pow: 'Power', elu: 'Elusiveness', hnd: 'Hands',
  rte: 'Route running', phy: 'Size and strength', blk: 'Blocking', pbk: 'Pass blocking', rbk: 'Run blocking', str: 'Strength', ftw: 'Footwork',
  prs: 'Pass rush', rdf: 'Run defense', qck: 'Quickness', tkl: 'Tackling', cov: 'Coverage', bsk: 'Ball skills', kpw: 'Leg strength', kac: 'Accuracy' };
const ATTR_SHORT = { arm: 'ARM', acc: 'ACC', pkt: 'PKT', mob: 'MOB', spd: 'SPD', pow: 'POW', elu: 'ELU', hnd: 'HND', rte: 'RTE', phy: 'PHY', blk: 'BLK', pbk: 'PBK', rbk: 'RBK',
  str: 'STR', ftw: 'FTW', prs: 'RSH', rdf: 'RUN', qck: 'QCK', tkl: 'TKL', cov: 'COV', bsk: 'BALL', kpw: 'LEG', kac: 'ACC' };
// how age moves each rating (relative to the others): athletic ones fade after 28, learned ones grow into the late 20s
const ATTR_ATH = { spd: 1, mob: 1, qck: 1, elu: 0.8, ftw: 0.5, kpw: 0.4, pow: 0.3 };
const ATTR_IQ = { acc: 1, pkt: 1, rte: 1, cov: 0.6, pbk: 0.6, tkl: 0.4, blk: 0.4, bsk: 0.5, kac: 0.6, hnd: 0.3, rdf: 0.3 };
// which way a heavier-than-usual body pushes each rating
const ATTR_SIZE = { pow: 1, str: 1, rbk: 1, rdf: 1, blk: 1, phy: 1, arm: 0.3, tkl: 0.4, spd: -1, qck: -1, mob: -0.8, elu: -0.8, ftw: -0.7, cov: -0.4, rte: -0.3, prs: -0.2, pbk: 0.2 };
// typical height (in) and weight (lb) by position, modern era
const SIZE = { QB: [75, 222, 2, 12], RB: [70.5, 214, 2, 14], WR: [72.5, 198, 2.3, 13], TE: [76.5, 252, 1.4, 10], OL: [76.5, 308, 1.4, 14],
  DL: [75.5, 285, 1.8, 22], LB: [74, 240, 1.5, 10], DB: [71.5, 197, 1.8, 10], K: [72.5, 200, 2, 15], P: [74.5, 214, 2, 15] };
function seeded(p, salt) {
  let h = 2166136261 ^ (p.id || 0) ^ (salt || 0); const s = String(p.name || '');
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function seededNorm(rnd) { return Math.sqrt(-2 * Math.log(Math.max(1e-9, rnd()))) * Math.cos(2 * Math.PI * rnd()); }
function centerAt(a) { const m = a.reduce((s, x) => s + x, 0) / a.length; return a.map(x => clamp(Math.round(x - m), -14, 14)); }
// The real-data entry for this player, if rosters.json has him.
function realFor(p) {
  if (!REAL) return null;
  const d = p.draft && p.draft.year ? p.draft.year + '-' + p.draft.pick : p.realPick && p.reveal ? p.reveal + '-' + p.realPick.pick : null;
  if (d && REAL.byDraft[d] && nameKey(REAL.byDraft[d].n) === nameKey(p.name)) return REAL.byDraft[d];
  const list = REAL.byName[nameKey(p.name)]; if (!list) return null;
  const b = p.rc ? p.rc.y0 - p.rc.a0 : null;
  const same = list.filter(rp => rp.g === p.grp);
  const pool = same.length ? same : list;
  if (b == null || pool.length === 1) return pool[0];

}
// Give a player his ratings profile (once). Real players wait for rosters.json to load.
function ensureAttrs(p, year) {
  const keys = ATTR_KEYS[p.grp]; if (!keys) return false;
  if (p.at && p.at.length === keys.length && p.atG === p.grp) return true;
  const rnd = seeded(p, 7);
  let off = null, src = '';

    if (!REAL || !REAL.hasA) return false; // wait for the ratings data
    const rp = realFor(p);

  }
  if (!p.hin && p.ht) p.hin = htInches(p.ht);
  const S = SIZE[p.grp], y = year || (p.draft && p.draft.year) || (p.rc && p.rc.y0) || 2000;
  const old = Math.max(0, Math.min(30, 2005 - y)) / 30; // lighter linemen in the 1970s
  if (!p.hin) p.hin = Math.round(S[0] - (p.grp === 'OL' || p.grp === 'DL' ? old : 0) + seededNorm(rnd) * S[2]);
  if (!p.wt) p.wt = Math.round(S[1] * (1 - old * (p.grp === 'OL' ? 0.17 : p.grp === 'DL' ? 0.12 : 0.05)) + seededNorm(rnd) * S[3]);

    // no real data: a profile from his frame plus some individuality
    const heavy = clamp((p.wt - S[1] * (1 - old * 0.1)) / S[3] - 0.5 * (p.hin - S[0]) / S[2], -2.5, 2.5);
    off = keys.map(k => (ATTR_SIZE[k] || 0) * heavy * 2.2 + seededNorm(rnd) * 4);

}
// [{k, name, short, v}] — his ratings today (they average to his overall)
function attrs(p, base) {
  const keys = ATTR_KEYS[p.grp]; if (!keys) return [];
  const o = base == null ? p.ovr : base;
  if (!ensureAttrs(p)) return keys.map(k => ({ k, name: ATTR_NAME[k], short: ATTR_SHORT[k], v: o, est: true }));
  const age = p.age || 25, B = p.atB || {};

  const m = raw.reduce((s, x) => s + x, 0) / raw.length;
  return keys.map((k, i) => ({ k, name: ATTR_NAME[k], short: ATTR_SHORT[k], v: clamp(Math.round(o + raw[i] - m), 20, 99) }));
}
function attrOf(p, k, base) { const a = attrs(p, base).find(x => x.k === k); return a ? a.v : (base == null ? p.ovr : base); }
// how far a rating sits above (+) or below (-) his overall
function attrDelta(p, k) { const a = attrs(p).find(x => x.k === k); return a ? a.v - p.ovr : 0; }
function topAttr(p) { const a = attrs(p); if (!a.length) return null; return a.slice().sort((x, y) => y.v - x.v)[0]; }
function attrSource(p) {
  ensureAttrs(p);
  const s = p.atSrc || '';

  if (!p.real) return 'Estimated from his size';
  if (!REAL) return 'Real data still loading';
  const parts = []; if (s.includes('c')) parts.push('Combine'); if (s.includes('s')) parts.push('career stats'); if (s.includes('z')) parts.push('height and weight');
  return parts.length ? 'Based on ' + parts.join(', ') : 'Estimated (no measurements on record)';
}
function ensureAllAttrs(L) { for (const id in L.players) { const p = L.players[id]; if (p.team >= -3 && !p.retiredYear && !(p.at && p.atG === p.grp)) ensureAttrs(p); } }
// rosters.json changed (new ratings data): real players re-read theirs; training and position changes are kept

function genRoster(L, tid, size, mean) {

/* ---------- PFR CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f.length || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function cleanName(s) { return String(s || '').replace(/\s*HOF\s*$/i, '').replace(/[*+]/g, '').trim(); }

function parsePFR(text) {
  const rows = parseCSV(String(text || '').replace(/^﻿/, '').trim()).filter(r => r.some(c => c.trim()));
  const hi = rows.findIndex(r => r.some(c => c.trim() === 'Player'));
  if (hi < 0) throw new Error('No "Player" column found. Copy the CSV text from Share & Export → Get table as CSV.');
  const idx = {};
  rows[hi].forEach((h, i) => { h = h.trim(); if (h && !(h in idx)) idx[h] = i; });
  const get = (r, k) => (k in idx ? (r[idx[k]] || '').trim() : '');
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const name = cleanName(get(r, 'Player'));
    if (!name || name === 'Player' || /team total/i.test(name)) continue;
    const o = {}; for (const k in idx) o[k] = get(r, k);
    o.Player = name; out.push(o);
  }
  const kind = ('Rnd' in idx || 'Pick' in idx) ? 'draft' : (('AV' in idx || 'GS' in idx || 'Wt' in idx) ? 'roster' : 'unknown');
  if (kind === 'unknown') throw new Error('This doesn\'t look like a roster or draft table.');
  if (!out.length) throw new Error('The table has a header but no player rows.');
  return { kind, rows: out };
}

/* ---------- jersey numbers & ring of honor ---------- */
const NUM_RANGES = { QB: [[1, 19]], K: [[1, 19]], P: [[1, 19]], RB: [[20, 49]], DB: [[20, 49]], WR: [[80, 89], [10, 19]], TE: [[80, 89], [40, 49]],
  OL: [[50, 79]], DL: [[60, 79], [90, 99]], LB: [[50, 59], [90, 99]] };
function retiredNums(L, tid) { return new Set(((L.teams[tid] || {}).ring || []).map(r => r.num)); }
function ensureNumbers(L) {

  for (const tid in byTeam) {
    const used = new Set(), ret = retiredNums(L, +tid);
    const list = byTeam[tid].sort((a, b) => (b.yrs || 0) - (a.yrs || 0));
    const need = [];

  t.ring.push({ id: pid, name: p.name, pos: p.pos, num, y: L.year, seasons: seasonsWith(p, tid), by: by || 'user' });
  addNews(L, `${t.city} ${t.name} retire ${num ? '#' + num + ' for ' : 'the number of '}${p.pos} ${p.name}${by === 'ai' ? '' : ''}.`);

}

function playerFromRoster(L, r, tid) {
  const grp = grpOf(r.Pos, r.Wt);
  const age = num(r.Age) || 25, g = num(r.G), gs = num(r.GS), av = num(r.AV);
  const yrs = /rook/i.test(r.Yrs) ? 0 : num(r.Yrs);
  let ovr;
  if (grp === 'K' || grp === 'P') ovr = 58 + av * 3 + (g >= 10 ? 6 : 0) + R.int(-3, 3);
  else ovr = 44 + av * 2.6 + Math.min(gs, 14) * 0.7 + (g > 0 ? 2 : 0) + R.int(-2, 2);

// Scouting: what teams knew in the spring of the draft. Based on where the player
// was really picked plus a small bump for big programs. It ignores his NFL career.
const BIG_SCHOOLS = /^(Alabama|USC|Southern California|Ohio St|Notre Dame|Texas|Michigan|Nebraska|Oklahoma|Penn St|LSU|Tennessee|UCLA|Southern Cal|Arkansas|Georgia|Florida|Miami|Auburn|Stanford|Purdue|Michigan St|Mississippi|Ole Miss)/i;

function collegeBump(c) { c = String(c || ''); return BIG_SCHOOLS.test(c) ? 2 : (SMALL_POWERS.test(c) ? 1 : 0); }

// The last season the imported data covers. Players whose career runs to here are still active,
// so their careers are projected forward instead of judged on a few seasons.
const DATA_LAST = 2025;
// Approximate Value isn't equal across positions: quarterbacks pile it up, tight ends, kickers and
// punters get little. Each position is scaled to the same footing before it becomes a rating.
const POS_AV = { QB: 0.86, RB: 1.08, WR: 1.04, TE: 1.6, OL: 0.98, DL: 0.97, LB: 0.96, DB: 1.08, K: 1.6, P: 2.0 };
// Above 88 ratings get harder to earn, so 99 is for the very best of all time.

  const prior = 1.5 + 7 * Math.exp(-(pick - 1) / 50); // AV a season that a pick like this usually gives

  if (to >= DATA_LAST - 1) {

  const slot = slotGrade(overall), college = r['College/Univ'] || '';

  const C = realCareer(r, year, grp);

  // Draft slot only matters much when we don't know how his career went: a proven late-rounder
  // (5+ real seasons) is judged almost entirely on what he did, not where he was picked.
  const ws = C.s >= 5 ? 0.05 : C.s >= 2 ? 0.1 : 0.2;
  const pot = clamp(Math.round(compressTop(ws * slot + (1 - ws) * C.score - 2.5 + R.norm() * noiseFor(C.s))), 40, 99);

  return mkPlayer(L, {
    name: r.Player, pos: pos || undefined, grp, age: num(r.Age) || 22, ovr, pot, team: -3, yrs: 0,
    college, real: true, scout, reveal: year, quick: C.quick || undefined, realTo: num(r.To) || undefined,
    realPick: { rnd: num(r.Rnd), pick: overall, tm: r.Tm || '' }

// filler: true for the extra prospects added to a real draft class (late-round depth, never early picks).
function genProspect(L, year, filler) {
  const grp = R.pick(['QB','RB','RB','WR','WR','TE','OL','OL','OL','DL','DL','DL','LB','LB','DB','DB','DB','K','P'].filter(g => g !== 'K' && g !== 'P' || Math.random() < 0.3));
  const pot = clamp(Math.round((filler ? 46 : 52) + R.norm() * (filler ? 6 : 10)), 40, filler ? 72 : 96);
  const ovr = clamp(pot - R.int(8, 18), 36, 78);

const DIFF = {

  pro:    { name: 'Pro', tradeAsk: 1.05, offer: [0.85, 1.15], aiVisits: 10, edge: 0, smartStyles: 1, counter: false },
  allpro: { name: 'All-Pro', tradeAsk: 1.2, offer: [0.7, 1.0], aiVisits: 15, edge: -1, smartStyles: 1, counter: true }
};
function diff(L) { return DIFF[L.diff] || DIFF.pro; }
function setDifficulty(L, d) { if (DIFF[d]) { L.diff = d; addNews(L, `Difficulty set to ${DIFF[d].name}.`); } }

// Each AI team picks the scheme its roster suits best: pass if its QB and receivers
// outclass its backs and line, blitz if its front four is the strength, and so on.
// Favorites play it safe; underdogs take more risks.
function bestStyle(L, tid, avg) {
  const r = ratings(L, tid, { off: 'bal', def: 'bal' });
  const pass = (r.QB * 0.6 + r.WR * 0.4) - (avg.QB * 0.6 + avg.WR * 0.4);
  const run = (r.RB * 0.5 + r.OL * 0.5) - (avg.RB * 0.5 + avg.OL * 0.5);
  const off = pass - run > 3 ? 'pass' : (run - pass > 3 ? 'run' : 'bal');
  const dl = r.DL - avg.DL, db = r.DB - avg.DB;
  const def = dl - db > 3 ? 'blitz' : (db - dl > 3 ? 'soft' : 'bal');
  const ovr = (r.off + r.def) / 2;
  const aggr = clamp(Math.round((50 + (avg.ovr - ovr) * 4) / 10) * 10, 20, 80);
  return { off, def, aggr };
}
function aiStyles(L, announce, fresh) {
  ensureSchemes(L); resetShares(L);
  const all = L.teams.map(t => ratings(L, t.id, { off: 'bal', def: 'bal' }));
  const avg = {}; GRPS.forEach(g => avg[g] = all.reduce((s, r) => s + r[g], 0) / all.length);
  avg.ovr = all.reduce((s, r) => s + (r.off + r.def) / 2, 0) / all.length;
  const changes = [];
  for (const t of L.teams) {
    if (t.id === L.user) continue;
    const c = t.coach, r = all[t.id] || ratings(L, t.id, { off: 'bal', def: 'bal' });
    const st = t.staff || {};
    // The team that invented a scheme runs it the year it appears.
    const inv = side => (side === 'off' ? OFF_SCHEMES : DEF_SCHEMES).find(s => s.from === L.year && s.origin === t.pfr && !s.base);
    const pickSide = side => {
      const cur = side === 'off' ? c.os : c.ds, iv = inv(side);
      if (iv) return iv.id;
      if (!fresh && Math.random() > diff(L).smartStyles) return cur;
      const pref = side === 'off' ? (st.oc && st.oc.pref) : (st.dc && st.dc.pref);
      const b = bestScheme(L, t.id, side, r, pref);
      const val = s => schemeFit(r, s) * 1.2 + schemeTrend(L, s.id) + (pref && pref === s.fam ? 0.6 : 0);
      // Coaches stick with their system unless something clearly better comes along.
      // switching means a year of installing the new scheme
      return (fresh || !SCHEME[cur] || val(b) - 1.0 - val(SCHEME[cur]) > 0.5) ? b.id : cur;
    };
    const os = pickSide('off'), ds = pickSide('def');
    if (announce && (os !== c.os || ds !== c.ds)) changes.push(`${t.abbr} ${os !== c.os ? 'to the ' + SCHEME[os].name : ''}${os !== c.os && ds !== c.ds ? ' and ' : ''}${ds !== c.ds ? (os !== c.os ? 'the ' : 'to the ') + SCHEME[ds].name : ''}`);
    c.os = os; c.ds = ds; c.off = SCHEME[os].fam; c.def = SCHEME[ds].fam;
    const ovr = (r.off + r.def) / 2;
    c.aggr = clamp(Math.round((50 + (avg.ovr - ovr) * 4) / 10) * 10, 20, 80);
    resetShares(L);
  }
  if (changes.length) addNews(L, 'New schemes for ' + L.year + ': ' + changes.slice(0, 6).join('; ') + (changes.length > 6 ? `; and ${changes.length - 6} more` : '') + '.');
}
// All-Pro: the AI coach adjusts his game plan to yours.
function counterPlan(own, user, L) {
  const y = L ? L.year : 1970;
  let bd = null, bv = 1e9;
  for (const d of schemesFor(y, 'def')) { const v = schemeEdge(y, user.os, d.id) + (DEF_VS[d.fam] || DEF_VS.bal)[user.off]; if (v < bv) { bv = v; bd = d; } }
  let bo = null, bo2 = -1e9;
  for (const o of schemesFor(y, 'off')) { const v = schemeEdge(y, o.id, user.ds) + ((DEF_VS[user.def] || DEF_VS.bal)[o.fam] || 0); if (v > bo2) { bo2 = v; bo = o; } }
  const out = Object.assign({}, own);
  if (bd) { out.ds = bd.id; out.def = bd.fam; }
  if (bo && bo2 > 0.3) { out.os = bo.id; out.off = bo.fam; }
  return out;

function randomCoach() { return { off: R.pick(['run', 'bal', 'bal', 'pass']), def: R.pick(['soft', 'bal', 'bal', 'blitz']), aggr: R.int(3, 7) * 10, youth: Math.random() < 0.3 }; }
function ensureLeague(L) {
  ensurePicks(L);

  if (!L.numbered) { ensureNumbers(L); L.numbered = 1; }
  ensureStaff(L);
  L.job = L.job || { sec: 60, hist: [] };
  if (!L.retired) archivePlayers(L);
  ensureContracts(L);
  if (L.phase === 'offseason') ensureFA(L);
  if (L.styles !== 2) { aiStyles(L, false); L.styles = 2; }

/* ---------- schedule ---------- */
function divKey(t) { return t.conf + t.div; }

function makeSchedule(L) {

  const key = (a, b) => a < b ? a + '-' + b : b + '-' + a;
  T.forEach(a => { cnt[a.id] = 0; home[a.id] = 0; T.forEach(b => { if (a.id < b.id && divKey(a) === divKey(b)) need[key(a.id, b.id)] = 2; }); });
  const weeks = [];
  for (let w = 0; w < n + 6 && T.some(t => cnt[t.id] < n); w++) {
    let games = null;
    for (let attempt = 0; attempt < 60 && !games; attempt++) {
      const pool = R.shuffle(T.filter(t => cnt[t.id] < n).map(t => t.id));
      const used = new Set(), g = [];
      for (const a of pool) {
        if (used.has(a)) continue;
        let best = null, bs = -1e9;
        for (const b of pool) {
          if (b === a || used.has(b)) continue;
          const k = key(a, b);
          const s = (need[k] || 0) * 60 - (met[k] || 0) * 45 + (T[a].conf === T[b].conf ? 8 : 0) + Math.random() * 12;
          if (s > bs) { bs = s; best = b; }
        }
        if (best === null) continue;
        used.add(a); used.add(best); g.push([a, best]);
      }
      if (g.length >= Math.floor(pool.length / 2) - (attempt > 40 ? 1 : 0)) games = g;
    }

/* ---------- chemistry and team fit ----------

/* ---------- game simulation ---------- */
const PW = { run: 0.8, bal: 1, pass: 1.2 };

const REC_KEYS = [['py', 'Passing yards'], ['ptd', 'Passing TDs'], ['ry', 'Rushing yards'], ['rtd', 'Rushing TDs'], ['rec', 'Receptions'], ['recy', 'Receiving yards'], ['rectd', 'Receiving TDs'], ['sk', 'Sacks'], ['dint', 'Interceptions'], ['fgm', 'Field goals']];

  const out = (CAREER_KEYS[p.grp] || ['g']).map(k => {
    const vals = all.map(x => ({ x, v: careerTotal(x, k) })).sort((a, b) => b.v - a.v), mine = careerTotal(p, k);
    return { k, label: STAT_NAME[k], v: mine, rank: 1 + vals.filter(v => v.v > mine).length, of: vals.length, top: vals.slice(0, 3).map(v => ({ id: v.x.id, name: v.x.name, v: v.v })) };
  });
  const sc = all.map(x => careerScore(x)).sort((a, b) => b - a), ms = careerScore(p);
  out.push({ k: 'legacy', label: 'legacy score', v: Math.round(ms), rank: 1 + sc.filter(v => v > ms).length, of: sc.length, top: [] });
  return out;
}
function careerLegacy(L) {
  const C = L.career, p = careerP(L); if (!p) return null;
  const line = hofLine(L, p.grp), s = careerScore(p);
  const rings = L.champs.filter(c => p.hist[c.y] && p.hist[c.y].tm === c.champ).map(c => c.y);
  const jerseys = L.teams.filter(t => (t.ring || []).some(r => r.id === p.id)).map(t => ({ tid: t.id, num: t.ring.find(r => r.id === p.id).num }));
  return { score: Math.round(s), line: line && Math.round(line), pct: line ? Math.round(s / line * 100) : null, rings, jerseys, hof: p.hof || 0, verdict: C.verdict || null };
}
