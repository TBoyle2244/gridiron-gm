/* Layout: one-column front-office app; sticky team banner on top, fixed tab bar at the bottom, cards in between. */

  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;
  --good: #57c27e; --warn: #e2a64a; --bad: #e76a5a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1611; --panel: #15211a; --ink: #e5ebe2; --muted: #93a596; --line: #263a2d;
  --field: #2f8a50; --field-ink: #f4f7f1; --gold: #e2b444; --gold-soft: #3a3016;

<script>
/* Gridiron GM — simulation engine (no DOM). Works in browser and Node. */
(function (root) {
'use strict';

/* ---------- random helpers ---------- */
const R = {
  int: (a, b) => a + Math.floor(Math.random() * (b - a + 1)),
  pick: a => a[Math.floor(Math.random() * a.length)],
  norm: () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
  shuffle: a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  poisson: l => { const L = Math.exp(-Math.max(0.01, l)); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
};
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };

/* ---------- league history data ---------- */
// [pfr franchise code, abbr, city, nickname, conference, division]
const TEAMS_1970 = [
  ['clt','BAL','Baltimore','Colts','AFC','East'], ['nwe','BOS','Boston','Patriots','AFC','East'],
  ['buf','BUF','Buffalo','Bills','AFC','East'], ['mia','MIA','Miami','Dolphins','AFC','East'],
  ['nyj','NYJ','New York','Jets','AFC','East'],
  ['cin','CIN','Cincinnati','Bengals','AFC','Central'], ['cle','CLE','Cleveland','Browns','AFC','Central'],
  ['oti','HOU','Houston','Oilers','AFC','Central'], ['pit','PIT','Pittsburgh','Steelers','AFC','Central'],
  ['den','DEN','Denver','Broncos','AFC','West'], ['kan','KC','Kansas City','Chiefs','AFC','West'],
  ['rai','OAK','Oakland','Raiders','AFC','West'], ['sdg','SD','San Diego','Chargers','AFC','West'],
  ['dal','DAL','Dallas','Cowboys','NFC','East'], ['nyg','NYG','New York','Giants','NFC','East'],
  ['phi','PHI','Philadelphia','Eagles','NFC','East'], ['crd','STL','St. Louis','Cardinals','NFC','East'],
  ['was','WAS','Washington','Redskins','NFC','East'],
  ['chi','CHI','Chicago','Bears','NFC','Central'], ['det','DET','Detroit','Lions','NFC','Central'],
  ['gnb','GB','Green Bay','Packers','NFC','Central'], ['min','MIN','Minnesota','Vikings','NFC','Central'],
  ['atl','ATL','Atlanta','Falcons','NFC','West'], ['ram','LA','Los Angeles','Rams','NFC','West'],
  ['nor','NO','New Orleans','Saints','NFC','West'], ['sfo','SF','San Francisco','49ers','NFC','West']

// League changes applied at the start of each listed season.
const EVENTS = {
  1971: [{ t: 'rename', pfr: 'nwe', city: 'New England', abbr: 'NE' }],
  1976: [{ t: 'expand', team: ['sea','SEA','Seattle','Seahawks','NFC','West'] },
         { t: 'expand', team: ['tam','TB','Tampa Bay','Buccaneers','AFC','West'] }],
  1977: [{ t: 'realign', pfr: 'sea', conf: 'AFC', div: 'West' }, { t: 'realign', pfr: 'tam', conf: 'NFC', div: 'Central' }],
  1982: [{ t: 'rename', pfr: 'rai', city: 'Los Angeles', abbr: 'LARD' }],
  1984: [{ t: 'rename', pfr: 'clt', city: 'Indianapolis', abbr: 'IND' }],
  1988: [{ t: 'rename', pfr: 'crd', city: 'Phoenix', abbr: 'PHX' }],
  1994: [{ t: 'rename', pfr: 'crd', city: 'Arizona', abbr: 'ARI' }],
  1995: [{ t: 'rename', pfr: 'ram', city: 'St. Louis', abbr: 'STL' }, { t: 'rename', pfr: 'rai', city: 'Oakland', abbr: 'OAK' },
         { t: 'expand', team: ['car','CAR','Carolina','Panthers','NFC','West'] },
         { t: 'expand', team: ['jax','JAX','Jacksonville','Jaguars','AFC','Central'] }],
  1996: [{ t: 'rename', pfr: 'cle', newPfr: 'rav', city: 'Baltimore', name: 'Ravens', abbr: 'BAL' }],
  1997: [{ t: 'rename', pfr: 'oti', city: 'Tennessee', abbr: 'TEN' }],
  1999: [{ t: 'rename', pfr: 'oti', name: 'Titans' }, { t: 'expand', team: ['cle','CLE','Cleveland','Browns','AFC','Central'] }]
};

function rules(y) {
  return {
    games: y < 1978 ? 14 : (y < 2021 ? 16 : 17),
    playoffPerConf: y < 1978 ? 4 : (y < 1990 ? 5 : (y < 2020 ? 6 : 7)),
    draftRounds: y <= 1976 ? 17 : (y <= 1992 ? 12 : (y === 1993 ? 8 : 7)),
    rosterMax: y <= 1973 ? 40 : (y === 1974 ? 47 : (y <= 1977 ? 43 : (y <= 1992 ? 45 : 53))),
    regOT: y >= 1974,
    tiesCountHalf: y >= 1972,
    salaryCap: y >= 1994
  };
}

/* ---------- positions ---------- */
const GRPS = ['QB','RB','WR','TE','OL','DL','LB','DB','K','P'];
const STARTERS = { QB: 1, RB: 2, WR: 2, TE: 1, OL: 5, DL: 4, LB: 3, DB: 4, K: 1, P: 1 };
const MIX40 = { QB: 3, RB: 4, WR: 4, TE: 2, OL: 8, DL: 6, LB: 5, DB: 6, K: 1, P: 1 };
const POSMAP = {
  QB: 'QB', RB: 'RB', HB: 'RB', FB: 'RB', TB: 'RB',
  WR: 'WR', FL: 'WR', SE: 'WR', SR: 'WR', E: 'WR',
  TE: 'TE',
  T: 'OL', G: 'OL', C: 'OL', OT: 'OL', OG: 'OL', OL: 'OL', LT: 'OL', RT: 'OL', LG: 'OL', RG: 'OL', LS: 'OL',
  DE: 'DL', DT: 'DL', DL: 'DL', NT: 'DL', LDE: 'DL', RDE: 'DL', LDT: 'DL', RDT: 'DL', LE: 'DL', RE: 'DL', MG: 'DL',
  LB: 'LB', MLB: 'LB', OLB: 'LB', ILB: 'LB', LLB: 'LB', RLB: 'LB', LILB: 'LB', RILB: 'LB', LOLB: 'LB', ROLB: 'LB',
  CB: 'DB', S: 'DB', FS: 'DB', SS: 'DB', DB: 'DB', LCB: 'DB', RCB: 'DB', RS: 'DB', LS2: 'DB',
  K: 'K', PK: 'K', P: 'P'
};
const DISPLAY_POS = { OL: ['T','G','C'], DL: ['DE','DT'], DB: ['CB','S'] };

function grpOf(pos, wt) {
  const first = String(pos || '').toUpperCase().split(/[-\/,]/)[0].replace(/[^A-Z]/g, '');
  if (POSMAP[first]) return POSMAP[first];
  const w = num(wt);
  if (w >= 245) return Math.random() < 0.5 ? 'OL' : 'DL';
  if (w >= 215) return 'LB';
  if (w > 0) return 'DB';
  return R.pick(['OL','DL','LB','DB']);
}

/* ---------- generated players ---------- */
const FIRST = ['Bill','Bob','Jim','Tom','John','Mike','Dave','Dan','Joe','Ron','Larry','Gary','Steve','Ken','Rich','Don','Jerry','Terry','Ray','Fred','Walt','Carl','Earl','Lee','Roy','Gene','Chuck','Mel','Ed','Hal','Willie','Leroy','Curtis','Otis','Reggie','Ted','Phil','Rod','Wayne','Doug','Paul','Mark','Greg','Tim','Chris','Pat','Glenn','Ernie','Vince','Al'];
const LAST = ['Johnson','Williams','Brown','Jones','Miller','Davis','Wilson','Anderson','Taylor','Thomas','Moore','Martin','Jackson','White','Harris','Clark','Lewis','Walker','Hall','Allen','Young','King','Wright','Hill','Scott','Green','Baker','Nelson','Carter','Mitchell','Roberts','Turner','Phillips','Campbell','Parker','Evans','Edwards','Collins','Stewart','Morris','Murphy','Cook','Rogers','Reed','Bailey','Bell','Cooper','Howard','Ward','Cox','Brooks','Gray','Hughes','Price','Sanders','Bennett','Wood','Barnes','Ross','Henderson','Coleman','Jenkins','Perry','Powell','Long','Patterson','Foster','Butler','Simmons','Bryant'];
const COLLEGES = ['Alabama','USC','Ohio State','Notre Dame','Texas','Michigan','Grambling','Nebraska','Oklahoma','Penn State','LSU','Purdue','Tennessee','Jackson State','Arizona State','UCLA','Florida A&M','Houston','Stanford','Iowa','Missouri','Southern','Kansas','Ole Miss','Syracuse'];

function genName() { return R.pick(FIRST) + ' ' + R.pick(LAST); }

function mkPlayer(L, o) {
  const p = Object.assign({ id: L.nextId++, name: genName(), pos: '', grp: 'LB', age: 24, ovr: 50, pot: 55, team: -1, inj: 0, yrs: 0, college: '', real: false, hist: {} }, o);
  if (!p.pos) p.pos = DISPLAY_POS[p.grp] ? R.pick(DISPLAY_POS[p.grp]) : p.grp;
  L.players[p.id] = p;
  return p;
}

function genPlayer(L, grp, team, mean, ageRange) {
  const age = R.int(ageRange[0], ageRange[1]);
  const ovr = clamp(Math.round(mean + R.norm() * 7), 35, 85);
  const pot = clamp(ovr + (age < 26 ? R.int(0, 12) : R.int(0, 3)), ovr, 95);
  return mkPlayer(L, { grp, team, age, ovr, pot, yrs: Math.max(0, age - 22), college: R.pick(COLLEGES), real: false });
}

function genRoster(L, tid, size, mean) {
  const mix = Object.assign({}, MIX40);
  const extra = ['OL','DB','DL','LB','WR','RB','TE'];
  let n = 40, i = 0;
  while (n < size) { mix[extra[i % extra.length]]++; n++; i++; }
  for (const g of GRPS) for (let k = 0; k < mix[g]; k++) genPlayer(L, g, tid, (mean || 56) + (k < STARTERS[g] ? 6 : -2), [22, 31]);
}

/* ---------- PFR CSV import ---------- */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f.length || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function cleanName(s) { return String(s || '').replace(/\s*HOF\s*$/i, '').replace(/[*+]/g, '').trim(); }

function parsePFR(text) {
  const rows = parseCSV(String(text || '').replace(/^﻿/, '').trim()).filter(r => r.some(c => c.trim()));
  const hi = rows.findIndex(r => r.some(c => c.trim() === 'Player'));
  if (hi < 0) throw new Error('No "Player" column found. Copy the CSV text from Share & Export → Get table as CSV.');
  const idx = {};
  rows[hi].forEach((h, i) => { h = h.trim(); if (h && !(h in idx)) idx[h] = i; });
  const get = (r, k) => (k in idx ? (r[idx[k]] || '').trim() : '');
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const name = cleanName(get(r, 'Player'));
    if (!name || name === 'Player' || /team total/i.test(name)) continue;
    const o = {}; for (const k in idx) o[k] = get(r, k);
    o.Player = name; out.push(o);
  }
  const kind = ('Rnd' in idx || 'Pick' in idx) ? 'draft' : (('AV' in idx || 'GS' in idx || 'Wt' in idx) ? 'roster' : 'unknown');
  if (kind === 'unknown') throw new Error('This doesn\'t look like a roster or draft table.');
  if (!out.length) throw new Error('The table has a header but no player rows.');
  return { kind, rows: out };
}

function playerFromRoster(L, r, tid) {
  const grp = grpOf(r.Pos, r.Wt);
  const age = num(r.Age) || 25, g = num(r.G), gs = num(r.GS), av = num(r.AV);
  const yrs = /rook/i.test(r.Yrs) ? 0 : num(r.Yrs);
  let ovr;
  if (grp === 'K' || grp === 'P') ovr = 58 + av * 3 + (g >= 10 ? 6 : 0) + R.int(-3, 3);
  else ovr = 44 + av * 2.6 + Math.min(gs, 14) * 0.7 + (g > 0 ? 2 : 0) + R.int(-2, 2);
  ovr = clamp(Math.round(ovr), 38, 97);
  const growth = age <= 25 ? R.int(2, 12) * (27 - age) / 5 : R.int(0, 2);
  const pot = clamp(Math.round(ovr + growth), ovr, 99);
  const pos = String(r.Pos || '').toUpperCase().split(/[-\/]/)[0] || '';
  return mkPlayer(L, { name: r.Player, pos: pos || undefined, grp, age, ovr, pot, team: tid, yrs, college: r['College/Univ'] || '', real: true });
}

// Scouting: what teams knew in the spring of the draft. Based on where the player
// was really picked plus a small bump for big programs. It ignores his NFL career.
const BIG_SCHOOLS = /^(Alabama|USC|Southern California|Ohio St|Notre Dame|Texas|Michigan|Nebraska|Oklahoma|Penn St|LSU|Tennessee|UCLA|Southern Cal|Arkansas|Georgia|Florida|Miami|Auburn|Stanford|Purdue|Michigan St|Mississippi|Ole Miss)/i;
const SMALL_POWERS = /^(Grambling|Jackson St|Southern|Florida A&M|Tennessee St|Alcorn|Prairie View|Texas Southern|Morgan St|Maryland-Eastern Shore)/i;
function slotGrade(overall) { return 50 + 31 * Math.exp(-(Math.max(1, overall) - 1) / 70); }
function collegeBump(c) { c = String(c || ''); return BIG_SCHOOLS.test(c) ? 2 : (SMALL_POWERS.test(c) ? 1 : 0); }

function prospectFromDraft(L, r, year) {
  const grp = grpOf(r.Pos, 0);
  const overall = num(r.Pick) || 300;
  const slot = slotGrade(overall), college = r['College/Univ'] || '';
  // What he actually becomes: part draft slot, part real career, plus luck.
  const wav = Math.max(0, num(r.wAV)), pb = num(r.PB), ap = num(r.AP1);
  const career = 45 + Math.sqrt(wav) * 4.2 + pb * 0.8 + ap * 1.0;
  const pot = clamp(Math.round(0.4 * slot + 0.6 * career + R.norm() * 7), 40, 99);
  const ovr = clamp(pot - R.int(8, 18), 36, 80);
  const scout = clamp(Math.round(slot + collegeBump(college) + R.norm() * 4), 40, 92);
  const pos = String(r.Pos || '').toUpperCase().split(/[-\/]/)[0];
  return mkPlayer(L, {
    name: r.Player, pos: pos || undefined, grp, age: num(r.Age) || 22, ovr, pot, team: -3, yrs: 0,
    college, real: true, scout, reveal: year,
    realPick: { rnd: num(r.Rnd), pick: overall, tm: r.Tm || '' }
  });
}

function genProspect(L, year) {
  const grp = R.pick(['QB','RB','RB','WR','WR','TE','OL','OL','OL','DL','DL','DL','LB','LB','DB','DB','DB','K','P'].filter(g => g !== 'K' && g !== 'P' || Math.random() < 0.3));
  const pot = clamp(Math.round(52 + R.norm() * 10), 40, 96);
  const ovr = clamp(pot - R.int(8, 18), 36, 78);
  return mkPlayer(L, { grp, age: R.int(21, 23), ovr, pot, team: -3, college: R.pick(COLLEGES), real: false, reveal: year, scout: clamp(Math.round(pot + R.norm() * 8), 40, 92) });
}

/* ---------- league creation ---------- */
/* ---------- difficulty ---------- */
const DIFF = {
  rookie: { name: 'Rookie', tradeAsk: 0.95, offer: [1.0, 1.3], aiVisits: 5, edge: 1.5, smartStyles: 0.5, counter: false },
  pro:    { name: 'Pro', tradeAsk: 1.05, offer: [0.85, 1.15], aiVisits: 10, edge: 0, smartStyles: 1, counter: false },
  allpro: { name: 'All-Pro', tradeAsk: 1.2, offer: [0.7, 1.0], aiVisits: 15, edge: -1, smartStyles: 1, counter: true }
};
function diff(L) { return DIFF[L.diff] || DIFF.pro; }
function setDifficulty(L, d) { if (DIFF[d]) { L.diff = d; addNews(L, `Difficulty set to ${DIFF[d].name}.`); } }

// Each AI team picks the scheme its roster suits best: pass if its QB and receivers
// outclass its backs and line, blitz if its front four is the strength, and so on.
// Favorites play it safe; underdogs take more risks.
function bestStyle(L, tid, avg) {
  const r = ratings(L, tid, { off: 'bal', def: 'bal' });
  const pass = (r.QB * 0.6 + r.WR * 0.4) - (avg.QB * 0.6 + avg.WR * 0.4);
  const run = (r.RB * 0.5 + r.OL * 0.5) - (avg.RB * 0.5 + avg.OL * 0.5);
  const off = pass - run > 3 ? 'pass' : (run - pass > 3 ? 'run' : 'bal');
  const dl = r.DL - avg.DL, db = r.DB - avg.DB;
  const def = dl - db > 3 ? 'blitz' : (db - dl > 3 ? 'soft' : 'bal');
  const ovr = (r.off + r.def) / 2;
  const aggr = clamp(Math.round((50 + (avg.ovr - ovr) * 4) / 10) * 10, 20, 80);
  return { off, def, aggr };
}
function aiStyles(L, announce) {
  const all = L.teams.map(t => ratings(L, t.id, { off: 'bal', def: 'bal' }));
  const avg = {}; GRPS.forEach(g => avg[g] = all.reduce((s, r) => s + r[g], 0) / all.length);
  avg.ovr = all.reduce((s, r) => s + (r.off + r.def) / 2, 0) / all.length;
  const changes = [];
  for (const t of L.teams) {
    if (t.id === L.user) continue;
    if (Math.random() > diff(L).smartStyles) continue;
    const b = bestStyle(L, t.id, avg), c = t.coach, before = c.off + c.def;
    if (announce && before !== b.off + b.def) changes.push(`${t.abbr} ${b.off !== c.off ? 'go ' + ({ run: 'run-first', bal: 'balanced', pass: 'pass-first' })[b.off] : ''}${b.off !== c.off && b.def !== c.def ? ', ' : ''}${b.def !== c.def ? ({ soft: 'bend-don\'t-break', bal: 'base 4-3', blitz: 'blitz-heavy' })[b.def] + ' on D' : ''}`);
    c.off = b.off; c.def = b.def; c.aggr = b.aggr;
  }
  if (changes.length) addNews(L, 'New schemes for ' + L.year + ': ' + changes.slice(0, 6).join('; ') + (changes.length > 6 ? `; and ${changes.length - 6} more` : '') + '.');
}
// All-Pro: the AI coach adjusts his game plan to yours.
function counterPlan(own, user) {
  const def = Object.keys(DEF_VS).sort((a, b) => DEF_VS[a][user.off] - DEF_VS[b][user.off])[0];
  const v = DEF_VS[user.def] || DEF_VS.bal;
  const best = Object.keys(v).sort((a, b) => v[b] - v[a])[0];
  return Object.assign({}, own, { def, off: v[best] > 0 ? best : own.off });
}

function randomCoach() { return { off: R.pick(['run', 'bal', 'bal', 'pass']), def: R.pick(['soft', 'bal', 'bal', 'blitz']), aggr: R.int(3, 7) * 10, youth: Math.random() < 0.3 }; }
function ensureLeague(L) {
  ensurePicks(L);
  if (!L.diff) L.diff = 'pro';
  if (!L.retired) archivePlayers(L);
  ensureContracts(L);
  if (L.phase === 'offseason') ensureFA(L);
  if (L.styles !== 2) { aiStyles(L, false); L.styles = 2; }
}
function mkTeam(id, a) {
  const [pfr, abbr, city, name, conf, div] = a;
  return { id, pfr, abbr, city, name, conf, div, w: 0, l: 0, t: 0, pf: 0, pa: 0, home: 0,
    coach: randomCoach(), hist: [] };
}

function newLeague(imports, userPfr, opts) {
  const L = { v: 1, year: 1970, phase: 'preseason', week: 0, teams: [], players: {}, nextId: 1,
    schedule: [], playoffs: null, draft: null, news: [], champs: [], user: 0 };
  TEAMS_1970.forEach((a, i) => L.teams.push(mkTeam(i, a)));
  const u = L.teams.find(t => t.pfr === userPfr); L.user = u ? u.id : 0;
  const gen = [];
  for (const t of L.teams) {
    const rows = imports && imports.rosters && imports.rosters[t.pfr];
    if (rows && rows.length) rows.forEach(r => playerFromRoster(L, r, t.id));
    else { genRoster(L, t.id, rules(1970).rosterMax); gen.push(t.abbr); }
  }
  addNews(L, 'The 1970 season begins. The AFL and NFL have merged into one 26-team league.');
  if (gen.length) addNews(L, 'Generated placeholder rosters for: ' + gen.join(', ') + '.');
  L.teams[L.user].coach = { off: 'bal', def: 'bal', aggr: 50, youth: false };
  L.styles = 2;
  L.diff = DIFF[opts && opts.diff] ? opts.diff : 'pro';
  aiCutdowns(L);
  ensurePicks(L);
  aiStyles(L, false);
  ensureContracts(L);
  return L;
}

function addNews(L, s) { L.news.unshift({ y: L.year, w: L.phase === 'regular' ? L.week + 1 : null, s }); if (L.news.length > 150) L.news.length = 150; }

/* ---------- rosters ---------- */
function roster(L, tid) { const out = []; for (const id in L.players) { const p = L.players[id]; if (p.team === tid) out.push(p); } return out; }
function freeAgents(L) { return roster(L, -1); }

function value(p) {
  return p.ovr + Math.max(0, p.pot - p.ovr) * (p.age < 26 ? 0.6 : 0.2) - Math.max(0, p.age - 29) * 2.5 + (p.grp === 'QB' ? 4 : 0) - (p.grp === 'K' || p.grp === 'P' ? 8 : 0);
}

// Effective rating: a player playing through an injury loses 12 points.
const HURT_PENALTY = 12;
function canPlayHurt(p) { return p.inj > 0 && p.inj < 20; }
function eff(p) { return p.inj && p.playHurt ? p.ovr - HURT_PENALTY : p.ovr; }
function available(p) { return !p.inj || (p.playHurt && canPlayHurt(p)); }
// Depth order for a position group: the coach's manual order first, then by rating.
function dcOrder(L, tid, g, list) {
  const ord = ((L.teams[tid].dc || {})[g]) || [];
  return list.sort((a, b) => {
    const ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
    if (ia >= 0 || ib >= 0) return (ia < 0 ? 1e9 : ia) - (ib < 0 ? 1e9 : ib);
    return eff(b) - eff(a);
  });
}
function depth(L, tid) {
  const d = {}; GRPS.forEach(g => d[g] = []);
  for (const p of roster(L, tid)) if (available(p)) d[p.grp].push(p);
  GRPS.forEach(g => dcOrder(L, tid, g, d[g]));
  return d;
}
function depthChart(L, tid, g) { return dcOrder(L, tid, g, roster(L, tid).filter(p => p.grp === g)); }
function setDepth(L, tid, g, ids) { const t = L.teams[tid]; t.dc = t.dc || {}; t.dc[g] = ids.slice(); }
function moveDepth(L, tid, pid, dir) {
  const p = L.players[pid]; if (!p) return;
  const ids = depthChart(L, tid, p.grp).map(x => x.id), i = ids.indexOf(pid), j = i + dir;
  if (i < 0 || j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]]; setDepth(L, tid, p.grp, ids);
}
function resetDepth(L, tid, g) { const t = L.teams[tid]; if (t.dc) delete t.dc[g]; }
function setStarterQB(L, pid) {
  const ids = depthChart(L, L.user, 'QB').map(x => x.id).filter(id => id !== pid);
  setDepth(L, L.user, 'QB', [pid].concat(ids));
}
function setPlayHurt(L, pid, on) {
  const p = L.players[pid]; if (!p || p.team !== L.user) return 'That player is not on your team.';
  if (on && !canPlayHurt(p)) return p.inj >= 20 ? 'He is out for the season and cannot play.' : 'He is healthy.';
  p.playHurt = !!on;
  // Keep him at his normal spot so he actually starts: freeze the order by healthy rating.
  const t = L.teams[L.user];
  if (on && !(t.dc && t.dc[p.grp])) setDepth(L, L.user, p.grp, roster(L, L.user).filter(x => x.grp === p.grp).sort((a, b) => b.ovr - a.ovr).map(x => x.id));
  return null;
}

function groupCounts(L, tid) { const c = {}; GRPS.forEach(g => c[g] = 0); roster(L, tid).forEach(p => c[p.grp]++); return c; }

function release(L, pid) { const p = L.players[pid]; if (!p) return; const t = L.teams[p.team]; p.team = -1; delete p.con; if (t) addNews(L, `${t.abbr} released ${p.pos} ${p.name}.`); }

function aiCutdowns(L) {
  const max = rules(L.year).rosterMax;
  for (const t of L.teams) {
    if (t.id === L.user) continue;
    cutTo(L, t.id, max, true);
  }
}

function cutTo(L, tid, max, quiet) {
  const r = roster(L, tid);
  if (r.length <= max) return [];
  const counts = groupCounts(L, tid);
  const keep = g => STARTERS[g] + (g === 'K' || g === 'P' ? 0 : 1);
  const order = r.slice().sort((a, b) => value(a) - value(b));
  const cut = [];
  for (const p of order) {
    if (r.length - cut.length <= max) break;
    if (counts[p.grp] <= keep(p.grp)) continue;
    counts[p.grp]--; cut.push(p); p.team = -1; delete p.con;
  }
  if (!quiet && cut.length) addNews(L, `${L.teams[tid].abbr} trimmed ${cut.length} players to reach ${max}.`);
  return cut;
}

function aiSignings(L, offseason) {
  const max = rules(L.year).rosterMax, y = capYear(L), cap = capFor(y);
  const fa = freeAgents(L).filter(p => p.retiredYear == null).sort((a, b) => value(b) - value(a));
  for (const t of R.shuffle(L.teams.slice())) {
    if (t.id === L.user) continue;
    let size = roster(L, t.id).length;
    const counts = groupCounts(L, t.id);
    while (size < max && fa.length) {
      const needG = GRPS.find(g => counts[g] < STARTERS[g] + (g === 'K' || g === 'P' ? 0 : 1));
      let i = needG ? fa.findIndex(p => p.grp === needG) : 0;
      if (i < 0) i = 0;
      const p = fa.splice(i, 1)[0];
      if (p.grp === 'K' || p.grp === 'P') { if (counts[p.grp] >= 1) continue; }
      const sal = marketValue(L, p, y) * (offseason ? 1 : 0.6);
      if (cap != null && payroll(L, t.id, y) + sal > cap) continue;
      p.team = t.id; setContract(p, sal, y, offseason ? contractYears(p) : 1); counts[p.grp]++; size++;
    }
  }
}

function sign(L, pid) { return signFA(L, pid); }

/* ---------- draft picks & trades ---------- */
// Teams own picks for the next 3 drafts that have not been held yet.
function firstPickYear(L) { return L.phase === 'offseason' ? L.year + 2 : L.year + 1; }
function ensurePicks(L) {
  if (!L.picks) L.picks = [];
  if (!L.nextPickId) L.nextPickId = 1;
  const have = new Set(L.picks.map(k => k.y + '|' + k.rnd + '|' + k.orig));
  const y0 = firstPickYear(L);
  for (let y = y0; y < y0 + 3; y++) {
    const rounds = rules(y).draftRounds;
    for (const t of L.teams) for (let r = 1; r <= rounds; r++) {
      if (!have.has(y + '|' + r + '|' + t.id)) L.picks.push({ id: L.nextPickId++, y, rnd: r, orig: t.id, own: t.id });
    }
  }
}
function pickById(L, id) { return (L.picks || []).find(k => k.id === id); }
function teamPicks(L, tid) {
  ensurePicks(L);
  return L.picks.filter(k => k.own === tid).sort((a, b) => a.y - b.y || a.rnd - b.rnd || projectedOverall(L, a) - projectedOverall(L, b));
}

let rankCache = { key: '', cur: null, str: null };
function ranks(L) {
  const key = [L.year, L.phase, L.week, L.draft ? L.draft.pick : '', L.news.length].join('|');
  if (rankCache.key === key && rankCache.L === L) return rankCache;
  const n = L.teams.length, cur = {}, str = {};
  const played = L.teams.some(t => t.w + t.l + t.t > 0);
  if (L.phase === 'season-over' || L.phase === 'draft') draftOrder(L).forEach((tid, i) => cur[tid] = i + 1);
  else if (played) sortTeams(L, L.teams).reverse().forEach((t, i) => cur[t.id] = i + 1);
  L.teams.map(t => [t.id, teamOverall(L, t.id)]).sort((a, b) => a[1] - b[1]).forEach(([tid], i) => str[tid] = i + 1);
  rankCache = { key, L, cur: played || L.phase === 'season-over' || L.phase === 'draft' ? cur : null, str };
  return rankCache;
}
function projectedOverall(L, k) {
  const n = L.teams.length;
  if (L.draft && L.draft.slotPick && k.y === L.draft.year) {
    const i = L.draft.slotPick.indexOf(k.id); if (i >= 0) return i + 1;
  }
  const rk = ranks(L);

function divKey(t) { return t.conf + t.div; }

  T.forEach(a => { cnt[a.id] = 0; home[a.id] = 0; T.forEach(b => { if (a.id < b.id && divKey(a) === divKey(b)) need[key(a.id, b.id)] = 2; }); });

    let games = null;
    for (let attempt = 0; attempt < 60 && !games; attempt++) {
      const pool = R.shuffle(T.filter(t => cnt[t.id] < n).map(t => t.id));
      const used = new Set(), g = [];
      for (const a of pool) {
        if (used.has(a)) continue;
        let best = null, bs = -1e9;
        for (const b of pool) {
          if (b === a || used.has(b)) continue;
          const k = key(a, b);

          if (s > bs) { bs = s; best = b; }
        }
        if (best === null) continue;
        used.add(a); used.add(best); g.push([a, best]);
      }
      if (g.length >= Math.floor(pool.length / 2) - (attempt > 40 ? 1 : 0)) games = g;
    }
    const wk = [];
    for (const [a, b] of games || []) {

  }

  const y = L.year, d = rat.d, pw = PW[coach.off], E = era(y);
  const starters = [];
  GRPS.forEach(g => d[g].slice(0, STARTERS[g]).forEach(p => starters.push(p)));
  starters.forEach(p => stat(p, y, 'g', 1));
  // Yardage and the pass/run mix follow the real league averages for this season.
  const avgTD = E.pts * 0.7 / 7;
  const total = clamp(Math.round(E.tot + (rat.off - oppRat.def) * 4 + (sc.td - avgTD) * 18 + R.norm() * 55), 80, 650);
  const pshare = clamp(E.pshare * (1 + (pw - 1) * 0.7) + R.norm() * 0.06, 0.2, 0.88);
  const py = Math.round(total * pshare), ry = total - py;
  const tdPass = clamp(E.tdPass * pshare / E.pshare, 0.1, 0.92);
  let ptd = 0; for (let i = 0; i < sc.td; i++) if (Math.random() < tdPass) ptd++;
  const rtd = sc.td - ptd;
  const qb = d.QB[0]; let ints = 0;
  if (qb) {
    const att = Math.max(8, Math.round(py / E.ypa + R.int(-3, 4)));
    const cmp = Math.round(att * clamp(E.cmpPct + (qb.ovr - 60) * 0.004 + R.norm() * 0.05, 0.3, 0.8));
    stat(qb, y, 'att', att); stat(qb, y, 'cmp', cmp); stat(qb, y, 'py', py); stat(qb, y, 'ptd', ptd);

}

function creditDefense(L, tid, rat, oppRat, oppQB) {

function injuries(L, rat) {
  GRPS.forEach(g => rat.d[g].slice(0, STARTERS[g]).forEach(p => {
    if (p.inj && p.playHurt && Math.random() < 0.3) {
      p.inj += R.int(1, 2);
      if (p.team === L.user) addNews(L, `${p.pos} ${p.name} aggravated his injury playing hurt. Now out ${p.inj} weeks.`);
    }
  }));
  if (Math.random() < 0.38) {
    const pool = []; ['QB','RB','WR','TE','OL','DL','LB','DB'].forEach(g => rat.d[g].slice(0, STARTERS[g]).forEach(p => pool.push(p)));
    const p = R.pick(pool); if (!p) return;
    p.inj = Math.random() < 0.04 ? 20 : 1 + R.poisson(1.4);

  }
}

function planKey(L) { return L.year + (L.phase === 'playoffs' ? '-p' + L.playoffs.rounds.length : '-w' + L.week); }
function gamePlan(L) { return L.plan && L.plan.key === planKey(L) ? L.plan.c : null; }
function setGamePlan(L, key, val) {

  if (val == null) delete L.plan.c[key]; else L.plan.c[key] = val;
}
function clearGamePlan(L) { L.plan = null; }
function coachFor(L, tid) {
  const c = L.teams[tid].coach;

  const p = gamePlan(L); return p ? Object.assign({}, c, p) : c;
}
function playGame(L, g, opts) {

  const D = diff(L);
  if (D.counter && g.h === L.user) Ac = counterPlan(Ac, Hc);
  if (D.counter && g.a === L.user) Hc = counterPlan(Hc, Ac);
  const hr = ratings(L, g.h, Hc), ar = ratings(L, g.a, Ac);
  const edge = side => side === L.user ? D.edge : 0;
  const hs = genScore(expected(L, hr, ar, Hc, Ac, true, opts.neutral) + edge(g.h), variance(Hc, Ac));
  const as = genScore(expected(L, ar, hr, Ac, Hc, false, opts.neutral) + edge(g.a), variance(Ac, Hc));

  const aBefore = aQB && aQB.hist[L.year] ? (aQB.hist[L.year].int || 0) : 0;

function healWeek(L) { for (const id in L.players) { const p = L.players[id]; if (p.inj > 0) p.inj--; if (!p.inj && p.playHurt) delete p.playHurt; } }

/* ---------- season flow ---------- */
function canStartSeason(L) {
  const n = roster(L, L.user).length, max = rules(L.year).rosterMax;
  if (n > max) return `Your roster has ${n} players. Cut down to ${max} before kickoff.`;
  const c = capFor(L.year);
  if (c != null && payroll(L, L.user, L.year) > c) return `Your payroll is ${money(payroll(L, L.user, L.year))}, over the ${L.year} cap of ${money(c)}. Release or trade players first.`;
  return null;
}

function startRegular(L) {
  const err = canStartSeason(L); if (err) return err;
  aiCutdowns(L); aiSignings(L);
  L.teams.forEach(t => { t.w = t.l = t.t = t.pf = t.pa = 0; });
  makeSchedule(L); L.week = 0; L.phase = 'regular';
  L.offers = [];
  if (Math.random() < 0.5) makeOffers(L, 1, 6);
  return null;
}

function simWeek(L) {
  if (L.phase !== 'regular') return;
  healWeek(L);
  if (L.week < 9 && Math.random() < 0.3) aiTrades(L, 1, 6);
  L.offers = (L.offers || []).filter(o => o.exp > L.week);
  for (const g of L.schedule[L.week]) if (!g.done) playGame(L, g);
  const ug = L.schedule[L.week].find(g => g.h === L.user || g.a === L.user);
  if (ug) {
    const me = ug.h === L.user, my = me ? ug.hs : ug.as, op = me ? ug.as : ug.hs, opp = L.teams[me ? ug.a : ug.h];
    addNews(L, `Week ${L.week + 1}: ${my > op ? 'W' : my < op ? 'L' : 'T'} ${my}-${op} ${me ? 'vs' : 'at'} ${opp.city}${ug.ot ? ' (OT)' : ''}.`);
  }
  L.week++;
  if (L.week < 9 && Math.random() < 0.4) makeOffers(L, 1, 6);
  if (L.week >= L.schedule.length) startPlayoffs(L);
}

function pct(L, t) {
  const g = t.w + t.l + t.t; if (!g) return 0;
  return rules(L.year).tiesCountHalf ? (t.w + 0.5 * t.t) / g : (t.w + t.l ? t.w / (t.w + t.l) : 0.5);
}

function sortTeams(L, list) { return list.slice().sort((a, b) => (pct(L, b) - pct(L, a)) || ((b.pf - b.pa) - (a.pf - a.pa)) || (b.pf - a.pf)); }

function divisions(L) {
  const m = {};
  L.teams.forEach(t => { (m[t.conf + '|' + t.div] = m[t.conf + '|' + t.div] || []).push(t); });
  return m;
}

function seeds(L, conf) {
  const n = rules(L.year).playoffPerConf, divs = divisions(L), winners = [];
  for (const k in divs) if (k.startsWith(conf + '|')) winners.push(sortTeams(L, divs[k])[0]);

  const rest = sortTeams(L, L.teams.filter(t => t.conf === conf && !winners.includes(t)));
  return ws.concat(rest.slice(0, Math.max(0, n - ws.length))).map(t => t.id);

/* ---------- awards ---------- */
const OFFG = ['QB', 'RB', 'WR', 'TE'], DEFG = ['DL', 'LB', 'DB'];
function offScore(h) { return (h.py || 0) * 0.035 + (h.ptd || 0) * 5.5 - (h.int || 0) * 3 + (h.ry || 0) * 0.08 + (h.rtd || 0) * 5 + (h.recy || 0) * 0.08 + (h.rectd || 0) * 5 + (h.rec || 0) * 0.2; }
function defScore(h, p) { return (h.sk || 0) * 4 + (h.dint || 0) * 5 + Math.max(0, p.ovr - 60) * 0.6 + (h.g || 0) * 0.5; }
const fmt = n => Math.round(n).toLocaleString('en-US');
function awardLine(p, h) {
  if (p.grp === 'QB') return `${fmt(h.py || 0)} pass yds, ${h.ptd || 0} TD, ${h.int || 0} INT`;
  if (p.grp === 'RB') return `${fmt(h.ry || 0)} rush yds, ${(h.rtd || 0) + (h.rectd || 0)} TD, ${fmt(h.recy || 0)} rec yds`;
  if (p.grp === 'WR' || p.grp === 'TE') return `${h.rec || 0} rec, ${fmt(h.recy || 0)} yds, ${h.rectd || 0} TD`;
  return `${h.sk || 0} sacks, ${h.dint || 0} INT`;
}
function giveAward(L, key, p, line, tid) {
  const y = L.year; L.awards = L.awards || {}; const A = L.awards[y] || (L.awards[y] = {});
  A[key] = { pid: p.id, tid, name: p.name, pos: p.pos, line };
  (p.awards = p.awards || []).push({ y, a: key });
}
const AWARD_NAMES = { mvp: 'MVP', opoy: 'Offensive Player of the Year', dpoy: 'Defensive Player of the Year', roy: 'Rookie of the Year', sbmvp: 'Super Bowl MVP' };
function seasonAwards(L) {
  const y = L.year, minG = Math.ceil(rules(y).games / 2), cand = [];
  for (const id in L.players) {
    const p = L.players[id], h = p.hist[y];
    if (!h || (h.g || 0) < minG || h.tm == null) continue;
    const t = L.teams[h.tm], wp = pct(L, t);
    const off = OFFG.includes(p.grp) ? offScore(h) : 0, def = DEFG.includes(p.grp) ? defScore(h, p) : 0;
    cand.push({ p, h, off, def, wp, rookie: (p.yrs || 0) === 0 });
  }
  const best = f => cand.slice().sort((a, b) => f(b) - f(a))[0];
  const mvp = best(c => c.off ? c.off + c.wp * 60 : c.def * 1.6 + c.wp * 60);
  const opoy = best(c => c.off);
  const dpoy = best(c => c.def);
  const roy = best(c => c.rookie ? Math.max(c.off, c.def * 2.2) : -1);
  const out = [];
  for (const [k, c] of [['mvp', mvp], ['opoy', opoy], ['dpoy', dpoy], ['roy', roy]]) {
    if (!c || (k === 'roy' && !c.rookie)) continue;
    giveAward(L, k, c.p, awardLine(c.p, c.h), c.h.tm);
    out.push(`${AWARD_NAMES[k]}: ${c.p.pos} ${c.p.name}, ${L.teams[c.h.tm].abbr}`);
  }
  if (out.length) addNews(L, `${y} awards. ` + out.join(' · ') + '.');
}
function superBowlMVP(L, w, pts) {
  const d = depth(L, w), pool = [];
  const add = (p, wgt) => { if (p) pool.push([p, wgt]); };
  add(d.QB[0], 45); add(d.RB[0], 15); add(d.WR[0], 15);
  add(d.DL.slice().sort((a, b) => b.ovr - a.ovr)[0], 10); add(d.LB[0], 5); add(d.DB.slice().sort((a, b) => b.ovr - a.ovr)[0], 10);
  const tot = pool.reduce((s, x) => s + x[1], 0); let r = Math.random() * tot, p = pool[0][0];
  for (const [pl, wgt] of pool) { r -= wgt; if (r <= 0) { p = pl; break; } }
  const tds = Math.max(1, Math.floor(pts / 7));
  let line;
  if (p.grp === 'QB') { const att = R.int(18, 30); line = `${Math.round(att * (0.55 + Math.random() * 0.2))}/${att}, ${R.int(160, 290)} yds, ${R.int(1, Math.min(3, tds))} TD`; }
  else if (p.grp === 'RB') line = `${R.int(18, 30)} carries, ${R.int(85, 165)} yds, ${R.int(1, Math.min(2, tds))} TD`;
  else if (p.grp === 'WR' || p.grp === 'TE') line = `${R.int(4, 8)} rec, ${R.int(90, 170)} yds, ${R.int(1, Math.min(2, tds))} TD`;
  else line = Math.random() < 0.5 ? `${R.int(2, 3)} sacks, forced fumble` : `${R.int(2, 3)} INT`;
  giveAward(L, 'sbmvp', p, line, w);

function startPlayoffs(L) {
  seasonAwards(L);
  L.phase = 'playoffs';
  L.offers = [];
  const s = { AFC: seeds(L, 'AFC'), NFC: seeds(L, 'NFC') };
  L.playoffs = { seeds: s, alive: { AFC: s.AFC.slice(), NFC: s.NFC.slice() }, rounds: [], champ: null };
  const inIt = s.AFC.concat(s.NFC).includes(L.user);
  addNews(L, inIt ? `${L.teams[L.user].city} clinched a playoff spot!` : `${L.teams[L.user].city} missed the playoffs at ${L.teams[L.user].w}-${L.teams[L.user].l}${L.teams[L.user].t ? '-' + L.teams[L.user].t : ''}.`);
}

function prevPow2(n) { let p = 1; while (p * 2 <= n) p *= 2; return p; }

function roundName(L) {
  const a = L.playoffs.alive.AFC.length;
  if (a === 1) return 'Super Bowl';
  if (a === 2) return 'Conference Championships';
  if (a <= 4 && (a & (a - 1)) === 0) return 'Divisional Round';
  return 'Wild Card Round';
}

function playoffPairs(L) {
  const P = L.playoffs; if (!P) return [];
  if (roundName(L) === 'Super Bowl') { const a = P.alive.AFC[0], n = P.alive.NFC[0]; return [L.year % 2 ? [n, a] : [a, n]]; }
  const out = [];
  for (const c of ['AFC', 'NFC']) {
    const alive = P.alive[c].slice().sort((x, y) => P.seeds[c].indexOf(x) - P.seeds[c].indexOf(y));
    const n = alive.length, p2 = prevPow2(n);
    const playing = n === p2 ? alive : alive.slice(n - 2 * (n - p2));
    for (let i = 0; i < playing.length / 2; i++) out.push([playing[i], playing[playing.length - 1 - i]]);
  }
  return out;
}
function nextGame(L) {
  if (L.phase === 'regular') { const g = L.schedule[L.week] && L.schedule[L.week].find(x => x.h === L.user || x.a === L.user); return g ? { h: g.h, a: g.a } : null; }
  if (L.phase === 'playoffs') { const pr = playoffPairs(L).find(x => x.includes(L.user)); return pr ? { h: pr[0], a: pr[1], neutral: roundName(L) === 'Super Bowl' } : null; }
  return null;
}
function simPlayoffRound(L) {
  if (L.phase !== 'playoffs') return;
  const P = L.playoffs, name = roundName(L), games = [];
  healWeek(L);
  if (name === 'Super Bowl') {
    const a = P.alive.AFC[0], n = P.alive.NFC[0];
    const g = playGame(L, { h: L.year % 2 ? n : a, a: L.year % 2 ? a : n }, { playoff: true, neutral: true, noStats: true });
    const w = g.hs > g.as ? g.h : g.a; games.push(g);
    P.champ = w; L.champs.unshift({ y: L.year, champ: w, sb: L.year - 1965, score: Math.max(g.hs, g.as) + '-' + Math.min(g.hs, g.as), loser: w === g.h ? g.a : g.h });
    addNews(L, `Super Bowl ${roman(L.year - 1965)}: ${L.teams[w].city} ${L.teams[w].name} win ${Math.max(g.hs, g.as)}-${Math.min(g.hs, g.as)}.`);
    superBowlMVP(L, w, Math.max(g.hs, g.as));
    P.rounds.push({ name, games });
    finishSeason(L);
    return;
  }
  for (const c of ['AFC', 'NFC']) {
    const alive = P.alive[c].slice().sort((x, y) => P.seeds[c].indexOf(x) - P.seeds[c].indexOf(y));
    const n = alive.length, p2 = prevPow2(n);
    let playing;
    if (n === p2) playing = alive;
    else { const k = n - p2; playing = alive.slice(n - 2 * k); }
    const losers = [];
    for (let i = 0; i < playing.length / 2; i++) {
      const hi = playing[i], lo = playing[playing.length - 1 - i];
      const g = playGame(L, { h: hi, a: lo }, { playoff: true, noStats: true });
      games.push(g); losers.push(g.hs > g.as ? lo : hi);
    }
    P.alive[c] = alive.filter(t => !losers.includes(t));
  }
  P.rounds.push({ name, games });
  const mine = games.find(g => g.h === L.user || g.a === L.user);
  if (mine) {
    const won = (mine.h === L.user) === (mine.hs > mine.as);
    addNews(L, `${name}: ${L.teams[L.user].city} ${won ? 'advance' : 'are eliminated'}, ${Math.max(mine.hs, mine.as)}-${Math.min(mine.hs, mine.as)}.`);
  }
}

function roman(n) { const m = [[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; }

function finishSeason(L) {
  const P = L.playoffs;
  for (const t of L.teams) {
    let res = 'Missed playoffs';
    const conf = P.seeds[t.conf];
    if (conf.includes(t.id)) {
      res = 'Lost in playoffs';
      if (P.champ === t.id) res = 'Won Super Bowl';
      else if (L.champs[0].loser === t.id) res = 'Lost Super Bowl';
    }
    t.hist.push({ y: L.year, w: t.w, l: t.l, t: t.t, pf: t.pf, pa: t.pa, res });
  }
  L.phase = 'season-over';
}

/* ---------- draft ---------- */
function draftOrder(L) {
  const P = L.playoffs, all = P.seeds.AFC.concat(P.seeds.NFC);
  // elimination round index: higher = went further
  const went = {}; all.forEach(t => went[t] = 0);
  P.rounds.forEach((r, i) => r.games.forEach(g => { went[g.h] = Math.max(went[g.h], i + 1); went[g.a] = Math.max(went[g.a], i + 1); }));
  if (P.champ != null) went[P.champ] += 1;
  const non = sortTeams(L, L.teams.filter(t => !all.includes(t.id))).reverse();
  const po = L.teams.filter(t => all.includes(t.id)).sort((a, b) => (went[a.id] - went[b.id]) || (pct(L, a) - pct(L, b)));
  return non.concat(po).map(t => t.id);
}

function startDraft(L, imports) {

  const target = rounds * order.length + 30;
  let genCount = 0;
  while (pool.length < target) { pool.push(genProspect(L, dy).id); genCount++; }
  ensurePicks(L);
  const slotPick = [];

/* ---------- Game plan ---------- */
const OFF = { run: 'Ground game', bal: 'Balanced', pass: 'Air it out' };
const DEF = { soft: 'Bend, don\'t break', bal: 'Base 4-3', blitz: 'Blitz' };
function bestDefVs(off) { return Object.keys(DEF).sort((a, b) => G.DEF_VS[a][off] - G.DEF_VS[b][off])[0]; }
function bestOffVs(def) { const v = G.DEF_VS[def]; const best = Object.keys(OFF).sort((a, b) => v[b] - v[a])[0]; return v[best] > 0 ? best : null; }
function planCard() {
  const g = G.nextGame(L); if (!g) return '';

  const segRow = (key, map) => `<div class="seg">${chip(key, '', 'Season')}${Object.keys(map).map(k => chip(key, k, map[k])).join('')}</div>`;

  const qbOpt = qbs.map(p => `<option value="${p.id}"${startQB && p.id === startQB.id ? ' selected' : ''}${p.inj && !(p.playHurt && G.canPlayHurt(p)) ? ' disabled' : ''}>${esc(p.name)} · ${G.eff(p)} OVR${p.inj ? (p.playHurt ? ' · playing hurt' : ' · injured') : ''}</option>`).join('');

  return `<section class="card"><h3>Game plan vs ${esc(o.city)}</h3>

    <p class="small">Counters: ${G.DEF_VS[dHint][oc.off] < 0 ? `a <b>${esc(DEF[dHint])}</b> defense slows their offense` : `a <b>${esc(DEF[dHint])}</b> defense is the safe call, since blitzing or sitting back gets run on`}${oHint ? `, and a <b>${esc(OFF[oHint])}</b> attack exploits their defense` : '. Their base defense has no scheme weakness, so lean on your best unit'}.</p>

}

  h += `<section class="card"><div class="split"><h3>Draft board</h3><span class="small">${all.length} prospects</span></div>${chipRow}<div class="list">${pool.length ? pool.map(p => `

  });
  const ufa = F.era === 'ufa';
  if (ufa) h += marketHeader(F);

  if (!(ufa && F.round > 0)) h += exp.length ? `<div class="list">${exp.map(p => {

    const btns = `<button class="btn sm primary" data-act="resign" data-id="${p.id}">${rfa ? 'Tender' : 'Re-sign'} ${G.money(price)}</button>${F.era === 'ufa' && !F.tagged && !rfa ? `<button class="btn sm" data-act="tag" data-id="${p.id}">Tag</button>` : ''}<button class="btn sm" data-act="letGo" data-id="${p.id}">Let go</button>`;
    return prow(p, (rfa ? 'Restricted' : (ufa ? 'Unrestricted · market value ' + G.money(G.marketValue(L, p)) : 'Asking ' + G.money(price))) + why, btns);

  if (F.era === 'planb') {
    const pr = F.protect, mine = G.roster(L, L.user).slice().sort((a, b) => b.ovr - a.ovr);
    h += `<h3 class="sub">Plan B protection (${pr.length} / 37)</h3><p class="small">Unprotected players worth keeping may sign elsewhere when the season starts.</p><div class="tlist protect">${mine.map(p => `<button class="tp ${pr.includes(p.id) ? 'on' : ''}" data-act="protect" data-id="${p.id}"><span class="pos">${esc(p.pos)}</span><span class="tp-n">${esc(p.name)}</span><span class="tp-a">${p.age}</span>${rating(p.ovr)}</button>`).join('')}</div>`;
    const pool = G.planBPool(L).sort((a, b) => b.ovr - a.ovr).slice(0, 30);
    h += `<h3 class="sub">Plan B market</h3><p class="small">Other teams' unprotected players. Sign them with no compensation.</p><div class="list">${pool.map(p => prow(p, esc(L.teams[p.team].abbr), `<button class="btn sm" data-act="sign" data-id="${p.id}">Sign ${G.money(G.askPrice(L, p))}</button>`)).join('')}</div>`;
  }
  if (F.era === 'comp' || F.era === 'planb') {
    const tg = G.sheetTargets(L).filter(p => !F.done[p.id]).sort((a, b) => b.ovr - a.ovr).slice(0, 15);
    if (tg.length) h += `<h3 class="sub">Offer sheet targets</h3><p class="small">Unsigned players on other teams. If his team doesn't match, he's yours and you give up the draft picks shown.</p><div class="list">${tg.map(p => { const sal = Math.round(G.askPrice(L, p) * 1.2); return prow(p, esc(L.teams[p.team].abbr) + ' · costs ' + G.compPicks(L, sal).map(r => 'R' + r).join('+'), `<button class="btn sm" data-act="sheet" data-id="${p.id}">Offer ${G.money(sal)}</button>`); }).join('')}</div>`;
  }
  return h + '</section>';
}

function reasonsText(rs) {
  if (!rs || !rs.length) return '';
  return '<br>' + rs.map(([s, t]) => `<span class="${s === '+' ? 'good' : 'bad'}">${s === '+' ? '▲' : '▼'} ${esc(t)}</span>`).join(' · ');
}
function marketHeader(F) {
  const done = F.round > G.FA_ROUNDS;

  const btn = done ? '' : `<button class="btn primary" data-act="advanceFA">${F.round === 0 ? 'Start free agency (resolve round 1)' : `Resolve round ${F.round + 1}`}</button>`;
  const mine = (F.last || []).filter(x => x.tid === L.user);
  const lost = (F.last || []).filter(x => x.tid !== L.user && x.bidders.includes(L.user));

    ${F.last ? `<p class="small">Last round: ${F.last.length} players signed. ${mine.length ? `<span class="good">You signed ${mine.map(x => esc(L.players[x.pid].name)).join(', ')}.</span>` : ''} ${lost.length ? `<span class="bad">You lost ${lost.map(x => esc(L.players[x.pid].name) + ' to ' + esc(L.teams[x.tid].abbr)).join(', ')}.</span>` : ''}</p>` : ''}
    <p class="small">Each round, every free agent picks the best offer: money and years, plus team record, scheme fit, playing time, and loyalty. Anyone who doesn't sign lowers his price for the next round. After round ${G.FA_ROUNDS}, leftovers sign cheaply with whoever has room.</p>
    <div class="row">${btn}</div></div>`;
}
function marketList(F) {
  if (F.round > G.FA_ROUNDS) return '';
  const grp = ui.faGrp || 'ALL';
  const list = G.freeAgents(L).filter(p => p.retiredYear == null && (grp === 'ALL' || p.grp === grp)).sort((a, b) => b.ovr - a.ovr).slice(0, ui.mktShow || 30);
  const rows = list.map(p => {
    const b = F.bids && F.bids[p.id], ask = G.baseAsk(L, p), o = b ? G.bidOutlook(L, p.id) : null;
    const fit = G.fitFor(L, p, L.user);
    const bidUI = b ? `<div class="bid"><span>Your bid <b>${G.money(b.sal)}</b> × <b>${b.yrs}</b> yr${b.yrs > 1 ? 's' : ''}</span>
        <span class="bidctl"><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal-">−$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal+">+$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs-">−yr</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs+">+yr</button><button class="btn sm" data-act="bid" data-id="${p.id}" data-key="x">Withdraw</button></span>
        <span class="small ${o && o.label.startsWith('Below') ? 'bad' : 'good'}">${o ? esc(o.label) + ` · ${o.teams ? `about ${o.teams} other team${o.teams === 1 ? '' : 's'} likely to bid` : 'no other teams likely to bid'}` : ''}</span></div>`
      : `<button class="btn sm primary" data-act="bid" data-id="${p.id}" data-key="new">Bid ${G.money(ask)}</button>`;
    return `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Age ${p.age + 1} · ${p.prevTeam != null && L.teams[p.prevTeam] ? 'was ' + esc(L.teams[p.prevTeam].abbr) + ' · ' : ''}asking ${G.money(ask)}${reasonsText(fit.reasons)}</div></div>
      <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></div><div class="pl-btns">${bidUI}</div></div>`;
  }).join('');
  return `<h3 class="sub">Free agent market</h3>${chips('faGrp', grp)}<div class="list">${rows || '<p class="small">No free agents at this position.</p>'}</div>
    <div class="row"><button class="btn" data-act="mktMore">Show more</button></div>`;
}
function extCard() {
  const el = G.roster(L, L.user).map(p => [p, G.extInfo(L, p)]).filter(x => x[1]).sort((a, b) => b[0].ovr - a[0].ovr);
  if (!el.length) return '';
  return `<section class="card"><h3>Extensions</h3><p class="small">These players are in the last year of their deals. Extend them now, or they reach free agency after the season. Their price depends on how they feel about your team.</p>
    <div class="list">${el.map(([p, x]) => `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${esc(p.name)}<div class="pl-sub">Age ${p.age} · now ${G.money(p.con.sal)} · market ${G.money(G.marketValue(L, p, x.from))}${reasonsText(x.fit.reasons)}</div></div>
      <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></div>
      <div class="pl-btns"><button class="btn sm primary" data-act="extend" data-id="${p.id}">Extend ${x.yrs} yr${x.yrs > 1 ? 's' : ''} at ${G.money(x.sal)}</button></div></div>`).join('')}</div></section>`;
}

/* ---------- Sorting ---------- */
// POT means what you can see: true potential once known, otherwise the scout grade.
function cmp(key) {
  return key === 'pot'
    ? (a, b) => G.shownPot(L, b) - G.shownPot(L, a) || b.ovr - a.ovr
    : (a, b) => b.ovr - a.ovr || G.shownPot(L, b) - G.shownPot(L, a);
}
function sortSeg(stateKey) {
  const cur = ui[stateKey] || 'ovr';
  return `<div class="sortrow"><span class="lbl">SORT</span><div class="seg mini">${[['ovr', 'Overall'], ['pot', 'Potential / Scout']].map(([k, n]) => `<button class="${cur === k ? 'on' : ''}" data-act="sort" data-key="${stateKey}" data-id="${k}">${n}</button>`).join('')}</div></div>`;
}

/* ---------- Roster ---------- */
function chips(key, cur) {
  return `<div class="chips">${['ALL'].concat(G.GRPS).map(g => `<button class="chip ${cur === g ? 'on' : ''}" data-act="chip" data-key="${key}" data-id="${g}">${g === 'ALL' ? 'All' : g}</button>`).join('')}</div>`;
}
function vRoster() {
  const max = G.rules(L.year).rosterMax, all = G.roster(L, L.user), d = G.depth(L, L.user);
  const starterIds = new Set(); G.GRPS.forEach(g => d[g].slice(0, G.STARTERS[g]).forEach(p => starterIds.add(p.id)));
  const rc = cmp(ui.rSort), list = all.filter(p => ui.grp === 'ALL' || p.grp === ui.grp).sort((a, b) => G.GRPS.indexOf(a.grp) - G.GRPS.indexOf(b.grp) || rc(a, b));
  return `<section class="card"><div class="split"><h3>${esc(me().name)} roster</h3><span class="count ${all.length > max ? 'bad' : ''}">${all.length} / ${max}</span></div>
    <p class="small">Green positions are starters, set on the Coach tab's depth chart. Tap a player for options.</p>${chips('grp', ui.grp)}${sortSeg('rSort')}
    <div class="list">${list.map(p => `<div class="pl ${ui.open === p.id ? 'open' : ''}">
      <button class="pl-main" data-act="open" data-id="${p.id}"><span class="pos ${starterIds.has(p.id) ? 'st' : ''}">${esc(p.pos)}</span>
      <div class="pl-name">${esc(p.name)}${p.inj ? `<span class="inj">INJ ${p.inj >= 20 ? 'season' : p.inj + 'w'}</span>` : ''}<div class="pl-sub">Age ${p.age} · ${p.yrs ? p.yrs + ' yr' + (p.yrs > 1 ? 's' : '') : 'Rookie'} · ${conText(p)}${statLine(p) ? ' · ' + statLine(p) : ''}</div></div>
      <div class="pl-r"><span class="lbl">OVR</span>${rating(p.ovr)}</div><div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SCOUT'}</span>${rating(G.shownPot(L, p))}</div></button>
      ${ui.open === p.id ? `<div class="pl-act">${p.college ? `<span class="small">${esc(p.college)}${p.draft ? ` · drafted ${p.draft.year} R${p.draft.rnd}` : ''}</span>` : ''}${G.extInfo(L, p) ? `<button class="btn sm primary" data-act="extend" data-id="${p.id}">Extend ${G.money(G.extInfo(L, p).sal)}</button>` : ''}${G.canPlayHurt(p) ? `<button class="btn sm" data-act="hurt" data-id="${p.id}">${p.playHurt ? 'Rest him' : 'Play through injury'}</button>` : ''}${confirmBtn('rel' + p.id, 'Release')}<button class="btn sm" data-act="shop" data-id="${p.id}">Offer in trade</button></div>` : ''}
    </div>`).join('')}</div></section>`;
}

/* ---------- Stats ---------- */
const n0 = v => v || 0;
const num = v => Math.round(n0(v)).toLocaleString('en-US');
const avg = (a, b, d) => b ? (a / b).toFixed(d == null ? 1 : d) : '–';
function table(cols, rows, opts) {
  opts = opts || {};
  if (!rows.length) return `<p class="small">${opts.empty || 'No stats yet.'}</p>`;
  const head = cols.map((c, i) => `<th class="${i ? '' : 'l'}">${opts.sortKey ? `<button class="th" data-act="tsSort" data-id="${c.k || ''}">${c.h}${opts.sortKey === c.k ? ' ▾' : ''}</button>` : c.h}</th>`).join('');
  const body = rows.map(r => `<tr class="${r.me ? 'me' : ''}">${cols.map((c, i) => `<td class="${i ? '' : 'l'}">${c.f(r)}</td>`).join('')}</tr>`).join('');
  return `<div class="tscroll"><table class="tbl stat"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function statYears() {
  const ys = new Set(Object.keys(L.tstats || {}).map(Number));
  for (const p of G.allPlayers(L)) { if (p.team === L.user || Object.values(p.hist).some(h => h.tm === L.user)) Object.keys(p.hist).forEach(y => ys.add(+y)); }
  return [...ys].sort((a, b) => b - a);
}
function teamRecord(t, y) {
  if (y === L.year && L.phase !== 'preseason') return { w: t.w, l: t.l, t: t.t, pf: t.pf, pa: t.pa };
  return t.hist.find(s => s.y === y) || null;
}
function sumHist(p) { const s = { seasons: 0 }; for (const y in p.hist) { s.seasons++; for (const k in p.hist[y]) if (k !== 'tm') s[k] = n0(s[k]) + p.hist[y][k]; } return s; }
function playerTables(rows, career) {
  const nm = r => `<button class="lnk" data-act="statPlayer" data-id="${r.p.id}">${esc(r.p.name)}</button>${career ? '' : ''}`;
  const first = { h: 'Player', f: nm };
  const yrs = career ? [{ h: 'Yrs', f: r => r.s.seasons }] : [];
  const out = [];
  const pass = rows.filter(r => n0(r.s.att) > 0).sort((a, b) => n0(b.s.py) - n0(a.s.py));
  out.push(['Passing', table([first, ...yrs, { h: 'G', f: r => n0(r.s.g) }, { h: 'Cmp', f: r => num(r.s.cmp) }, { h: 'Att', f: r => num(r.s.att) }, { h: 'Pct', f: r => avg(n0(r.s.cmp) * 100, r.s.att) }, { h: 'Yds', f: r => num(r.s.py) }, { h: 'TD', f: r => n0(r.s.ptd) }, { h: 'INT', f: r => n0(r.s.int) }, { h: 'Y/A', f: r => avg(r.s.py, r.s.att) }], pass)]);
  const rush = rows.filter(r => n0(r.s.ra) > 0).sort((a, b) => n0(b.s.ry) - n0(a.s.ry));
  out.push(['Rushing', table([first, ...yrs, { h: 'G', f: r => n0(r.s.g) }, { h: 'Att', f: r => num(r.s.ra) }, { h: 'Yds', f: r => num(r.s.ry) }, { h: 'Avg', f: r => avg(r.s.ry, r.s.ra) }, { h: 'TD', f: r => n0(r.s.rtd) }], rush)]);
  const recv = rows.filter(r => n0(r.s.rec) > 0 || n0(r.s.recy) > 0).sort((a, b) => n0(b.s.recy) - n0(a.s.recy));
  out.push(['Receiving', table([first, ...yrs, { h: 'G', f: r => n0(r.s.g) }, { h: 'Rec', f: r => num(r.s.rec) }, { h: 'Yds', f: r => num(r.s.recy) }, { h: 'Avg', f: r => avg(r.s.recy, r.s.rec) }, { h: 'TD', f: r => n0(r.s.rectd) }], recv)]);
  const def = rows.filter(r => ['DL', 'LB', 'DB'].includes(r.p.grp) && n0(r.s.g) > 0).sort((a, b) => (n0(b.s.sk) * 2 + n0(b.s.dint) * 3) - (n0(a.s.sk) * 2 + n0(a.s.dint) * 3) || n0(b.s.g) - n0(a.s.g));
  out.push(['Defense', table([first, ...yrs, { h: 'Pos', f: r => esc(r.p.pos) }, { h: 'G', f: r => n0(r.s.g) }, { h: 'Sacks', f: r => n0(r.s.sk) }, { h: 'INT', f: r => n0(r.s.dint) }], def)]);
  const kick = rows.filter(r => n0(r.s.fgm) > 0).sort((a, b) => n0(b.s.fgm) - n0(a.s.fgm));
  out.push(['Kicking', table([first, ...yrs, { h: 'G', f: r => n0(r.s.g) }, { h: 'FG made', f: r => n0(r.s.fgm) }], kick)]);
  return out.map(([t, tb]) => `<section class="card"><h3>${t}</h3>${tb}</section>`).join('');
}
function playerCard(p) {
  const ys = Object.keys(p.hist).map(Number).sort((a, b) => a - b);
  const rows = ys.map(y => ({ y, s: p.hist[y], me: p.hist[y].tm === L.user }));
  const tm = r => r.s.tm != null ? esc(L.teams[r.s.tm].abbr) : '–';
  let cols = [{ h: 'Year', f: r => r.y }, { h: 'Tm', f: tm }, { h: 'G', f: r => n0(r.s.g) }];
  if (p.grp === 'QB') cols = cols.concat([{ h: 'Cmp', f: r => num(r.s.cmp) }, { h: 'Att', f: r => num(r.s.att) }, { h: 'Yds', f: r => num(r.s.py) }, { h: 'TD', f: r => n0(r.s.ptd) }, { h: 'INT', f: r => n0(r.s.int) }, { h: 'Rush', f: r => num(r.s.ry) }]);
  else if (p.grp === 'RB') cols = cols.concat([{ h: 'Att', f: r => num(r.s.ra) }, { h: 'Rush', f: r => num(r.s.ry) }, { h: 'TD', f: r => n0(r.s.rtd) }, { h: 'Rec', f: r => num(r.s.rec) }, { h: 'RecYds', f: r => num(r.s.recy) }, { h: 'RecTD', f: r => n0(r.s.rectd) }]);
  else if (p.grp === 'WR' || p.grp === 'TE') cols = cols.concat([{ h: 'Rec', f: r => num(r.s.rec) }, { h: 'Yds', f: r => num(r.s.recy) }, { h: 'TD', f: r => n0(r.s.rectd) }]);
  else if (p.grp === 'K') cols = cols.concat([{ h: 'FG', f: r => n0(r.s.fgm) }]);
  else cols = cols.concat([{ h: 'Sacks', f: r => n0(r.s.sk) }, { h: 'INT', f: r => n0(r.s.dint) }]);
  const tot = sumHist(p);
  const totRow = { y: 'Career', s: Object.assign({}, tot, { tm: null, g: tot.g }) };
  const aw = (p.awards || []).map(a => `<span class="award">${a.y} ${esc(G.AWARD_NAMES[a.a])}</span>`).join('');
  return `<section class="card hero"><div class="split"><div><div class="eyebrow">${esc(p.pos)} · age ${p.age} · ${p.team >= 0 ? esc(tname(L.teams[p.team])) : (p.team === -2 ? 'Retired' : 'Free agent')}</div><h2>${esc(p.name)}</h2></div><button class="btn sm" data-act="statPlayer" data-id="">Close</button></div>
    ${aw ? `<div class="awards">${aw}</div>` : ''}
    ${ys.length ? table(cols, rows.concat([totRow])) : '<p class="small">No NFL stats in this league yet. Stats before 1970 are not imported.</p>'}</section>`;
}
function vStats() {
  const seg = [['team', 'Teams'], ['season', 'My players'], ['career', 'Careers'], ['awards', 'Awards']], mode = ui.st || 'team';
  let h = `<div class="seg">${seg.map(([k, n]) => `<button class="${mode === k ? 'on' : ''}" data-act="st" data-id="${k}">${n}</button>`).join('')}</div>`;
  if (ui.statPid && G.getP(L, ui.statPid)) h += playerCard(G.getP(L, ui.statPid));
  const years = statYears();
  const y = years.includes(ui.stYear) ? ui.stYear : (years[0] || L.year);
  const yearChips = years.length > 1 ? `<div class="chips">${years.map(v => `<button class="chip ${v === y ? 'on' : ''}" data-act="stYear" data-id="${v}">${v}</button>`).join('')}</div>` : '';
  if (mode === 'team') {
    const Y = (L.tstats || {})[y] || {};
    const rows = L.teams.map(t => { const T = Y[t.id], r = teamRecord(t, y); return T && r ? { t, T, r, me: t.id === L.user } : null; }).filter(Boolean);
    const pg = (v, g) => g ? (v / g).toFixed(1) : '–';
    const cols = [
      { h: 'Team', k: '', f: x => esc(x.t.abbr), v: x => x.t.abbr },
      { h: 'W-L-T', k: 'w', f: x => `${x.r.w}-${x.r.l}-${x.r.t}`, v: x => x.r.w + x.r.t / 2 },
      { h: 'PF', k: 'pf', f: x => x.r.pf, v: x => x.r.pf },
      { h: 'PA', k: 'pa', f: x => x.r.pa, v: x => -x.r.pa },
      { h: 'Yds/G', k: 'yds', f: x => pg(x.T.yds, x.T.g), v: x => x.T.yds / x.T.g },
      { h: 'Pass/G', k: 'py', f: x => pg(x.T.py, x.T.g), v: x => x.T.py / x.T.g },
      { h: 'Rush/G', k: 'ry', f: x => pg(x.T.ry, x.T.g), v: x => x.T.ry / x.T.g },
      { h: 'Allow/G', k: 'ydsA', f: x => pg(x.T.ydsA, x.T.g), v: x => -x.T.ydsA / x.T.g },
      { h: 'Sacks', k: 'sk', f: x => x.T.sk, v: x => x.T.sk },
      { h: 'Take', k: 'take', f: x => x.T.take, v: x => x.T.take },
      { h: 'Give', k: 'giv', f: x => x.T.giv, v: x => -x.T.giv }
    ];
    const sk = ui.tsSort || 'w', col = cols.find(c => c.k === sk) || cols[1];
    rows.sort((a, b) => col.v(b) - col.v(a));
    h += yearChips + `<section class="card"><h3>${y} team stats</h3><p class="small">Tap a column to sort. Allowed yards, points against, and giveaways sort best-first.</p>${table(cols, rows, { sortKey: sk, empty: 'No games played yet this season.' })}</section>`;
  }
  if (mode === 'season') {
    const rows = []; for (const p of G.allPlayers(L)) { const s = p.hist[y]; if (s && s.tm === L.user) rows.push({ p, s, me: false }); }
    h += yearChips + `<p class="small">${y} regular season, players who played for the ${esc(me().name)}. Tap a name for his career.</p>` + playerTables(rows, false);
  }
  if (mode === 'career') {
    const rows = G.roster(L, L.user).map(p => ({ p, s: sumHist(p), me: false })).filter(r => r.s.seasons > 0);
    h += `<p class="small">Career totals for your current roster, counting only seasons played in this league. Tap a name for year-by-year stats.</p>` + playerTables(rows, true);
  }
  if (mode === 'awards') {
    const A = L.awards || {}, ys = Object.keys(A).map(Number).sort((a, b) => b - a);
    h += `<section class="card"><h3>Awards</h3><p class="small">Regular-season awards are given when the regular season ends. Super Bowl MVP is named after the Super Bowl.</p>${ys.length ? ys.map(yy => `<div class="aw-year"><div class="eyebrow">${yy}</div>${['mvp', 'opoy', 'dpoy', 'roy', 'sbmvp'].filter(k => A[yy][k]).map(k => { const a = A[yy][k]; return `<div class="aw ${a.tid === L.user ? 'mine' : ''}"><span class="aw-k">${esc(G.AWARD_NAMES[k])}</span><span class="aw-p"><button class="lnk" data-act="statPlayer" data-id="${a.pid}">${esc(a.pos)} ${esc(a.name)}</button>, ${esc(L.teams[a.tid].abbr)}</span><span class="small">${esc(a.line)}</span></div>`; }).join('')}</div>`).join('') : '<p>No awards yet. The first ones are given when the regular season ends.</p>'}</section>`;
  }
  return h;
}

/* ---------- actions ---------- */
function importText(text, kind, key) {
  const res = G.parsePFR(text);
  if (kind && res.kind !== kind) throw new Error(`That looks like a ${res.kind} table, not a ${kind} table.`);
  if (res.kind === 'roster') { IM.rosters[key] = res.rows; return `Imported ${res.rows.length} players for ${key}.`; }
  IM.drafts[key] = res.rows; return `Imported ${res.rows.length} prospects for the ${key} draft.`;
}

async function onFiles(files) {
  const out = [];
  for (const f of files) {
    const text = await f.text(), base = f.name.toLowerCase().replace(/\.[a-z]+$/, '');
    try {
      const res = G.parsePFR(text);
      if (res.kind === 'roster') {
        const code = G.TEAMS_1970.find(t => base.includes(t[0]));
        if (!code) { out.push(`${f.name}: name it with the team code, like nor.csv.`); continue; }
        IM.rosters[code[0]] = res.rows; out.push(`${code[0]} ✓`);
      } else {
        const y = (base.match(/(19|20)\d\d/) || [])[0];
        if (!y) { out.push(`${f.name}: include the year in the name, like draft1971.csv.`); continue; }
        IM.drafts[+y] = res.rows; out.push(`draft ${y} ✓`);
      }
    } catch (e) { out.push(`${f.name}: ${e.message}`); }
  }
  flash(out.join(' · ')); save(); render();
}

function act(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case 'tab': ui.tab = id; ui.open = null; window.scrollTo(0, 0); break;
    case 'confirm':
      if (ui.confirm !== id) { ui.confirm = id; render(); return; }
      ui.confirm = null;
      if (id === 'reset') { L = null; DB.set('league', null); ui.tab = 'home'; flash('League deleted. Your imported data is still here.'); }
      else if (id.startsWith('rel')) { G.release(L, +id.slice(3)); ui.open = null; flash('Player released to the waiver pool.'); }
      break;
    case 'newDiff': ui.newDiff = id; break;
    case 'setDiff': G.setDifficulty(L, id); flash(`Difficulty is now ${G.DIFF[id].name}.`); break;
    case 'newLeague': L = G.newLeague(IM, $('#pickTeam').value, { diff: ui.newDiff || 'pro' }); ui.tab = 'home'; flash(`Welcome to ${tname(me())}.`); break;
    case 'autocut': G.cutTo(L, L.user, G.rules(L.year).rosterMax); break;
    case 'startSeason': { const e = G.startRegular(L); if (e) flash(e); break; }
    case 'simWeek': G.simWeek(L); break;
    case 'simSeason': while (L.phase === 'regular') G.simWeek(L); break;
    case 'simRound': G.simPlayoffRound(L); break;
    case 'startDraft': G.startDraft(L, IM); ui.draftGrp = 'ALL'; ui.draftShow = 60; break;
    case 'beginDraft': G.beginDraft(L); break;
    case 'scout': { const e = G.scoutPlayer(L, +id); if (e) flash(e); break; }
    case 'draftMore': ui.draftShow = (ui.draftShow || 60) + 60; break;
    case 'toMyPick': G.draftUntilUser(L); break;
    case 'autoPick': G.aiPick(L); G.draftUntilUser(L); break;
    case 'draftPick': G.makePick(L, +id); G.draftUntilUser(L); break;
    case 'draftRest': G.draftAll(L); break;
    case 'endDraft': G.endDraft(L); break;
    case 'nextSeason': { const e = G.startNextSeason(L); if (e) flash(e); break; }
    case 'chip': ui[el.dataset.key] = id; if (el.dataset.key === 'draftGrp') ui.draftShow = 60; break;
    case 'open': ui.open = ui.open === +id ? null : +id; ui.confirm = null; break;
    case 'lg': ui.lg = id; break;
    case 'lead': ui.leadKey = id; break;
    case 'week': ui.resWeek = +id; break;
    case 'sign': { const e = G.sign(L, +id); flash(e || 'Signed.'); break; }
    case 'resign': { const e = G.resign(L, +id); flash(e || 'Re-signed.'); break; }
    case 'tag': { const e = G.franchiseTag(L, +id); flash(e || 'Franchise tag applied.'); break; }
    case 'letGo': { const e = G.letGo(L, +id); flash(e || 'Released to free agency.'); break; }
    case 'matchSheet': { const e = G.matchSheet(L, +id); flash(e || 'Offer matched. He stays.'); break; }
    case 'declineSheet': { const e = G.declineSheet(L, +id); flash(e || 'He leaves. Compensation picks added.'); break; }
    case 'sheet': { const e = G.sendSheet(L, +id); flash(e || 'His team did not match. He is yours.'); break; }
    case 'protect': { const e = G.toggleProtect(L, +id); if (e) flash(e); break; }
    case 'advanceFA': { const e = G.advanceFA(L); if (e) flash(e); break; }
    case 'mktMore': ui.mktShow = (ui.mktShow || 30) + 30; break;
    case 'extend': { const e = G.extend(L, +id); flash(e || 'Extension signed.'); break; }
    case 'bid': {
      const k = el.dataset.key, p = L.players[+id], b = (L.fa.bids || {})[+id], ask = G.baseAsk(L, p);
      if (k === 'x') { G.withdrawBid(L, +id); break; }
      let sal = b ? b.sal : ask, yrs = b ? b.yrs : Math.max(1, Math.min(5, p.age <= 26 ? 4 : p.age <= 29 ? 3 : p.age <= 31 ? 2 : 1));
      if (k === 'sal+') sal += ask * 0.05; if (k === 'sal-') sal = Math.max(ask * 0.5, sal - ask * 0.05);
      if (k === 'yrs+') yrs = Math.min(5, yrs + 1); if (k === 'yrs-') yrs = Math.max(1, yrs - 1);
      const e = G.placeBid(L, +id, sal, yrs); if (e) flash(e); break;
    }
    case 'shop': ui.give = ['p:' + id]; ui.get = []; ui.tview = 'p'; ui.tab = 'moves'; break;
    case 'tview': ui.tview = id; break;
    case 'acceptOffer': { const e = G.acceptOffer(L, +id); flash(e || 'Trade accepted.'); break; }
    case 'rejectOffer': G.rejectOffer(L, +id); flash('Offer rejected.'); break;
    case 'tp': { const side = el.dataset.side, arr = ui[side]; const i = arr.indexOf(id); if (i >= 0) arr.splice(i, 1); else if (arr.length < 6) arr.push(id); else flash('A deal can include up to 6 items per side.'); break; }
    case 'clearTrade': ui.give = []; ui.get = []; break;
    case 'propose': { const pk = sel => ({ players: sel.filter(x => x[0] === 'p').map(x => +x.slice(2)), picks: sel.filter(x => x[0] === 'k').map(x => +x.slice(2)) }); const tt = ui.tradeTeam == null ? L.teams.find(t => t.id !== L.user).id : ui.tradeTeam; const r = G.proposeTrade(L, tt, pk(ui.give), pk(ui.get)); flash(r.msg); if (r.ok) { ui.give = []; ui.get = []; } break; }
    case 'coach': me().coach[el.dataset.key] = id; break;
    case 'plan': G.setGamePlan(L, el.dataset.key, id || null); break;
    case 'dcMove': G.moveDepth(L, L.user, +id, +el.dataset.key); break;
    case 'dcReset': G.resetDepth(L, L.user, id); break;
    case 'dcSort': G.setDepth(L, L.user, id, G.depthChart(L, L.user, id).sort(cmp(el.dataset.key)).map(p => p.id)); flash(`${id} depth chart ordered by ${el.dataset.key === 'pot' ? 'potential' : 'overall'}.`); break;
    case 'sort': ui[el.dataset.key] = id; break;
    case 'st': ui.st = id; ui.statPid = null; break;
    case 'stYear': ui.stYear = +id; break;
    case 'tsSort': ui.tsSort = id || 'w'; break;
    case 'statPlayer': ui.statPid = id ? +id : null; if (id) { ui.tab = 'stats'; window.scrollTo(0, 0); } break;
    case 'hurt': { const p = L.players[+id]; const e = G.setPlayHurt(L, +id, !p.playHurt); if (e) flash(e); else flash(p.playHurt ? `${p.name} will play through the injury.` : `${p.name} will rest until healthy.`); break; }
    case 'impKind': ui.impKind = id; break;
    case 'import': {
      const text = $('#impText').value;
      try { flash(importText(text, ui.impKind, ui.impKind === 'roster' ? ui.impTeam : +ui.impYear)); } catch (e) { flash(e.message); }
      break;
    }
    case 'exportSave': {
      const blob = new Blob([JSON.stringify({ league: L, imports: IM })], { type: 'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = `gridiron-gm-${L.year}.json`;
      document.body.appendChild(a2); a2.click(); a2.remove();
      flash('Backup created. If nothing downloaded, open the installed app rather than this preview.');
      break;
    }
    default: return;
  }
  if (a !== 'confirm') ui.confirm = null;
  save(); render();
}

document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'startQB') { G.setStarterQB(L, +t.value); save(); render(); }
  else if (t.id === 'tradeTeam') { ui.tradeTeam = +t.value; ui.get = []; render(); }
  else if (t.id === 'aggr') { me().coach.aggr = +t.value; save(); render(); }
  else if (t.id === 'youth') { me().coach.youth = t.checked; save(); }
  else if (t.id === 'impTeam') ui.impTeam = t.value;
  else if (t.id === 'impYear') ui.impYear = +t.value;
  else if (t.id === 'impFiles' && t.files.length) onFiles([...t.files]);
  else if (t.id === 'loadSave' && t.files[0]) {
    t.files[0].text().then(s => {
      try { const o = JSON.parse(s); if (!o.league || !o.league.teams) throw 0; L = o.league; G.ensureLeague(L); IM = o.imports || IM; ui.tab = 'home'; flash(`Restored your ${L.year} league.`); save(); }
      catch (err) { flash('That file is not a Gridiron GM backup.'); }
      render();
    });
  }
});
document.addEventListener('input', e => { if (e.target.id === 'aggr') { const h = e.target.closest('.card').querySelector('h3'); if (h) h.textContent = 'Aggressiveness: ' + e.target.value; } });

(async function boot() {
  await DB.open();
  const [l, im] = await Promise.all([DB.get('league'), DB.get('imports')]);
  if (im) IM = im; if (l && l.teams) { L = l; G.ensureLeague(L); }
  render();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) {
    try { navigator.serviceWorker.register('sw.js'); } catch (e) { /* offline install unavailable */ }
  }
})();
})();

</script>
