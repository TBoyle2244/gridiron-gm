<script>
/* ---------- Help: the game manual ----------
   Each section: id, title, tab (the screen it explains, for the "?" shortcut), body (HTML). */
const HELP = [
{ id: 'career', title: 'Player career mode', body: `
<p>In a player career you are one player instead of the general manager. Every team, yours included, is run by the computer: you don't set the depth chart, make trades or sign anyone. You decide where you sign, how you train, when you ask for more, and when you retire. Switch between <b>General manager</b> and <b>Player career</b> at the top of the first screen or on the Data tab. Each keeps its own save.</p>
<ol>
<li><b>Pick a draft year</b> (1971 to 2027). The season before it plays out (a few seconds), then the draft opens with you in it.</li>
<li><b>Create a player</b>: name, position, height, weight, college, hometown and number, then answer the questions. The first, where the scouts have you, is the difficulty: it sets your talent and draft stock. The rest are trade-offs (built like a tank: better now, lower ceiling). The scouting report at the bottom shows your numbers before the dice.</li>
<li>Or <b>be a real prospect</b> from that year's class. With Real careers on, his ratings follow the career he really had, but you decide where he plays and when he retires. Teams won't necessarily draft him where he really went.</li>
<li><b>Draft day.</b> Teams draft on the grade they see; a team that worked you out sees your real ceiling. You can go undrafted and pick a camp invitation.</li>
<li><b>Summer.</b> Pick a training focus (★ marks the ones that fit your position) and how hard to work, then go to camp. Your growth or decline for your age happens there. Extra work grows you faster and raises the injury risk.</li>
<li><b>The season.</b> Play one game at a time or sim to the playoffs. Your line from every game is on the <b>Games</b> tab. Your team is on the <b>Team</b> tab.</li>
</ol>
<p><b>Contracts.</b> When your deal is up, your agent brings offers: your team's (if it still wants you) and others with the money, years, the role you'd have and last season's record. Before 1993 only your own team can bid unless it lets you go. Ask for more (works about half the time; a team may walk away) or take a hometown discount (less money, one more year, more trust). Go to camp without choosing and your agent takes the biggest deal.</p>
<p><b>Contract structure.</b> Pick a structure on each multi-year offer: flat, standard, front-loaded, back-loaded (a little more total) or max bonus (half up front, a little less total). The signing bonus is paid when you sign, counts toward your career earnings right away, and stays yours if you're cut or traded.</p>
<p><b>Raises and holdouts.</b> Clearly underpaid and past your rookie deal? Ask for a raise once a year. Turned down, you can hold out: you miss games until the team gives in or you report. Holding out costs trust.</p>
<p><b>Coach and front office.</b> Two scores show where you stand. The <b>front office</b> (0-100) is the general manager: it rises when you produce for your pay, win honors and meet your goals, and falls when you hold out, ask out or get turned down for a raise. It decides whether your team re-signs you and gives you a raise; below 20 they start shopping you. <b>Accept any role</b> builds both, but you can't ask to start again that season.</p>
<p><b>The coach's trust</b> (0-100) rises when you win, play well and meet your goals, and falls when you ask out, hold out or get turned down. With enough trust you can <b>ask to start</b>; it works best when you're close to the man ahead of you. A new team starts at 50.</p>
<p><b>Schemes.</b> The Career tab shows your team's offense and defense, your fit grade on your side of the ball and why. When your team changes schemes (a new coach, a new era) you get an alert saying whether it helps or hurts you. Contract offers and trade deals show your fit with each team too.</p>
<p><b>Asking for a trade.</b> To a contender, somewhere you'd start, to a scheme that fits you (at least a B- and better than your current fit), or anywhere. After two weeks your team shops you (before the deadline or in the offseason) and brings back up to three deals. Turn them down and it keeps looking. A team won't trade its best player on a long deal unless the relationship has broken down. The AI can still trade or cut you on its own.</p>
<p><b>Alerts</b> at the top of the Career tab: trades, releases, injuries, honors, milestones. <b>Season goals</b>: three targets set at kickoff; each one you meet builds trust and raises your next contract. <b>Awards race</b>: from week 7, where you'd finish if the season ended today.</p>
<p><b>Legacy.</b> Your career totals ranked against everyone who has played in this league at your position, your awards and Super Bowl rings, and a Hall of Fame meter. Our football data has real rosters but not real awards, so you're ranked against your league's history, not the real all-time list.</p>
<p><b>Earnings.</b> Your salary each season adds up to career earnings, shown on the Career tab.</p>
<p><b>Changing positions.</b> In the offseason or at camp you can move to a new spot: corner to safety or tackle to guard costs nothing (same position group); receiver to tight end or linebacker to defensive end costs a few points of overall. The list shows where you'd land on your team's depth chart. One cross-group move per offseason.</p>
<p><b>Retiring.</b> After the season, in the offseason or in camp. You get the voters' verdict right away (as of four years later) and any team that retires your jersey. Sim ahead to see the real vote. Your career can also end for you: a serious injury (more likely after 30), age (from 34, or 37 for quarterbacks and kickers; better players last longer), or no team wanting you. Nobody plays past 45.</p>
<p><b>Life after football.</b> Once retired you can join a coaching staff as a coordinator (offense if you played offense) and follow your coaching career as the years go by; winners get promoted. Or take over a front office: pick your old team or one of the worst teams, and this save becomes a GM league in the same history. Your separate GM league isn't touched.</p>
<p><b>Play again.</b> Once retired, start a new player in the same league (he enters the next draft and your earlier players stay in its history, listed on the Career tab) or a brand-new career. From a front office that began as a career, the Data tab has the same option.</p>` },
{ id: 'quick', title: 'Quick start', body: `
<ol>
<li><b>Pick a season and a team.</b> Any year from 1970 to 2026. After 1970, every team starts with its real roster for that year.</li>
<li><b>Choose a difficulty.</b> Rookie, Pro or All-Pro (see <a data-help="difficulty">Difficulty</a>).</li>
<li><b>Training camp.</b> Check the camp report on the Office tab, set your schemes on the Coach tab and your depth chart on the Roster tab, and cut down to the roster limit on the Roster tab (or tap Auto-cut).</li>
<li><b>Kick off.</b> On the Office tab, play one week at a time or sim to the playoffs. Before each game you can set a game plan.</li>
<li><b>During the season:</b> trade before the deadline (after week 9), handle injuries, place players on injured reserve, and answer trade offers.</li>
<li><b>Playoffs.</b> Play each round on the Office tab.</li>
<li><b>After the season:</b> awards, the Hall of Fame and the owner's verdict on your job. Then re-sign or let go of your expiring players.</li>
<li><b>The draft.</b> Check your director of scouting's board, then draft or let your scouts pick. AI teams may offer to trade up for your pick.</li>
<li><b>Free agency and the offseason.</b> Sign free agents, extend your stars, make trades.</li>
<li><b>Start the next season</b> and do it again. The league keeps changing with real history.</li>
</ol>
<p>Tap the <b>?</b> at the top of any screen to jump to its help.</p>` },

{ id: 'calendar', title: 'The season calendar', body: `
<p>Every season goes through the same phases. The header always shows where you are.</p>
<ul>
<li><b>Training camp (preseason).</b> Ratings change for the new year (the camp report). Rosters have to be cut to the limit before kickoff, and in a cap year you have to be under the cap.</li>
<li><b>Regular season.</b> 14 games through 1977, 16 from 1978 (9 in the 1982 strike year, 15 in 1987), 17 from 2021. The trade deadline is after week 9.</li>
<li><b>Playoffs.</b> 4 teams per conference through 1977, then 5, then 6 from 1990 and 7 from 2020 (8 in 1982).</li>
<li><b>Season complete.</b> Awards, All-Pro teams, Hall of Fame inductions, coaching changes and your owner's review. Your expiring contracts need a decision.</li>
<li><b>The draft.</b> 17 rounds through 1976, 12 through 1992, 8 in 1993, then 7.</li>
<li><b>Offseason.</b> Free agency, extensions, trades, retirements. Then tap "Start the next season."</li>
</ul>` },

{ id: 'office', title: 'Office tab', tab: 'home', body: `
<p>Your front office: what's happening now and what to do next.</p>
<ul>
<li><b>Main card.</b> The next action for this phase: kick off, play the week, sim to the playoffs, open the draft or start the next season.</li>
<li><b>Owner.</b> This season's goal and your job security (see <a data-help="owner">Owner and job security</a>).</li>
<li><b>Game plan.</b> Before each game: a scouting report on the opponent's schemes, the scheme matchup in points, a suggested counter, this week's offensive and defensive lean, and your starting quarterback. The plan applies to one game, then resets.</li>
<li><b>Camp report.</b> In training camp: who improved, who declined, who retired, and the league's biggest movers.</li>
<li><b>Holdouts.</b> Underpaid players who refuse to play (see <a data-help="morale">Morale and holdouts</a>).</li>
<li><b>Wire.</b> League news: trades, signings, injuries, awards, new schemes, expansion and more.</li>
<li><b>Your past games.</b> Box scores for every game you've played.</li>
</ul>` },

{ id: 'roster', title: 'Roster tab', tab: 'roster', body: `
<p>Every player on your team, by position. Sort by overall, potential or yearly salary, and filter by position with the chips.</p>
<ul>
<li><b>Depth chart.</b> Tap a position (QB, RB, ...) and the list shows that position in depth-chart order. The green ones start. Use ▲▼ to move players, or order the whole position by overall or potential.</li>
<li><b>Each player shows</b> his age, years in the league, his type (Gunslinger, Deep threat, Run stuffer and so on, from his position ratings), his mood (Happy, Content, Unhappy, Angry) and his contract. Tap him to see why he feels that way, his ratings and every move you can make.</li>
<li><b>OVR</b> is how good he is today. <b>POT</b> is how good he can become. Each line also shows his jersey number, age, years in the league, morale, contract and season stats.</li>
<li><b>Colors:</b> gold is 85 and up (elite), green 72–84 (a good starter), plain 58–71 (average), grey under 58 (a backup).</li>
<li><b>Tap a player</b> to open his options: release, play hurt, injured reserve, extension, or shop him in trades.</li>
<li><b>Injuries</b> show as INJ with the weeks out. An injured starter can play hurt (at a ratings penalty), or you can place a player out several weeks on injured reserve to free his roster spot. Before 2012 IR is for the whole season. From 2012 one player a year can come back after 8 weeks, and from 2020 any number can after 4.</li>
<li><b>Cut-down.</b> You must be at or under the roster limit before kickoff: 40 through 1973, 47 in 1974, 43 through 1977, 45 through 1992, then 53. Auto-cut releases the lowest-value players.</li>
<li><b>Releasing</b> a player under contract can leave dead money (see <a data-help="money">Contracts, cap and budget</a>).</li>
</ul>` },

{ id: 'coach', title: 'Coach tab', tab: 'coach', body: `
<ul>
<li><b>Depth chart.</b> Now on the Roster tab: pick a position and the list becomes that position's depth chart, with ▲▼ arrows. How many start at each position comes from your schemes (see <a data-help="schemes">Era schemes</a>).</li>
<li><b>Offensive and defensive scheme.</b> Pick from the schemes that exist that season (see <a data-help="schemes">Era schemes</a>). Each shows how well your roster fits it.</li>
<li><b>Aggressiveness.</b> Higher means more fourth-down tries and deep shots: bigger wins and bigger losses.</li>
<li><b>Develop young starters.</b> Starters 26 and under who play most of the season get an extra development bump in the offseason.</li>
<li><b>Staff and budget.</b> Five jobs: head coach, offensive and defensive coordinators, director of scouting and head of medical staff. Each offseason the owner sets a staff budget from your market size (New York, Los Angeles, Chicago and the like get the most; Green Bay, Buffalo and other small markets the least) and how much you've won over the last two seasons. Better staff cost more, and you can't hire anyone who doesn't fit what's left. If the budget shrinks below what you already pay, you keep your staff but can't hire until you're under it.</li>
<li><b>Coordinators and head coach.</b> Their ratings add to your team. A coordinator whose preferred style matches your scheme gives his full boost. The head coach helps on game day and with young players. Coaches' ratings rise after good seasons and fall after bad ones.</li>
<li><b>Director of scouting.</b> He grades every draft prospect: how good he is now (OVR) and how good he can become (POT). He starts from the league consensus (where the player was really drafted, his college) and sees part of the way past it: a 90 scout catches about 40% of what the consensus gets wrong, a 50 scout about 15%, and every scout adds blind spots of his own. So even a great scout sees a 6th-round Hall of Famer as a solid early-round prospect, not a future star. Good scouts cost about as much as a coordinator. Your rookies' true ratings show halfway through their first season. Then every scout in the league is reviewed on the players his team drafted: if his grades beat the consensus, his rating goes up (up to +4); if they were worse, it goes down. A lucky or unlucky class moves a scout as much as his skill does, as in real life. You get a news item with his average miss, the consensus's, his best call and his worst miss, and his record shows on the Coach tab. Scouts' ratings don't drift otherwise, and AI teams fire scouts who fall below 50 more often.</li>
<li><b>Medical staff.</b> A good one means fewer injuries and quicker recoveries (up to about 25% better than average); a bad one, the reverse.</li>
<li><b>Unit ratings.</b> Your offense, defense and every position group at a glance.</li>
</ul>` },

{ id: 'schemes', title: 'Era schemes', body: `
<p>Every offense and defense runs a named scheme that only exists in its era. The West Coast offense appears in 1979, the Run and Shoot from 1989 to 1997, the 46 Defense from 1984 to 1995, the Tampa 2 from 1996, and so on through RPO, wide-zone play-action and two-high quarters coverage.</p>
<ul>
<li><b>Fit.</b> Each scheme leans on different position groups. Power I needs a great back and line, Run and Shoot needs receivers, and Cover 3 needs a secondary. Fit shows how much better your current roster rates in that system.</li>
<li><b>Matchups.</b> Schemes beat some schemes and lose to others, like rock-paper-scissors. Quick passing beats blitz-heavy defenses, eight-man boxes stop the run but give up the deep ball, and two-high coverage takes away big plays but gets run on. No scheme is better on average.</li>
<li><b>New and old.</b> A brand-new scheme gives a bonus for a few years while defenses learn it. Once a third of the league runs one, opponents are ready for it. Schemes in their last years fade, and when one disappears, any team still running it switches.</li>
<li><b>Personnel.</b> Each scheme puts its own players on the field: Power I uses two backs and two tight ends, Run and Shoot four receivers and no tight end, Empty Five-Wide five receivers and no back; on defense the 3-4 uses four linebackers, the 46 eight in the box, Nickel five defensive backs, Dime six. Your depth chart starts that many at each position, so a four-receiver offense needs four good receivers, and the scheme's Fit accounts for your depth.</li>
<li><b>Families.</b> Every scheme is run-first, balanced or pass-first on offense, and bend-don't-break, balanced or pressure on defense. Your weekly game plan can lean a different way for one game.</li>
</ul>` },

{ id: 'fit', title: 'Team fit and chemistry', body: `
<p>The <b>Team fit</b> card at the top of the Coach tab grades how well your team suits its schemes, from A+ to F. It counts on the field: about −2 to +2 points a game.</p>
<ul>
<li><b>Personnel:</b> whether your players suit your schemes' formations and the positions they lean on. Four-receiver offenses need four good receivers.</li>
<li><b>Coaches:</b> whether your coordinators prefer the style of scheme you run.</li>
<li><b>Chemistry:</b> a new scheme costs about a point a game in its first season and a little in its second while it's installed. Keeping starters together from one season to the next adds a small bonus; turning over most of the lineup costs a little. AI teams pay the same costs, so they don't switch schemes on a whim.</li>
<li>Each scheme card shows the grade you'd have if you switched, including the installation cost. The Roster tab tags each player <b>Key</b> (a position your scheme leans on), <b>Starter</b>, <b>Depth</b> or <b>Not used</b>, with a <b>scheme fit grade</b>. Tap a player to see why: where he'd slot in your formation, whether your scheme leans on his position, and whether its style suits him. Free agents and players on the You receive side of a trade show the same fit grade for your team.</li>
<li>Free agents notice too: a player at a key position in your scheme likes you more, and one with no role in it likes you less.</li>
</ul>` },

{ id: 'moves', title: 'Moves tab: trades', tab: 'moves', body: `
<ul>
<li><b>Trade offers</b> at the top: offers AI teams sent you, plus offers from your trading block. Accept or reject. During the season they last a week; otherwise they last until kickoff.</li>
<li><b>Trade.</b> Pick a partner, or <b>All teams</b> to browse the whole league (picking a player or pick makes his team your partner), then tap players or picks under You send and You receive. Each side has its own position filter, you can sort by position, overall, potential or yearly salary (which then shows in place of age), and there's a search box for any player in the league. Picks for the next three drafts can be traded, and each shows its projected overall slot. Compensatory picks can't be traded.</li>
<li><b>How the AI values a deal.</b> Stars are worth far more than depth: two or three good players don't buy one great one, and a player who wouldn't make their roster is worth almost nothing to them. Age, potential and contract matter. On harder difficulties they ask for more.</li>
<li><b>Trading block.</b> Put players or picks in You send, choose what you want back (best offer, players, picks or young players) and a position you need, then tap Find offers. Up to five teams' best offers land in Trade offers.</li>
<li><b>Deadline.</b> No trades after week 9 until the season ends. In-season trades must keep both teams at or under the roster limit, and cap years must stay under the cap.</li>
</ul>` },

{ id: 'fa', title: 'Moves tab: contracts and free agency', body: `
<p>Free agency follows real NFL history, so it works differently by era.</p>
<ul>
<li><b>Through 1976 (Rozelle Rule).</b> Free agency barely exists: a team that signs another club's player owes compensation, so players stay put. Expiring contracts renew automatically unless you let a player go.</li>
<li><b>1977–1988.</b> Your expiring veterans are restricted. You can tender them, and other teams can send offer sheets you can match or let go for draft-pick compensation. You can send offer sheets too.</li>
<li><b>1989–1992 (Plan B).</b> Each team protects a set number of players. Everyone else becomes an unrestricted free agent.</li>
<li><b>1993 on (unrestricted free agency).</b> Veterans with expiring deals hit the open market. Free agency runs in rounds: you and AI teams bid salary and years, and the player weighs money, years, team quality, playing time, scheme fit and loyalty. Each free agent shows the offers other teams are expected to make this round (team, about how much, how many years), with the current leader marked; real bids land within a few percent. Once you bid, it tells you whether you're leading or what rank your offer is, judged the way the player judges it (money, years, team, playing time, fit and loyalty, not just salary). Your own expiring players show who would bid if they reach the market. Asking prices drop in later rounds.</li>
<li><b>Finding players.</b> The free agent market has its own position filter, sort (overall, potential, asking price, youngest) and name search right above the list.</li>
<li><b>Tags (1993 on).</b> Once a year each: the <b>franchise tag</b> keeps an expiring player for one year at the average of the top 5 salaries at his position (tagging him again costs 120% of last year's tag, a third time 144%). The <b>transition tag</b> is cheaper (top 10 average), but other teams can still sign him to an offer sheet when the market opens; match it or he leaves with no compensation.</li>
<li><b>Rookie contracts.</b> Since 2011 every drafted rookie signs a 4-year deal, and first-rounders carry a <b>fifth-year option</b>: before his fourth season, tap him on the Roster tab to pick it up (about his market value for year five) or decline it. From 1993 to 2010, first-rounders signed 5-year deals and second-rounders 4.</li>
<li><b>Re-signing.</b> Before free agency, decide on your expiring players: re-sign at his price, tag him (once a year, from 1993) or let him go.</li>
<li><b>Extensions.</b> Once unrestricted free agency exists (1993 on), you can extend a player in the last year of his contract, before he reaches the market.</li>
<li><b>In-season signings.</b> Unsigned players can be signed during the season if you have a roster spot.</li>
</ul>` },

{ id: 'money', title: 'Contracts, cap and budget', body: `
<ul>
<li><b>Salary cap from 1994.</b> It rises every year (2010 was uncapped) and grows about 7% a year after 2025. You can't kick off over the cap, and signings, re-signings, extensions and trades all have to fit.</li>
<li><b>Owner's budget before 1994 (and in 2010).</b> The owner caps your spending at 15% above the league's average payroll, a little more for big markets and after a playoff year. Re-signing your own players is always allowed, and your unsigned players count at their asking price until you let them go.</li>
<li><b>Dead money.</b> Releasing a player under contract leaves a quarter of what's left on his deal (at most 60% of one year's salary) on this year's payroll. Players on minimum-level deals cost nothing to cut.</li>
<li><b>Rookie contracts</b> are set by draft slot.</li>
<li>The payroll card on the Moves tab shows your payroll, the cap or budget, your room and any dead money.</li>
</ul>` },

{ id: 'ps', title: 'Practice squad', body: `
<ul>
<li>From 1989, every team has a practice squad: 5 players through 2003, 8 through 2013, 10 through 2019 and 16 from 2020.</li>
<li>Practice-squad players develop like everyone else but don't count against your roster limit, don't play and don't count against the cap.</li>
<li>Only players with two seasons or fewer qualify; from 2020, up to six veterans can too.</li>
<li>Add players from the Roster tab (tap a player, Move to practice squad) or from the free agent list. Promote them to the roster any time you have a spot.</li>
<li><b>Pay and the cap.</b> From 1994, practice-squad pay counts against your cap during the season, as in the real NFL: about a quarter of the league minimum per player. A promoted player moves up to the minimum salary, so a promotion only adds the difference. If you're over the cap at camp, the Office tab shows a <b>Get under the cap</b> card with your options: cuts (with dead money worked out), June 1 cuts, restructures, moving young backups to the practice squad, and trades that send out more salary than they bring back.</li>
<li>During the season, other teams sign promising players off practice squads, including yours. You can do the same from the Moves tab (Other teams' practice squads).</li>
<li>A player who outgrows the practice squad moves to your roster at the start of the next season.</li>
</ul>` },

{ id: 'morale', title: 'Morale and holdouts', body: `
<ul>
<li>Every player has morale: Happy, Content, Unhappy or Angry. Winning and starting raise it. Losing lowers it, and so does sitting a good player on the bench.</li>
<li>Tap a player on the Roster tab to see what is driving his morale (record, playing time, pay).</li>
<li>From 1977, a good player (72+) who is paid under 65% of his market value and whose morale falls below 40 may <b>hold out</b>. The holdout card shows exactly why: his pay against his market value, his morale and what's behind it, and the new deal that ends it: he won't play until he gets a new deal. Holdouts appear on the Office tab. You can give him a new contract, wait (each week there's a small chance he reports anyway, angrier) or trade him.</li>
<li>Morale matters in free agency: happy players give their team a loyalty discount.</li>
</ul>` },

{ id: 'draft', title: 'The draft and scouting', body: `
<ul>
<li><b>Real draft classes.</b> Every class from 1971 on is the real one, with real names, positions and colleges. How good each one turns out is based on his real career. Your director of scouting sees that only as well as his rating allows, so a weak scout still misses steals and busts.</li>
<li><b>Draft class board</b> (League tab → Draft class). During the season, next year's class fills in as your scouts see more players each week, in random order. Sort it by position and grade.</li>
<li><b>Your scout's grades.</b> Your director of scouting (Coach tab) grades every prospect for now (OVR) and his ceiling (POT). He starts from the consensus and corrects part of its misses (about 15% for a 50-rated scout, 40% for a 90), plus blind spots of his own. Next to his grade, <b>LEAGUE</b> shows the consensus grade (what most teams think), and the board flags players your scout likes or dislikes by 5 or more points more than the league. You can rank the board by either. Other teams draft on their own scouts' boards. The true numbers show halfway through a player's rookie season.</li>
<li><b>Draft tracker.</b> On draft day, every pick shows up as it's made, newest first, with the round, team, college, your scouts' grade and where he really went. Filter by round or team. Past drafts (the last 15) are under League → Draft results.</li>
<li><b>Draft day.</b> Draft when you're on the clock, sim to your next pick, let your scouts pick, or auto-draft the rest. AI teams may offer to trade up for your pick: accept or keep the pick. AI teams also trade picks with each other.</li>
<li><b>Compensatory picks</b> (from 1994): teams that lose more good free agents than they sign get up to 4 extra picks in rounds 3–7, placed at the end of the round. They can't be traded until 2017, when the NFL started allowing it.</li>
<li><b>Draft refusals</b> (before 2011): now and then a top-3 pick refuses to sign with a team coming off a bad season, as John Elway did in 1983, Bo Jackson in 1986 and Eli Manning in 2004. If it's your pick, trade his rights (he's in your trade list) or he sits out the season and re-enters the next draft. AI teams usually trade the rights for a future first-round pick.</li>
<li><b>After 2026</b> there are no real classes left, so new classes are generated.</li>
</ul>` },

{ id: 'ratings', title: 'How player ratings work', body: `
<ul>
<li><b>Real drafted players</b> are rated from their real careers (Pro-Football-Reference career value, Pro Bowls and All-Pros), with a little weight on draft slot and a small amount of luck. Active players' careers are projected forward, so a young star isn't judged on two seasons. Each position is scaled against its own peers, and 99 is reserved for the very best ever.</li>
<li><b>Undrafted players</b> (Kurt Warner, Tony Romo, Antonio Gates) are rated from how long they played, how often they started and their stats. Before 1999 there are no stats, so their ratings are rougher.</li>
<li><b>1970 rosters</b> are rated from the 1970 season.</li>
<li><b>Generated players</b> fill the few spots the real data can't.</li>
<li><b>Development.</b> Young players improve toward their potential, peak in their late 20s (quarterbacks, kickers and punters later) and decline after that. The camp report each preseason shows the changes.</li>
<li><b>Position ratings.</b> Every player also has two to four ratings for his position (a quarterback has arm strength, accuracy, pocket presence and mobility; a corner has coverage, speed, ball skills and tackling). They average out to his overall, so they show <i>how</i> he is good, not how good he is. Real players' strengths come from real data: height and weight for nearly everyone since 1970, Combine results (40 time, bench, jumps, agility drills) from 2000 on, career passing, catching, sack and tackle numbers for drafted players, and detailed season stats from 1999 on. Players with no measurements get an estimate from their size. Each player page says what his ratings are based on.</li>
<li><b>What they change.</b> The season sim still runs on overall ratings, so teams win and lose the same way. Position ratings change who gets the stats (accurate quarterbacks complete more, pass rushers get more of the sacks, ballhawks more of the picks, route runners more targets), how well a player fits a scheme, and how everyone plays in Play the Game. Speed fades after 28; accuracy, routes and coverage improve with experience.</li>
</ul>` },

{ id: 'real', title: 'Real careers and real rosters', body: `
<ul>
<li><b>Real careers</b> (on by default): real players rise, peak, fade and retire the year they really did. Turn it off on the new-league screen or the Data tab for random development and retirement and a different history every time.</li>
<li><b>Undrafted players</b> enter free agency in their real rookie year. Any team can sign them.</li>
<li><b>Real rosters</b> decide who is on which team when you start after 1970. From then on, AI teams make their own moves: nobody follows real trades.</li>
<li>Players still active in 2026 keep playing until the game's normal aging retires them.</li>
</ul>` },

{ id: 'history', title: 'NFL history in the game', body: `
<ul>
<li><b>Expansion:</b> Seattle and Tampa Bay (1976), Carolina and Jacksonville (1995), Cleveland returns (1999), Houston (2002). Each has a real expansion draft: you protect or expose players on the Moves tab the offseason before. Expansion teams now join before the draft, as they really did: the expansion draft comes first, then they pick first in every round of the college draft. <b>Start a new league with one of these teams in its first season</b> (Seattle or Tampa Bay in 1976, Carolina or Jacksonville in 1995, Cleveland in 1999, Houston in 2002) and you start that spring with no players: you make the expansion picks yourself (up to the number the real team took, never more than the real limit from any one team, or stop early), then the college draft, then free agency.</li>
<li><b>Moves and names:</b> the Raiders, Colts, Cardinals, Rams, Oilers/Titans, Browns/Ravens, Chargers and Washington all move or change names when they really did. The league realigns in 2002.</li>
<li><b>Strikes:</b> 1982 (a 9-game season and 16-team playoff) and 1987 (replacement players for three weeks).</li>
<li><b>Rules by era:</b> overtime from 1974, season length, playoff format, roster size, draft rounds, free agency rules and the salary cap all change when they really did.</li>
<li><b>Scoring</b> follows each season's real league averages for points and yards.</li>
</ul>` },

{ id: 'pages', title: 'Player and team pages', body: `
<ul>
<li><b>Player pages:</b> tap any player's name almost anywhere (stats, awards, Hall of Fame, the depth chart, trade lists, free agents, the draft tracker) or tap a player on the Roster tab and choose Player page. It shows his ratings, contract, fit with your team, awards and honors, every team he played for, his season-by-season stats with career totals, and his transactions (drafted, traded, signed, released, tagged, retired). A player on another team has a Trade for him button.</li>
<li><b>Team pages:</b> tap a team in the standings, on League → Teams, or tap your team's badge at the top of the screen. It shows the all-time record, playoff seasons and titles, former names, the current staff, schemes and best players, every season with its head coach (and the seasons you were GM), franchise leaders, award winners, Hall of Famers, the Ring of Honor and recent first-round picks.</li>
<li>Use Back to return to where you were.</li>
<li>Transactions and head coaches are recorded from this version on; earlier seasons show what was already saved.</li>
</ul>` },

{ id: 'play', title: 'Play the Game (preview)', body: `
<p>A first look at playing games yourself, Retro Bowl style. Open it from the game plan card on the Office tab (Play this game yourself). It uses your saved league: your team and this week's opponent, with their real players and ratings. The result doesn't count in your league yet.</p>
<ul>
<li><b>You play offense.</b> The other team's drives are simulated against your defense between yours.</li>
<li><b>Kickoffs and punts.</b> You return them: your returner settles under the ball, then you run it like any carry. While the ball is in the air you can call a fair catch on a punt, or take a knee on a kickoff deep in the end zone (touchback).</li>
<li><b>Kicking.</b> Field goals and extra points use a kick meter: tap Kick when the ball marker is between the uprights. The uprights are wider for a better kicker and a shorter kick, and the marker moves faster on long ones. Your punts show the distance and the return.</li>
<li><b>Quick calls.</b> "Again" repeats your last play.</li>
<li><b>Calling plays:</b> pick from six plays: quick slants, curl/flat, four verticals, a play-action shot, an inside run and an outside run. Your offensive scheme decides your personnel (how many backs, tight ends and receivers line up).</li>
<li><b>Landscape:</b> the game plays sideways, with your offense driving left to right. Turn your phone sideways (and turn off rotation lock).</li>
<li><b>Passing:</b> after the snap, touch anywhere and pull back to the left like a slingshot, then let go. The ball flies the opposite way; pull farther to throw farther, and pull up or down to aim across the field. Hold the ball too long and you get sacked. Tap Run to scramble.</li>
<li><b>Running:</b> your runner always runs straight ahead, and faster players run faster. Slide your finger up or down to move him across the field (he keeps running straight). Tap to juke past a tackler. Swipe right to dive forward and be down; swipe left to slide feet first and be down (no extra yards, but no hit). On a pass play, tap <b>QB run</b> to take off with your quarterback.</li>
<li><b>Arm strength:</b> a better quarterback throws farther and the ball gets there faster: about 37 yards for a 60-rated QB, 54 for an 80, 62 for a 90.</li>
<li><b>Ratings matter:</b> better quarterbacks throw farther and more accurately, faster receivers get open, better cover men stay closer, and your line against their front decides how long you have to throw and how big the holes are.</li>
<li><b>Fourth down:</b> go for it, punt or try a field goal (the odds are shown). After a touchdown from 1994 on you can go for two.</li>
</ul>` },

{ id: 'bonus', title: 'Signing bonuses, dead money and restructures', body: `
<p>Contracts work like the real NFL's. Each deal has a yearly salary and often a <b>signing bonus</b>. The bonus is paid up front but counts against the cap spread evenly over the contract, up to five years. Teams also <b>front-load</b> (more salary early) or <b>back-load</b> (more late) deals. A player's page shows his contract year by year: salary, bonus share and cap hit.</p>
<ul><li><b>Dead money.</b> Cut or trade a player and the bonus not yet counted lands on your cap right away. The release button shows the amount.</li>
<li><b>June 1 cuts</b> (1994 on, up to two each offseason): only this year's bonus share counts now; the rest moves to next year.</li>
<li><b>Restructure</b> (1994 on): turn most of a player's salary this year into a bonus spread over the years he has left. You save cap room now and pay for it later. Once per player per year, players with two or more years left.</li>
<li>Players you trade for arrive with their salary only; their old team keeps the bonus.</li>
<li>Before the 1994 cap, bonuses don't matter for the cap, only your owner's budget.</li>
<li>Contracts signed before this update stay flat until they're re-signed.</li></ul>` },
{ id: 'weather', title: 'Stadiums and weather', body: `
<p>Every team plays in its real stadium for the era: Lambeau Field, the Astrodome, the Metrodome, Candlestick Park and so on, with its roof (open air, dome or retractable) and its city's climate.</p>
<ul><li>The next game card shows the stadium and the forecast; what you see is what you get.</li>
<li>Late-season games in cold cities get colder. Snow, wind and rain cut scoring and push teams to run more; snow and wind hurt most. Domes play a little faster.</li>
<li>Warm-weather and dome teams struggle a bit more in freezing games.</li>
<li>Retractable roofs close in bad weather. The Super Bowl is played in good conditions.</li>
<li>The weather shows in box scores and on the Games tab in a player career.</li></ul>` },
{ id: 'stats', title: 'Stats tab', tab: 'stats', body: `
<ul>
<li><b>Teams:</b> season team stats. <b>My players:</b> your players' season stats. <b>Careers:</b> career totals.</li>
<li><b>Awards:</b> MVP, Offensive and Defensive Player of the Year, Rookies of the Year and Super Bowl MVP for every season.</li>
<li><b>All-Pro:</b> first and second teams for every season.</li>
<li><b>Hall of Fame:</b> every inductee. Players become eligible about five years after they retire.</li>
<li><b>Records:</b> league records, Super Bowl champions and the <b>Ring of Honor</b>.</li>
</ul>` },

{ id: 'honors', title: 'Awards, Pro Bowl, Hall of Fame and Ring of Honor', body: `
<p><b>Pro Bowl.</b> When the regular season ends, each conference names a Pro Bowl squad (3 quarterbacks, 4 receivers, 4 corners and so on) from that season's stats. Pro Bowls count a little toward the Hall of Fame and show on player pages and the Stats tab (All-Pro &amp; Pro Bowl). Team pages also have a <b>record book</b>: single-season and career records with that franchise.</p>
<ul>
<li>Awards and All-Pro teams are voted on each season's stats and team success.</li>
<li>The Hall of Fame inducts a few retired players each year based on career value, awards and All-Pro selections, judged against their own position.</li>
<li><b>Ring of Honor:</b> retire the number of a former player of yours who earned it (Stats → Records). AI teams retire numbers for Hall of Famers with at least 4 seasons there, or 10+ season players who were stars.</li>
</ul>` },

{ id: 'league', title: 'League tab', tab: 'league', body: `
<ul>
<li><b>Standings</b> by division and conference, with playoff seeding.</li>
<li><b>Results:</b> every game, week by week, with box scores.</li>
<li><b>Leaders:</b> the league leaders in each stat.</li>
<li><b>Draft class:</b> next year's class as your scouts see it (see <a data-help="draft">The draft and scouting</a>).</li>
<li><b>Draft results:</b> every pick from the current draft and the last 15, filterable by round and team.</li>
<li><b>History:</b> past standings and playoff results.</li>
</ul>` },

{ id: 'owner', title: 'Owner and job security', body: `
<ul>
<li>Each season the owner sets a goal based on how your roster ranks: from "win more games" up to "reach the conference championship."</li>
<li>Meeting or beating the goal raises your job security, and missing it lowers it. Winning the Super Bowl helps a lot.</li>
<li>If your job security runs out, you're fired. Other teams make offers, and you can take a new job (with that team's roster) or start a new league.</li>
</ul>` },

{ id: 'difficulty', title: 'Difficulty', body: `
<ul>
<li><b>Rookie:</b> AI teams take cheaper trades and make generous offers, adjust their schemes less often, and your team gets a small boost.</li>
<li><b>Pro:</b> balanced. Fair trades.</li>
<li><b>All-Pro:</b> AI teams want more in trades and offer less, your team plays at a small disadvantage, and opposing coaches adjust their game plans to counter yours.</li>
<li>You can change difficulty any time on the Data tab.</li>
</ul>` },

{ id: 'data', title: 'Data tab: saving, backups and updates', tab: 'data', body: `
<ul>
<li><b>Saving is automatic</b> and stays on this device. If a save ever fails, a red warning appears on every screen. Download a backup right away.</li>
<li><b>Backups:</b> Download backup saves your league as a file, and Restore loads one. Use it to move a league to another device or keep a safe copy. <b>Deleting the game's Home Screen icon deletes its saved data</b>, so back up first.</li>
<li><b>Updates</b> arrive by themselves when you open the game online. If you don't see a new version, close the game fully and reopen it. The version is at the bottom of the Data tab.</li>
<li><b>Offline:</b> after one visit online, everything works offline.</li>
<li><b>Importing data:</b> paste Pro-Football-Reference tables for a 1970 roster or a draft class (type 1984s for the 1984 supplemental draft). Data packs share imports with a friend.</li>
<li><b>Real careers</b> and <b>difficulty</b> settings for your current league live here too.</li>
</ul>` },

{ id: 'tips', title: 'Tips and common questions', body: `
<ul>
<li><b>My team is bad. Where do I start?</b> Trade veterans for picks and young players, give young starters playing time with "Develop young starters," and draft for potential.</li>
<li><b>Why won't the AI take my trade?</b> Quantity doesn't buy quality, and they won't take players who wouldn't make their roster. Try the trading block to see what the league will really pay.</li>
<li><b>Why did a player's rating drop?</b> Age, or his real career (with Real careers on). Check the camp report.</li>
<li><b>Can't kick off?</b> You're over the roster limit (cut players) or over the cap (release or trade salary).</li>
<li><b>How do I get my coordinator's full boost?</b> Run a scheme of the style he prefers.</li>
<li><b>Where are the old draft picks?</b> Only the next three drafts can be traded. Leagues that start after 1970 skip earlier drafts.</li>
<li><b>Can friends play?</b> Yes. Send them the link and have them add it to the Home Screen. Every device has its own league.</li>
</ul>` }
];
const HELP_FOR_TAB = { home: 'office', roster: 'roster', stats: 'stats', league: 'league', moves: 'moves', coach: 'coach', data: 'data' };

/* Gridiron GM — interface */
(function () {
'use strict';
const G = window.GG;
const APP_VERSION = '2026-11-24q';
let SLOT = (() => { try { return localStorage.getItem('gg-slot') === 'career' ? 'career' : 'league'; } catch (e) { return 'league'; } })();
let L = null;                       // league
let IM = { rosters: {}, drafts: {} }; // imported PFR data
const ui = { tab: 'home', grp: 'ALL', lg: 'stand', leadKey: 'py', resWeek: null, open: null, confirm: null,
  tradeTeam: null, give: [], get: [], faGrp: 'ALL', draftGrp: 'ALL', msg: null, impKind: 'roster', impTeam: 'nor', impYear: 1971 };

/* ---------- storage (IndexedDB, falls back to localStorage; saves are gzip-compressed) ---------- */
const ZIP = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
async function gz(str) { return await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer(); }
async function gunz(buf) { return await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
function b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(str) { const b = atob(str), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; }
async function pack(v) { // value -> what gets stored
  if (v == null || !ZIP) return v;
  return { gz: 1, data: await gz(JSON.stringify(v)) };
}
async function unpack(v) { // stored -> value (old uncompressed saves still load)
  if (v && v.gz === 1) return JSON.parse(await gunz(typeof v.data === 'string' ? unb64(v.data) : v.data));
  return v;
}
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('gridiron-gm', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
        rq.onsuccess = () => { DB.db = rq.result; res(); };
        rq.onerror = () => res();
      } catch (e) { res(); }
    });
  },
  async get(k) {
    try {
      let raw;
      if (!DB.db) { const v = localStorage.getItem('gg-' + k); raw = v ? JSON.parse(v) : null; }
      else raw = await new Promise(res => { const rq = DB.db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); });
      return await unpack(raw);
    } catch (e) { return null; }
  },
  async set(k, v) { // resolves true when the write is safely on disk, throws otherwise
    const p = await pack(v);
    if (!DB.db) {
      const out = p && p.gz === 1 ? { gz: 1, data: b64(p.data) } : p;
      localStorage.setItem('gg-' + k, JSON.stringify(out)); // throws QuotaExceededError when full
      return true;
    }
    return await new Promise((res, rej) => {
      const tx = DB.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(p, k);
      tx.oncomplete = () => res(true);
      tx.onerror = () => rej(tx.error || new Error('write failed'));
      tx.onabort = () => rej(tx.error || new Error('write aborted'));
    });
  }
};
let saveT = null, saving = false, saveAgain = false, imSig = null;
const SAVE = { ok: null, err: null, at: 0, bytes: 0, mode: '' };
function imSignature() { return Object.keys(IM.rosters || {}).length + ':' + Object.keys(IM.drafts || {}).length; }
async function doSave() {
  if (saving) { saveAgain = true; return; }
  saving = true;
  try {
    if (L && G.ensureAllAttrs) G.ensureAllAttrs(L); // ratings are kept in the save so Play the Game can use them
    await DB.set(SLOT, L);
    const sig = imSignature();
    if (sig !== imSig) { await DB.set('imports', IM); imSig = sig; }
    const wasBad = SAVE.ok === false;
    SAVE.ok = true; SAVE.err = null; SAVE.at = Date.now();
    SAVE.mode = (DB.db ? 'IndexedDB' : 'localStorage') + (ZIP ? ', compressed' : ', uncompressed');
    if (wasBad) { flash('Saving works again. Your progress is stored.'); render(); }
  } catch (e) {
    const first = SAVE.ok !== false;
    SAVE.ok = false; SAVE.err = (e && (e.name === 'QuotaExceededError' || /quota/i.test(e.message || ''))) ? 'This device is out of storage space for the game.' : 'The browser refused to store the game' + (e && e.name ? ' (' + e.name + ')' : '') + '.';
    if (first) render();
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; doSave(); }
  }
}
function save() { clearTimeout(saveT); saveT = setTimeout(doSave, 250); }
function saveBanner() {
  if (SAVE.ok !== false) return '';
  return `<section class="card savewarn"><div class="eyebrow">Save failed</div><h2>Your progress is not being saved</h2>
    <p>${esc(SAVE.err)} Anything you do now will be lost when the app closes.</p>
    <p>Download a backup right now so you don't lose this league, then free up space or open the game in normal (not private) Safari.</p>
    <div class="row"><button class="btn primary" data-act="exportSave"${L ? '' : ' disabled'}>Download backup</button><button class="btn" data-act="retrySave">Try saving again</button></div></section>`;
}

/* ---------- visitor counting (GoatCounter, GitHub version only) ---------- */
const TRACKED = {};
function track(name, once) {
  try {
    if (once) { if (TRACKED[name]) return; TRACKED[name] = 1; }
    if (window.goatcounter && window.goatcounter.count && !/claude\.ai|claudeusercontent/.test(location.host)) window.goatcounter.count({ path: name, title: name, event: true });
  } catch (e) { /* offline or blocked: ignore */ }
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const me = () => { if (L && L.career) { const p = G.careerP(L); return L.teams[p && p.team >= 0 ? p.team : 0]; } return L.teams[L.user]; };
const rec = t => `${t.w}-${t.l}${t.t ? '-' + t.t : ''}`;
const tname = t => `${t.city} ${t.name}`;
function grade(v) { return v >= 85 ? 'g-elite' : v >= 72 ? 'g-good' : v >= 58 ? 'g-avg' : 'g-low'; }
function rating(v) { return `<span class="rt ${grade(v)}">${Math.round(v)}</span>`; }
function flash(s) { ui.msg = s; }
function statLine(p) {
  const h = p.hist[L.year]; if (!h || !h.g) return '';
  const parts = [];

function playoffResults() {

function gameLine(g, key) {
  const H = L.teams[g.h], A = L.teams[g.a], hw = g.hs > g.as, aw = g.as > g.hs, mine = g.h === L.user || g.a === L.user;
  const inner = `<span class="${aw ? 'win' : ''}">${esc(A.abbr)} ${g.as}</span><span class="at">@</span><span class="${hw ? 'win' : ''}">${esc(H.abbr)} ${g.hs}</span>${g.ot ? '<span class="ot">OT</span>' : ''}`;
  return key && g.box ? `<button class="gl ${mine ? 'mine' : ''}" data-act="box" data-id="${key}">${inner}<span class="glbox">Box score ›</span></button>` : `<div class="gl ${mine ? 'mine' : ''}">${inner}</div>`;
}
function findGame(key) {
  const [src, a, b] = String(key).split(':');
  if (src === 'w') return L.schedule[+a] && L.schedule[+a][+b];
  if (src === 'p') return L.playoffs && L.playoffs.rounds[+a] && L.playoffs.rounds[+a].games[+b];
  if (src === 'a') return L.myGames && L.myGames[a] && L.myGames[a][+b];

}
function boxCard(key) {

  const qh = Array.from({ length: nq }, (_, i) => `<th>${i < 4 ? i + 1 : 'OT'}</th>`).join('');
  const row = (t, q, pts) => `<tr><td class="l">${esc(t.abbr)}</td>${Array.from({ length: nq }, (_, i) => `<td>${q[i] || 0}</td>`).join('')}<td><b>${pts}</b></td></tr>`;

  const side = (tid, t) => {
    const ls = B.lines.filter(l => l.tm === tid);
    const pick = (f, srt, n) => ls.filter(f).sort(srt).slice(0, n);
    const pass = pick(l => l.att, (a, b) => b.att - a.att, 1), rush = pick(l => l.ra, (a, b) => b.ry - a.ry, 3), rec = pick(l => l.rec, (a, b) => b.recy - a.recy, 4);
    const def = pick(l => l.sk || l.dint, (a, b) => (b.sk + (b.dint || 0) * 2 || 0) - (a.sk + (a.dint || 0) * 2 || 0), 4), k = pick(l => l.fgm, () => 0, 1);
    const li = (l, txt) => `<li><span class="pos">${esc(l.pos)}</span> <button class="lnk" data-act="statPlayer" data-id="${l.id}">${esc(l.n)}</button> <span class="small">${txt}</span></li>`;
    const sec = (h, arr, f) => arr.length ? `<div class="eyebrow">${h}</div><ul class="olist">${arr.map(l => li(l, f(l))).join('')}</ul>` : '';
    return `<div><h3 class="sub">${esc(t.city)}</h3>${sec('Passing', pass, l => `${l.cmp}/${l.att}, ${l.py} yds, ${l.ptd || 0} TD, ${l.int || 0} INT`)}${sec('Rushing', rush, l => `${l.ra}-${l.ry}, ${l.rtd || 0} TD`)}${sec('Receiving', rec, l => `${l.rec}-${l.recy}, ${l.rectd || 0} TD`)}${sec('Defense', def, l => [l.sk ? l.sk + ' sk' : '', l.dint ? l.dint + ' INT' : ''].filter(Boolean).join(', '))}${sec('Kicking', k, l => l.fgm + ' FG')}</div>`;
  };
  return `<section class="card hero box"><div class="split"><div class="eyebrow">${esc(g.wk || '')} Box score${g.wx ? ' · ' + esc(G.wxText(g.wx)) : ''}</div><button class="btn sm" data-act="box" data-id="">Close</button></div>
    <div class="tscroll"><table class="tbl stat"><thead><tr><th class="l">Team</th>${qh}<th>Final</th></tr></thead><tbody>${row(A, B.q[1], g.as)}${row(H, B.q[0], g.hs)}</tbody></table></div>
    <div class="tscroll"><table class="tbl stat"><thead><tr><th class="l"></th><th>${esc(A.abbr)}</th><th>${esc(H.abbr)}</th></tr></thead><tbody>${srow('Total yards', 'yds')}${srow('Passing', 'py')}${srow('Rushing', 'ry')}${srow('Interceptions thrown', 'to')}${srow('Sacks', 'sk')}</tbody></table></div>
    <div class="trade">${side(g.a, A)}${side(g.h, H)}</div></section>`;
}

function diffBlurb(k) {

/* ---------- Game plan ---------- */
const OFF = { run: 'Ground game', bal: 'Balanced', pass: 'Air it out' };

function bestOffVs(def) { const v = G.DEF_VS[def]; const best = Object.keys(OFF).sort((a, b) => v[b] - v[a])[0]; return v[best] > 0 ? best : null; }

    <p class="small">Counters: ${G.DEF_VS[dHint][oc.off] < 0 ? `a <b>${esc(DEF[dHint])}</b> defense slows their offense` : `a <b>${esc(DEF[dHint])}</b> defense is the safe call, since blitzing or sitting back gets run on`}${oHint ? `, and a <b>${esc(OFF[oHint])}</b> attack exploits their defense` : '. Their base defense has no scheme weakness, so lean on your best unit'}.</p>

/* ---------- Draft ---------- */
function vDraft() {

      <div class="row">${mine ? '<button class="btn" data-act="autoPick">Let scouts pick</button>' : '<button class="btn primary" data-act="toMyPick">Sim to my pick</button>'}<button class="btn" data-act="draftRest">Auto-draft the rest</button></div></section>`;

  h += draftTracker(D.log, D.year, D.rounds, n, true);

// Every pick so far (live during the draft, or a past draft from the League tab).
function draftTracker(log, year, rounds, n, live) {
  if (!log.length) return live ? `<section class="card"><h3>Draft tracker</h3><p class="small">No picks yet. Every pick will show up here as it's made.</p></section>` : '';

  let rows = log.map(x => Array.isArray(x) ? { n: x[0], tid: x[1], pid: x[2] } : x);
  const rndOf = x => { const p = L.players[x.pid] || G.getP(L, x.pid); return p && p.draft && p.draft.year === year ? p.draft.rnd : Math.floor((x.n - 1) / n) + 1; };

  if (live) rows = rows.slice().reverse();
  const lim = live ? 5 : 16, all = ui.trkAll || rows.length <= lim, show = all ? rows : rows.slice(0, lim);
  const rnds = []; for (let r = 1; r <= rounds; r++) rnds.push(r);
  const line = x => { const p = L.players[x.pid] || G.getP(L, x.pid); if (!p) return ''; const t = L.teams[x.tid], rnd = rndOf(x), rp = p.realPick;
    return `<div class="pl wide${x.tid === L.user ? ' mine' : ''}"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${pLink(p)}<div class="pl-sub"><b>#${x.n}</b> · round ${rnd} · ${esc(t ? t.abbr : '?')}${x.tid === L.user ? ' <span class="good">· your pick</span>' : ''}${p.college ? ' · ' + esc(p.college) : ''}${rp && rp.pick ? ` · really went #${rp.pick}${rp.tm ? ' to ' + esc(rp.tm) : ''}` : ''}</div></div>
      <div class="pl-r"><span class="lbl">${G.potKnown(L, p) ? 'POT' : 'SC POT'}</span>${rating(G.shownPot(L, p))}</div></div></div>`; };
  return `<section class="card"><div class="split"><h3>${live ? 'Draft tracker' : year + ' draft results'}</h3><span class="small">${log.length} pick${log.length === 1 ? '' : 's'}${live ? ', newest first' : ''}</span></div>
    <div class="row trk"><label class="fld">Round<select id="trkRnd"><option value="0">All rounds</option>${rnds.map(r => `<option value="${r}"${rf === r ? ' selected' : ''}>Round ${r}</option>`).join('')}</select></label>
    <label class="fld">Team<select id="trkTeam"><option value="-1">All teams</option>${L.teams.slice().sort((a, b) => tname(a).localeCompare(tname(b))).map(t => `<option value="${t.id}"${tf === t.id ? ' selected' : ''}>${esc(tname(t))}</option>`).join('')}</select></label></div>
    <div class="list">${show.map(line).join('') || '<p class="small">No picks match.</p>'}</div>
    ${!all ? `<div class="row"><button class="btn sm" data-act="trkAll">Show all ${rows.length}</button></div>` : ''}
    <p class="small">Potential is your scouts' grade (SC POT) until a player's true ratings show, halfway through his rookie season.</p></section>`;
}
function myPicks() {

/* ---------- Contracts ---------- */
function conText(p) {

function payrollCard() {

    const rfa = G.isRestricted(L, p), price = rfa ? G.tenderPrice(L, p) : G.resignPrice(L, p);
    const mk = ufa && !rfa ? G.marketFor(L, p.id) : [];
    const why = (ufa && !rfa ? reasonsText(G.fitFor(L, p, L.user).reasons) : '') + (ufa && !rfa ? `<br><span class="small">If he reaches the market: ${mk.length ? mk.map(o => `${esc(L.teams[o.tid].abbr)} ≈${G.money(o.sal)}×${o.yrs}`).join(' · ') : 'no teams expected to bid in round 1'}</span>` : '');
    const btns = `<button class="btn sm primary" data-act="resign" data-id="${p.id}">${rfa ? 'Tender' : 'Re-sign'} ${G.money(price)}</button>${F.era === 'ufa' && !F.tagged && !rfa ? `<button class="btn sm" data-act="tag" data-id="${p.id}">Franchise tag ${G.money(G.tagPrice(L, p, 'franchise'))}</button>` : ''}${F.era === 'ufa' && !F.ttagged && !rfa ? `<button class="btn sm" data-act="ttag" data-id="${p.id}">Transition tag ${G.money(G.tagPrice(L, p, 'transition'))}</button>` : ''}<button class="btn sm" data-act="letGo" data-id="${p.id}">Let go</button>`;
    return prow(p, (rfa ? 'Restricted' : (ufa ? 'Unrestricted · market value ' + G.money(G.marketValue(L, p)) : 'Asking ' + G.money(price))) + why, btns);
  }).join('')}</div><p class="small">${ufa ? 'This is your exclusive window. Once you start free agency, unrestricted players you haven\'t re-signed or tagged hit the open market, where you can still bid but other teams will too. Restricted players stay at their tender price.' : 'Anyone you don\'t handle re-signs at his asking price when the season starts.'}</p>` : '<p class="small">None. Everyone is signed for next season.</p>';
  if (ufa) h += marketList(F);
  if (F.era === 'planb') {
    const pr = F.protect, mine = ctFilter(G.roster(L, L.user).slice());
    h += `<h3 class="sub">Plan B protection (${pr.length} / 37)</h3><p class="small">Unprotected players worth keeping may sign elsewhere when the season starts.</p><div class="tlist protect">${mine.map(p => `<button class="tp ${pr.includes(p.id) ? 'on' : ''}" data-act="protect" data-id="${p.id}"><span class="pos">${esc(p.pos)}</span><span class="tp-n">${esc(p.name)}</span><span class="tp-a">${p.age}</span>${rating(G.shownOvr(L, p))}</button>`).join('')}</div>`;
    const pool = ctFilter(G.planBPool(L)).slice(0, 40);
    h += `<h3 class="sub">Plan B market</h3><p class="small">Other teams' unprotected players. Sign them with no compensation.</p><div class="list">${pool.map(p => prow(p, esc(L.teams[p.team].abbr), `<button class="btn sm" data-act="sign" data-id="${p.id}">Sign ${G.money(G.askPrice(L, p))}</button>`)).join('')}</div>`;
  }
  if (F.era === 'comp' || F.era === 'planb') {
    const tg = ctFilter(G.sheetTargets(L).filter(p => !F.done[p.id])).slice(0, 25);
    if (tg.length) h += `<h3 class="sub">Offer sheet targets</h3><p class="small">Unsigned players on other teams. If his team doesn't match, he's yours and you give up the draft picks shown.</p><div class="list">${tg.map(p => { const sal = Math.round(G.askPrice(L, p) * 1.2); return prow(p, esc(L.teams[p.team].abbr) + ' · costs ' + G.compPicks(L, sal).map(r => 'R' + r).join('+'), `<button class="btn sm" data-act="sheet" data-id="${p.id}">Offer ${G.money(sal)}</button>`); }).join('')}</div>`;
  }
  return h + '</section>';
}

function reasonsText(rs) {
  if (!rs || !rs.length) return '';
  return '<br>' + rs.map(([s, t]) => s ? `<span class="${s === '+' ? 'good' : 'bad'}">${s === '+' ? '▲' : '▼'} ${esc(t)}</span>` : `<span>• ${esc(t)}</span>`).join(' · ');
}
function marketHeader(F) {
  const done = F.round > G.FA_ROUNDS;

  const btn = done ? '' : `<button class="btn primary" data-act="advanceFA">${F.round === 0 ? 'Start free agency (resolve round 1)' : `Resolve round ${F.round + 1}`}</button>`;
  const mine = (F.last || []).filter(x => x.tid === L.user);
  const lost = (F.last || []).filter(x => x.tid !== L.user && x.bidders.includes(L.user));
  return `<div class="faround"><div class="split"><b>${label}</b><span class="small">${Object.keys(F.bids || {}).length} bid${Object.keys(F.bids || {}).length === 1 ? '' : 's'} placed</span></div>
    ${F.last ? `<p class="small">Last round: ${F.last.length} players signed. ${mine.length ? `<span class="good">You signed ${mine.map(x => esc(L.players[x.pid].name)).join(', ')}.</span>` : ''} ${lost.length ? `<span class="bad">You lost ${lost.map(x => esc(L.players[x.pid].name) + ' to ' + esc(L.teams[x.tid].abbr)).join(', ')}.</span>` : ''}</p>` : ''}
    <p class="small">Each round, every free agent picks the best offer: money and years, plus team record, scheme fit, playing time, and loyalty. Anyone who doesn't sign lowers his price for the next round. After round ${G.FA_ROUNDS}, leftovers sign cheaply with whoever has room.</p>

function ctFilter(list) {

}
// Other teams' expected offers for a free agent (estimates: real bids land within a few percent).
function marketLine(p, mine) {
  const v = G.marketView(L, p.id, mine && mine.sal, mine && mine.yrs), others = v.offers.filter(o => o.tid !== L.user);

  return `<span class="small">Expected offers: ${others.map(o => `<span class="${o === lead ? 'warn' : ''}">${esc(L.teams[o.tid].abbr)} ≈${G.money(o.sal)}×${o.yrs}${o === lead ? ' (leading)' : ''}</span>`).join(' · ')}</span>`;
}
function marketList(F) {

  const allFA = G.freeAgents(L).filter(p => p.retiredYear == null && (g === 'ALL' || p.grp === g) && (!q || p.name.toLowerCase().includes(q))).sort(srt);

    const fit = G.fitFor(L, p, L.user);
    const bidUI = b ? `<div class="bid"><span>Your bid <b>${G.money(b.sal)}</b> × <b>${b.yrs}</b> yr${b.yrs > 1 ? 's' : ''}</span>
        <span class="bidctl"><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal-">−$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="sal+">+$</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs-">−yr</button><button class="btn sm ar" data-act="bid" data-id="${p.id}" data-key="yrs+">+yr</button><button class="btn sm" data-act="bid" data-id="${p.id}" data-key="x">Withdraw</button></span>
        <span class="small ${o && (o.label.startsWith('Below') || o.label.startsWith('Ranked')) ? 'bad' : 'good'}">${o ? esc(o.label) : ''}</span>${marketLine(p, b)}</div>`
      : `<div class="bid"><button class="btn sm primary" data-act="bid" data-id="${p.id}" data-key="new">Bid ${G.money(ask)}</button>${marketLine(p, null)}</div>`;
    return `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(p.pos)}</span><div class="pl-name">${pLink(p)}<div class="pl-sub">Age ${p.age + 1} · ${p.prevTeam != null && L.teams[p.prevTeam] ? 'was ' + esc(L.teams[p.prevTeam].abbr) + ' · ' : ''}asking ${G.money(ask)} · scheme fit <b>${G.playerFit(L, p, L.user).grade}</b>${reasonsText(fit.reasons)}</div></div>

    <label class="fld">Sort<select id="mktSort">${[['ovr', 'Overall'], ['pot', 'Potential / Scout'], ['ask', 'Asking price'], ['age', 'Youngest'], ['pos', 'Position']].map(([k, n]) => `<option value="${k}"${so === k ? ' selected' : ''}>${n}</option>`).join('')}</select></label>

    <p class="small">${allFA.length} free agent${allFA.length === 1 ? '' : 's'}${g !== 'ALL' ? ' at ' + grpName[g].toLowerCase() : ''}${q ? ` matching "${esc(ui.mktQ)}"` : ''}.</p>

    .concat((pkg.picks || []).map(id => { const k = G.pickById(L, id); return k ? `${esc(G.pickLabel(L, k))} pick <span class="small">≈#${G.projectedOverall(L, k)}</span>` : ''; })).filter(Boolean).join('<br>');

/* ---------- camp report, expansion draft, ring of honor ---------- */
// Over the cap at camp: every way out, with what each one saves this season
function capPlanCard(cp) {
  const line = (r, sub, btn) => `<div class="pl wide"><div class="pl-main"><span class="pos">${esc(r.pos)}</span><div class="pl-name"><button class="lnk" data-act="pl" data-id="${r.id}">${esc(r.name)}</button><div class="pl-sub">Age ${r.age} · ${G.money(r.sal)} this year${r.starter ? ' · <b>starter</b>' : ''}${sub ? ' · ' + sub : ''}</div></div>
    <div class="pl-r"><span class="lbl">OVR</span>${rating(r.ovr)}</div><div class="pl-r"><span class="lbl">SAVES</span><b class="good">${G.money(r.saves)}</b></div></div><div class="pl-btns">${btn}</div></div>`;
  const sec = (title, why, rows) => rows.length ? `<h4>${title}</h4><p class="small">${why}</p><div class="list">${rows.join('')}</div>` : '';
  const ps = cp.psCount ? ` Your ${cp.psCount} practice-squad player${cp.psCount > 1 ? 's' : ''} already count${cp.psCount > 1 ? '' : 's'} ${G.money(cp.psPay)} each.` : '';
  return `<section class="card offers"><div class="eyebrow">Salary cap</div><h3>Get under the cap: ${G.money(cp.over)} to clear</h3>
    <p class="small">Payroll ${G.money(cp.pay)} vs. a ${cp.y} cap of ${G.money(cp.cap)}. Any move that lowers your payroll is always allowed, even while you're over. Savings below are for this season, after dead money.</p>
    ${sec('Cut players', 'You save his salary minus any dead money (bonus money not yet counted). Biggest savings first; starters are marked.', cp.cut.map(r => line(r, r.dead ? `${G.money(r.dead)} dead money` : 'no dead money', confirmBtn('rel' + r.id, `Cut (saves ${G.money(r.saves)})`))))}
    ${sec('June 1 cuts', 'Two per year. Only this year\'s share of his bonus hits now; the rest moves to next year\'s cap.', cp.june1.map(r => line(r, `${G.money(r.now)} now, ${G.money(r.later)} next year`, confirmBtn('rlj' + r.id, `June 1 cut (saves ${G.money(r.saves)})`))))}
    ${sec('Restructure', 'He keeps all his money: part of his salary becomes a signing bonus spread over the rest of his deal. Saves cap now, costs more later.', cp.rest.map(r => line(r, '', confirmBtn('rst' + r.id, `Restructure (saves ${G.money(r.saves)})`))))}
    ${sec('Move young backups to the practice squad', `He comes off the roster and earns practice-squad pay (${G.money(cp.psPay)}) instead.${ps}`, cp.toPS.map(r => line(r, '', `<button class="btn sm" data-act="psDown" data-id="${r.id}">To practice squad (saves ${G.money(r.saves)})</button>`)))}
    <h4>Trade players</h4><p class="small">A trade that sends out more salary than it brings back is always allowed while you're over. Offer an expensive veteran for a pick or a cheaper player.</p>
    <div class="row"><button class="btn sm" data-act="tab" data-id="moves">Go to trades</button></div>
    <h4>Filling the roster afterwards</h4><p class="small">Promoting a practice-squad player raises him to the minimum salary (${G.money(cp.minSal)}). His practice-squad pay is already on your cap, so a promotion adds only about <b>${G.money(cp.promote)}</b>. It's allowed whenever you have that much room. Real NFL rules work the same way: practice-squad pay counts against the cap, and a promoted player earns at least the minimum. You can also just kick off with fewer than ${cp.max} players: there's no roster minimum.</p></section>`;
}
function campCard() {

  const show = ui.campAll ? 99 : 6;

    <div class="trade"><div><div class="eyebrow">Biggest gains</div><div class="list">${up.slice(0, show).map(line).join('') || '<p class="small">None.</p>'}</div></div>
    <div><div class="eyebrow">Biggest drops</div><div class="list">${down.slice(0, show).map(line).join('') || '<p class="small">None.</p>'}</div></div></div>
    ${C.league.length ? `<h3 class="sub">Around the league</h3><div class="list">${C.league.slice(0, ui.campAll ? 40 : 5).map(r => { const d = r.a - r.b; return `<div class="pl"><div class="pl-main"><span class="pos">${esc(r.pos)}</span><div class="pl-name">${esc(r.name)}<div class="pl-sub">${esc(L.teams[r.tid].abbr)} · age ${r.age}</div></div><div class="pl-r"><span class="lbl">WAS</span>${rating(r.b)}</div><div class="pl-r"><span class="lbl">NOW</span>${rating(r.a)}</div><span class="delta ${d > 0 ? 'good' : 'bad'}">${d > 0 ? '▲' + d : '▼' + (-d)}</span></div></div>`; }).join('')}</div>` : ''}
    <div class="row"><button class="btn sm" data-act="campAll">${ui.campAll ? 'Show less' : 'Show full report'}</button></div></section>`;
}
// Your own expansion draft: pick players other teams left unprotected
function expDraftCard() {
  const X = L.exp; if (!X) return '';
  const R0 = G.expRules(X.y), clock = G.expOnClock(L), mineN = X.log.filter(e => e.tid === L.user).length, left = X.want[L.user];
  const others = X.teams.filter(id => id !== L.user);
  const g = ui.expGrp || 'ALL', ft = ui.expTeam == null ? -1 : +ui.expTeam, srt = ui.expSort || 'ovr';
  const byTeam = {}; X.avail.forEach(id => { const p = L.players[id]; if (p) byTeam[p.team] = (byTeam[p.team] || 0) + 1; });
  const tName = id => L.teams[id].abbr;

const FAM_TXT = { run: 'Run-first', bal: 'Balanced', pass: 'Pass-first', soft: "Bend, don't break", blitz: 'Pressure' };

  const rows = list.map(x => {
    const fit = G.schemeFit(raw, G.SCHEME[x.id]), tw = G.trendWord(L, x.id), n = Math.round(G.schemeShare(L, x.id) * L.teams.length), on = x.id === cur;
    const tf = G.teamFit(L, L.user, side === 'off' ? { os: x.id } : { ds: x.id }), yi = tf.yearsIn[side];

      <div class="pl-sub">${esc(FAM_TXT[x.fam])} · ${yrs(x)} · ${n} team${n === 1 ? '' : 's'}${tw ? ` · <span class="${tw.c}">${esc(tw.t)}</span>` : ''}</div>

      <div class="pl-r"><span class="lbl">FIT</span><span class="fit ${fit > 0.4 ? 'good' : fit < -0.4 ? 'bad' : ''}">${fit >= 0 ? '+' : ''}${fit.toFixed(1)}</span></div>

  }).join('');

  const help = side === 'off'

  return `<section class="card"><h3>${nm}</h3><p class="small">${help}</p><div class="list">${rows}</div>${side === 'def' ? '<p class="small">Set a different run/pass lean for one game on the Office tab.</p>' : ''}</section>`;
}
function fitCard() {

function importText(text, kind, key) {
  const res = G.parsePFR(text);
  if (kind && res.kind !== kind) throw new Error(`That looks like a ${res.kind} table, not a ${kind} table.`);
  if (res.kind === 'roster') { IM.rosters[key] = res.rows; return `Imported ${res.rows.length} players for ${key}.`; }
  IM.drafts[key] = res.rows; return `Imported ${res.rows.length} prospects for the ${key} draft.`;
}

async function onFiles(files) {
  const out = [];
  for (const f of files) {
    const text = await f.text(), base = f.name.toLowerCase().replace(/\.[a-z]+$/, '');
    try {
      const res = G.parsePFR(text);
      if (res.kind === 'roster') {
        const code = G.TEAMS_1970.find(t => base.includes(t[0]));
        if (!code) { out.push(`${f.name}: name it with the team code, like nor.csv.`); continue; }
        IM.rosters[code[0]] = res.rows; out.push(`${code[0]} ✓`);
      } else {
        const y = (base.match(/(19|20)\d\d/) || [])[0];
        if (!y) { out.push(`${f.name}: include the year in the name, like draft1971.csv.`); continue; }
        IM.drafts[+y] = res.rows; out.push(`draft ${y} ✓`);
      }
    } catch (e) { out.push(`${f.name}: ${e.message}`); }
  }
  flash(out.join(' · ')); save(); render();
}
